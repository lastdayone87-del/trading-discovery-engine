name: Browser community fallback

on:
  pull_request:
    paths:
      - 'server/browserCommunityFallback.ts'
      - 'server/browserCommunityFallback.test.ts'
      - 'server/browserCommunityFallback.integration.test.ts'
      - 'server/inspector.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'nixpacks.toml'
      - '.github/workflows/browser-community-fallback.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify Chromium is installed
        run: npx playwright install --list
      - run: node --import tsx --test server/browserCommunityFallback.test.ts server/browserCommunityFallback.integration.test.ts
      - run: npm run lint
