name: Provider2 Fail Closed Applicator
# rerun after correcting the focused regression contract
on:
  push:
    branches: [hardening/provider2-fail-closed]
    paths:
      - '.github/workflows/provider2-fail-closed-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/provider2-fail-closed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply narrow fail-closed defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/queueManager.ts')
          s=p.read_text()
          old1="process.env.YOUTUBE_INNERTUBE_AUTONOMOUS_ENABLED || 'true'"
          old2="process.env.YOUTUBE_JS_HYBRID_ENRICHMENT_ENABLED||'true'"
          if old1 not in s: raise SystemExit('missing autonomous fallback anchor')
          if old2 not in s: raise SystemExit('missing hybrid fallback anchor')
          s=s.replace(old1,"process.env.YOUTUBE_INNERTUBE_AUTONOMOUS_ENABLED || 'false'",1)
          s=s.replace(old2,"process.env.YOUTUBE_JS_HYBRID_ENRICHMENT_ENABLED||'false'",1)
          p.write_text(s)
          PY
      - name: Focused regression
        run: node --import tsx --test server/provider2FailClosed.test.ts server/restoreOfficialEnrichmentFlow.test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit implementation and remove applicator
        run: |
          rm .github/workflows/provider2-fail-closed-apply.yml
          git config user.name 'provider2-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server/queueManager.ts .github/workflows/provider2-fail-closed-apply.yml
          git commit -m 'Fail closed on retained YouTube provider flags'
          git push origin HEAD:hardening/provider2-fail-closed
