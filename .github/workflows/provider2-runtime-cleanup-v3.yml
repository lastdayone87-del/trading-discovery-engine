name: Apply Provider2 runtime cleanup v3

on:
  push:
    branches:
      - fix/remove-provider2-runtime
    paths:
      - .github/workflows/provider2-runtime-cleanup-v3.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-provider2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply runtime cleanup
        run: python3 scripts/applyProvider2RemovalCleanup.py
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify no active Provider2 runtime remnants
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          find server src scripts -type f \( -name '*.ts' -o -name '*.tsx' \) \
            ! -name '*.test.ts' \
            ! -path 'server/db/migrations/*' \
            ! -path 'scripts/applyProvider2RemovalCleanup.py' -print0 \
            | xargs -0 grep -n -E 'youtubeInnerTubeProvider|youtubeInnerTubeEnrichment|innerTubeLane|YOUTUBE_INNERTUBE_|YOUTUBE_JS_HYBRID_ENRICHMENT_ENABLED|youtube_inner_tube_|youtube_js_hybrid_enrichment_enabled|fetchYouTubeChannelEnrichmentQuotaFree' > "$tmp" || true
          if [ -s "$tmp" ]; then cat "$tmp"; echo 'Provider2 runtime symbols remain.'; exit 1; fi
          if grep -n 'youtubei.js' package.json package-lock.json; then echo 'youtubei.js dependency remains.'; exit 1; fi
      - name: Install dependencies
        run: npm ci
      - name: Focused restoration tests
        run: node --import tsx --test server/provider2Removal.contract.test.ts server/restoreOfficialEnrichmentFlow.test.ts server/retryPendingUi.contract.test.ts
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          rm -f \
            .github/workflows/provider2-runtime-cleanup.yml \
            .github/workflows/provider2-runtime-cleanup-v2.yml \
            .github/workflows/provider2-runtime-cleanup-v3.yml \
            scripts/applyProvider2RemovalCleanup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Provider 2 runtime paths'
          git push origin HEAD:fix/remove-provider2-runtime
