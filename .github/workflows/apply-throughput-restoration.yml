# retrigger with malformed-diff recount and coherent corrected exports
name: Apply throughput restoration

on:
  push:
    branches:
      - fix/restore-pre203-throughput-semantics-v4
    paths:
      - .github/workflows/apply-throughput-restoration.yml

permissions:
  contents: write
  issues: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-pre203-throughput-semantics-v4
          fetch-depth: 0

      - name: Apply validated per-file diffs sequentially
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          apply_comment_diff() {
            local id="$1"
            local label="$2"
            local tmp="/tmp/${id}.patch"
            gh api "repos/${GH_REPO}/issues/comments/${id}" --jq .body \
              | awk '/^```diff$/{capture=1;next} /^```$/{if(capture)exit} capture' > "$tmp"
            echo "---- validating ${label} (${id}) ----"
            sed -n '1,8p' "$tmp"
            test -s "$tmp" || { echo "Empty diff for ${label}"; exit 1; }
            git apply --recount --check "$tmp" || { echo "FAILED DIFF: ${label} (${id})"; nl -ba "$tmp" | sed -n '1,220p'; exit 1; }
            git apply --recount "$tmp"
          }

          db_id="$(gh api --paginate "repos/${GH_REPO}/issues/234/comments" | jq -r '[.[] | select(.user.login=="chatgpt-codex-connector[bot]" and (.body|contains("diff --git a/server/db.ts")) and (.body|contains("export async function topUpQuotaReservation")))] | sort_by(.created_at) | last | .id // empty')"
          youtube_id="$(gh api --paginate "repos/${GH_REPO}/issues/234/comments" | jq -r '[.[] | select(.user.login=="chatgpt-codex-connector[bot]" and (.body|contains("diff --git a/server/youtube.ts")) and (.body|contains("onAdditionalQuota")))] | sort_by(.created_at) | last | .id // empty')"
          test -n "$db_id" || { echo "Corrected db.ts export unavailable"; exit 1; }
          test -n "$youtube_id" || { echo "Corrected youtube.ts export unavailable"; exit 1; }
          echo "Using corrected db.ts comment ${db_id}"
          echo "Using corrected youtube.ts comment ${youtube_id}"

          # scheduler.ts is already committed on this branch. Apply the remaining
          # coherent final-state diffs only once; corrected db.ts subsumes the
          # earlier incomplete db export.
          apply_comment_diff 5296957897 queueManager.ts
          apply_comment_diff "$db_id" db.ts
          apply_comment_diff 5296967412 operationalMaintenanceWorkers.ts
          apply_comment_diff 5296960149 src-types-index.ts
          apply_comment_diff "$youtube_id" youtube.ts
          apply_comment_diff 5296980175 pre203-contract-test.ts
          apply_comment_diff 5296982146 providerRetryPolicy.test.ts
          apply_comment_diff 5296979506 youtubeRequestScheduler.test.ts

          git diff --check

      - name: Validate restoration
        run: |
          set -euo pipefail
          node --import tsx --test \
            server/pre203ThroughputRestoration.contract.test.ts \
            server/youtubeRequestScheduler.test.ts \
            server/youtube429SchedulerFeedback.test.ts \
            server/quotaRecovery.test.ts \
            server/operationalMaintenanceWorkers.test.ts \
            server/providerRetryPolicy.test.ts
          npm run lint
          npm run build
          git diff --check

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-throughput-restoration.yml
          git add -A
          git commit -m "Restore safe incremental YouTube throughput"
          git push origin HEAD:fix/restore-pre203-throughput-semantics-v4
