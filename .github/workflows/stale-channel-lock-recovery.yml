name: Stale Channel Lock Recovery
on:
  pull_request:
    paths:
      - 'server/db/migrations/090_reconcile_stale_channel_locks.sql'
      - 'server/staleChannelLockRecovery.test.ts'
      - '.github/workflows/stale-channel-lock-recovery.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node --import tsx --test server/staleChannelLockRecovery.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
