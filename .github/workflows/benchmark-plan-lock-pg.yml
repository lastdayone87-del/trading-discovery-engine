name: Benchmark plan lock PostgreSQL

on:
  pull_request:
    paths:
      - 'server/benchmarkPlanLock.ts'
      - 'server/benchmarkPlanLock.postgres.test.ts'
      - 'scripts/runBenchmarkPreregV1.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/benchmark-plan-lock-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: benchmark_plan_lock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d benchmark_plan_lock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/benchmark_plan_lock_test
      BENCHMARK_PLAN_LOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/benchmark_plan_lock_test
      PGSSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # No migrations: pg_try_advisory_lock needs no tables. The suite skips
      # without BENCHMARK_PLAN_LOCK_TEST_DATABASE_URL (never the default).
      - name: Benchmark plan lock PostgreSQL tests
        run: npx tsx --test server/benchmarkPlanLock.postgres.test.ts
