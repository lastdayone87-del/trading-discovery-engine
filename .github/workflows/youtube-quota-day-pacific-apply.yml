name: YouTube Pacific Quota Day Applicator
on:
  push:
    branches: [fix/youtube-quota-day-pacific]
    paths:
      - '.github/workflows/youtube-quota-day-pacific-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/youtube-quota-day-pacific
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply Pacific quota-day helper to quota tracker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/db.ts')
          s=p.read_text()
          anchor="import { calculateYouTubeDailyBudget } from './quotaPolicy';"
          imp="import { getYouTubeQuotaDay } from './youtubeQuotaDay';"
          if imp not in s:
              if anchor not in s: raise SystemExit('missing quotaPolicy import anchor')
              s=s.replace(anchor,anchor+'\n'+imp,1)
          old_today="const today=new Date().toISOString().split('T')[0]"
          if old_today not in s: raise SystemExit('missing getQuota UTC day anchor')
          s=s.replace(old_today,"const today=getYouTubeQuotaDay()",1)
          old_day="const quotaDay = new Date().toISOString().slice(0, 10);"
          if old_day not in s: raise SystemExit('missing reservation UTC day anchor')
          s=s.replace(old_day,"const quotaDay = getYouTubeQuotaDay();",1)
          s=s.replace('first worker after UTC midnight','first worker after the YouTube Pacific quota-day rollover',1)
          s=s.replace('until the next UTC day','until the next YouTube Pacific quota day',1)
          p.write_text(s)
          PY
      - name: Focused quota-day regression
        run: node --import tsx --test server/youtubeQuotaDay.test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit implementation and remove applicator
        run: |
          rm .github/workflows/youtube-quota-day-pacific-apply.yml
          git config user.name 'youtube-quota-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server/db.ts server/youtubeQuotaDay.ts server/youtubeQuotaDay.test.ts .github/workflows/youtube-quota-day-pacific-apply.yml
          git commit -m 'Align YouTube quota tracker with Pacific quota day'
          git push origin HEAD:fix/youtube-quota-day-pacific
