name: Apply PostgreSQL startup retry

on:
  push:
    branches: [fix/postgres-startup-retry]
    paths:
      - scripts/apply_postgres_startup_retry.py
      - .github/workflows/postgres-startup-retry-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/postgres-startup-retry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply_postgres_startup_retry.py
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/db.ts
          git commit -m 'Retry transient PostgreSQL startup recovery'
          git rm scripts/apply_postgres_startup_retry.py .github/workflows/postgres-startup-retry-apply.yml
          git commit -m 'Remove one-time PostgreSQL startup retry helpers'
          git push origin HEAD:fix/postgres-startup-retry
