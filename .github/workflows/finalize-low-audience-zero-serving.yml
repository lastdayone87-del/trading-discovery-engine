name: Finalize low-audience zero serving

on:
  push:
    branches:
      - fix/low-audience-zero-serving

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/low-audience-zero-serving
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Normalize defensive SQL and migration
        run: |
          python - <<'PY'
          from pathlib import Path
          db=Path('server/db.ts')
          text=db.read_text()
          old="subscriber_count ~ '^\\\\\\\\d+$' AND subscriber_count::integer < 30"
          if old not in text:
              # tolerate source representation with fewer escaped slashes
              old="subscriber_count ~ '^\\\\d+$' AND subscriber_count::integer < 30"
          if old not in text:
              raise SystemExit('sub-30 serving regex not found')
          text=text.replace(old,"subscriber_count ~ '^[0-9]+$' AND subscriber_count::integer < 30",1)
          db.write_text(text)

          migration=Path('server/db/migrations/097_reconcile_low_audience_zero_and_stale_rows.sql')
          text=migration.read_text()
          text=text.replace("SET scan_status = 'SKIPPED_LOW_AUDIENCE',\n    updated_at = now()\n", "SET scan_status = 'SKIPPED_LOW_AUDIENCE'\n")
          text=text.replace("subscriber_count ~ '^\\d+$'", "subscriber_count ~ '^[0-9]+$'")
          migration.write_text(text)

          Path('.github/workflows/finalize-low-audience-zero-serving.yml').unlink()
          PY
      - name: Focused tests
        run: node --import tsx --test server/lowAudienceGate.test.ts server/lowAudienceDashboardVisibility.test.ts
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden low-audience reconciliation SQL'
          git push origin HEAD:fix/low-audience-zero-serving
