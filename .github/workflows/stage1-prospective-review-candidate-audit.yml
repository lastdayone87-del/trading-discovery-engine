name: Stage 1 prospective review candidate audit

on:
  workflow_dispatch:
    inputs:
      adjudication_queue_per_class:
        description: 'Number of read-only human-review candidates to surface in each hint lane'
        required: false
        default: '10'
  pull_request:
    paths:
      - 'scripts/stage1ProspectiveReviewCandidateAudit.ts'
      - 'server/stage1/balancedProspectiveCandidateSelector.ts'
      - 'tests/stage1BalancedProspectiveCandidateSelector.test.ts'
      - '.github/workflows/stage1-prospective-review-candidate-audit.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build
        run: npm run build
      - name: Test balanced candidate selector
        run: node --import tsx --test tests/stage1BalancedProspectiveCandidateSelector.test.ts
      - name: Verify read-only boundary
        run: |
          set -euo pipefail
          grep -q "BEGIN TRANSACTION READ ONLY" scripts/stage1ProspectiveReviewCandidateAudit.ts
          grep -q "servingAuthority: false" scripts/stage1ProspectiveReviewCandidateAudit.ts
          grep -q "humanDecisionRequired: true" scripts/stage1ProspectiveReviewCandidateAudit.ts
          grep -q "READY_FOR_INDEPENDENT_ADJUDICATION" scripts/stage1ProspectiveReviewCandidateAudit.ts
          grep -q "operationalStatusIsNotGroundTruth: true" scripts/stage1ProspectiveReviewCandidateAudit.ts
          grep -q "hintsAreGroundTruth: false" server/stage1/balancedProspectiveCandidateSelector.ts
          grep -q "servingAuthority: false" server/stage1/balancedProspectiveCandidateSelector.ts
          grep -q "queueMutation: false" server/stage1/balancedProspectiveCandidateSelector.ts
          ! grep -E "\b(INSERT|UPDATE|DELETE|TRUNCATE|ALTER|CREATE|DROP)\b" scripts/stage1ProspectiveReviewCandidateAudit.ts

  production-audit:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    env:
      STAGE1_ADJUDICATION_QUEUE_PER_CLASS: ${{ inputs.adjudication_queue_per_class || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Inspect prospective review and independent-adjudication candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:+x}"
          npx tsx scripts/stage1ProspectiveReviewCandidateAudit.ts | tee stage1-prospective-review-candidate-console.json
          test -f stage1-output/stage1-prospective-review-candidate-audit.json
          test -f stage1-output/stage1-independent-adjudication-worklist.md
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-prospective-review-candidate-audit-${{ github.run_id }}
          path: |
            stage1-output/stage1-prospective-review-candidate-audit.json
            stage1-output/stage1-independent-adjudication-worklist.md
            stage1-prospective-review-candidate-console.json
          retention-days: 30
