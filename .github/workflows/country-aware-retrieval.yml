name: Country-aware retrieval

on:
  pull_request:
    paths:
      - 'server/countrySearchHints.ts'
      - 'server/countrySearchHints.test.ts'
      - 'server/countryInference.ts'
      - 'server/countryInference.test.ts'
      - 'server/countryValidator.ts'
      - 'server/historicalCountryBoundaryRecovery.test.ts'
      - 'server/db/migrations/124_reconcile_historical_uncertain_country_rejections.sql'
      - 'server/youtube.ts'
      - '.github/workflows/country-aware-retrieval.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Country-aware retrieval and country-boundary tests
        run: node --import tsx --test server/countrySearchHints.test.ts server/countryInference.test.ts server/historicalCountryBoundaryRecovery.test.ts
      - name: Existing retrieval safety tests
        run: node --import tsx --test server/autonomousRetrievalSafety.test.ts server/queryPlanner.test.ts
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
