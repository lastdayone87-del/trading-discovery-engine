name: Autonomous retrieval safety

on:
  pull_request:
    paths:
      - 'server/retrievalSpecificity.ts'
      - 'server/retrievalSpecificity.test.ts'
      - 'server/queryPerformance.ts'
      - 'server/queryPerformance.test.ts'
      - 'server/autonomousRetrievalSafety.test.ts'
      - '.github/workflows/autonomous-retrieval-safety-pr.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Retrieval safety tests
        run: node --import tsx --test server/retrievalSpecificity.test.ts server/autonomousRetrievalSafety.test.ts server/queryPerformance.test.ts server/queryPlanner.test.ts
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
