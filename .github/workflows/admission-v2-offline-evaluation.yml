name: Admission V2 offline evaluation

on:
  workflow_dispatch:
    inputs:
      dataset_uuid:
        description: Sealed decision-evaluation dataset UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-v2-offline-${{ github.event.inputs.dataset_uuid }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate sealed dataset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dataset UUID
        env:
          DATASET_UUID: ${{ github.event.inputs.dataset_uuid }}
        run: |
          if [[ ! "$DATASET_UUID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "dataset_uuid must be a valid sealed evaluation dataset UUID" >&2
            exit 1
          fi

      - name: Run Admission V2 offline evaluation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATASET_UUID: ${{ github.event.inputs.dataset_uuid }}
          NODE_ENV: production
        run: |
          test -n "$DATABASE_URL"
          mkdir -p admission-v2-output
          npm run admission:v2-poc -- "$DATASET_UUID" \
            > "admission-v2-output/admission-v2-${DATASET_UUID}.json"

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: admission-v2-report-${{ github.run_id }}
          path: admission-v2-output/*.json
          if-no-files-found: error
          retention-days: 30
