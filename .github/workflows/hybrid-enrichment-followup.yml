name: Harden hybrid enrichment no-video handling

on:
  push:
    branches:
      - feat/youtube-js-hybrid-enrichment
    paths:
      - .github/workflows/hybrid-enrichment-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/youtube-js-hybrid-enrichment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Remove false transient on legitimate empty upload feed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/youtube.ts')
          s=p.read_text()
          old="""  if(!inner.videos.length) throw new ProviderCallError(`YouTube.js enrichment returned no recent videos for '${channelId}'.`,'TRANSIENT',true);\n"""
          if old not in s: raise SystemExit('no-video transient anchor missing')
          p.write_text(s.replace(old,'',1))
          PY
          cat >> server/youtubeInnerTubeEnrichment.test.ts <<'EOF'

          test('empty upload feed is a successful evidence acquisition result',async()=>{
            const client:any={getChannel:async()=>({has_videos:false,videos:[]}),getBasicInfo:async()=>{throw new Error('should not run');}};
            const result=await fetchInnerTubeChannelEnrichment('UCempty',{},client);
            assert.deepEqual(result.videos,[]);
            assert.equal(result.detailCalls,0);
          });
          EOF
      - run: node --import tsx --test server/youtubeInnerTubeEnrichment.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/youtube.ts server/youtubeInnerTubeEnrichment.test.ts
          git commit -m 'Treat empty YouTube.js upload feeds as valid evidence'
          git rm .github/workflows/hybrid-enrichment-followup.yml
          git commit -m 'Remove one-time hybrid enrichment follow-up'
          git push origin HEAD:feat/youtube-js-hybrid-enrichment
