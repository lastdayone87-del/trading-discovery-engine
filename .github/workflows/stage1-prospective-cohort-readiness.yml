name: Stage 1 prospective cohort readiness

on:
  pull_request:
    paths:
      - 'server/candidateAdmission/stage1ProspectiveCohortReadiness.ts'
      - 'server/candidateAdmission/stage1ProspectiveCohortReadiness.test.ts'
      - 'scripts/stage1ProspectiveCohortReadiness.ts'
      - '.github/workflows/stage1-prospective-cohort-readiness.yml'
      - 'server/candidateAdmission/stage1ReviewHistoryStorageAudit.ts'
      - 'server/operatorAuth.ts'
      - 'server/operatorAuth.test.ts'
  workflow_dispatch:
    inputs:
      minimum_per_class:
        description: 'Minimum eligible examples required per class'
        required: false
        default: '30'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Prospective readiness tests
        run: node --import tsx --test server/candidateAdmission/stage1ProspectiveCohortReadiness.test.ts server/operatorAuth.test.ts
      - name: Build
        run: npm run build
      - name: Verify read-only boundary
        run: |
          set -euo pipefail
          FILE=server/candidateAdmission/stage1ProspectiveCohortReadiness.ts
          grep -q 'BEGIN TRANSACTION READ ONLY' "$FILE"
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|ALTER|DROP|TRUNCATE)\b' "$FILE"

  production-audit:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
      STAGE1_MINIMUM_PER_CLASS: ${{ inputs.minimum_per_class || '30' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Run Stage 1 prospective cohort readiness audit
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:+x}"
          npx tsx scripts/stage1ProspectiveCohortReadiness.ts
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-prospective-cohort-readiness-${{ github.run_id }}
          path: stage1-output/stage1-prospective-cohort-readiness.json
          retention-days: 30
