name: Temporary enrichment scheduler starvation validation
on: push
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrichment-scheduler-starvation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused scheduler and throughput tests
        run: node --import tsx --test server/youtubeRequestScheduler.test.ts server/youtube429SchedulerFeedback.test.ts server/youtubePoolBackoff.test.ts server/youtubeProviderCooldown.test.ts server/pre203ThroughputRestoration.contract.test.ts server/providerRetryPolicy.test.ts server/enrichmentBacklogDrain.contract.test.ts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Remove temporary workflow after successful validation
        shell: bash
        run: |
          rm .github/workflows/temp-validate-enrichment-scheduler-starvation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-validate-enrichment-scheduler-starvation.yml
          git commit -m "Remove temporary scheduler validation workflow"
          git push origin HEAD:fix/enrichment-scheduler-starvation
