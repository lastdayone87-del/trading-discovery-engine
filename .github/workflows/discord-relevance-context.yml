name: Discord relevance context
on:
  pull_request:
    paths:
      - 'server/discordValidator.ts'
      - 'server/discordProjection.ts'
      - 'server/discordCandidates.ts'
      - 'server/queueManager.ts'
      - 'server/discordRelevanceContext.test.ts'
      - 'server/discordMultiCandidateOwnership.test.ts'
      - '.github/workflows/discord-relevance-context.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Discord relevance context regressions
        run: node --import tsx --test server/discordRelevanceContext.test.ts server/discordMultiCandidateOwnership.test.ts
      - name: Build
        run: npm run build
