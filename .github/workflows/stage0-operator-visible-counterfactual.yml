name: Stage 0 operator-visible counterfactual (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage0-operator-visible-counterfactual
  cancel-in-progress: false

jobs:
  measure:
    name: Read-only Stage 0 measurement
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stage 0 operator-visible counterfactual
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          test -n "$DATABASE_URL"
          mkdir -p stage0-output
          npm run stage0:operator-visible > stage0-output/stage0-console.json
          # Ensure artifact file exists even if console redirect differed
          test -f stage0-output/stage0-operator-visible-counterfactual.json

      - name: Upload Stage 0 report
        uses: actions/upload-artifact@v4
        with:
          name: stage0-operator-visible-counterfactual-${{ github.run_id }}
          path: stage0-output/*.json
          if-no-files-found: error
          retention-days: 30
