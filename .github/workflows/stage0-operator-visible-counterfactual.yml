name: Stage 0 operator-visible counterfactual (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage0-operator-visible-counterfactual
  cancel-in-progress: false

jobs:
  measure:
    name: Read-only Stage 0 measurement
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify Stage 0 evaluator is read-only and reuses Offline V2
        run: |
          set -euo pipefail
          test -f server/candidateAdmission/stage0OperatorVisible.ts
          grep -q 'evaluateOfflineAdmissionV2' server/candidateAdmission/stage0OperatorVisible.ts
          grep -q 'BEGIN TRANSACTION READ ONLY' server/candidateAdmission/stage0OperatorVisible.ts
          grep -q 'OPERATOR_VISIBLE_CHANNEL_SQL\|country_status <> .REJECTED' server/candidateAdmission/stage0OperatorVisible.ts
          ! grep -E 'PLACEHOLDER' server/candidateAdmission/stage0OperatorVisible.ts
          ! grep -E '\b(INSERT|UPDATE|DELETE)\b' server/candidateAdmission/stage0OperatorVisible.ts
          echo "Stage 0 evaluator checks passed"

      - name: Run Stage 0 operator-visible counterfactual
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:+x}"
          mkdir -p stage0-output
          npm run stage0:operator-visible > stage0-output/stage0-console.json
          test -f stage0-output/stage0-operator-visible-counterfactual.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("stage0-output/stage0-operator-visible-counterfactual.json").read_text())
          assert report.get("servingAuthority") is False
          assert report.get("readOnly") is True
          print("operatorVisible", report["totals"]["operatorVisibleChannels"])
          print("evaluated", report["totals"]["evaluatedWithFocusAndCoverage"])
          print("eligibility", report["totals"]["historicalEvidenceEligibilityRate"])
          print("reliable", report["totals"]["reliableForPopulationInference"])
          print("decisions", report["totals"]["decisionCounts"])
          PY

      - name: Upload Stage 0 report
        uses: actions/upload-artifact@v4
        with:
          name: stage0-operator-visible-counterfactual-${{ github.run_id }}
          path: stage0-output/*.json
          if-no-files-found: error
          retention-days: 30
