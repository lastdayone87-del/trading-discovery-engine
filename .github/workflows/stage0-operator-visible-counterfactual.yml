name: Stage 0 operator-visible counterfactual (temporary)

on:
  workflow_dispatch:
    inputs:
      evidence_mode:
        description: 'Evidence source for the read-only Stage 0 measurement'
        required: true
        default: 'persisted'
        type: choice
        options:
          - persisted
          - assertion-replay

permissions:
  contents: read

concurrency:
  group: stage0-operator-visible-counterfactual
  cancel-in-progress: false

jobs:
  measure:
    name: Read-only Stage 0 measurement
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify selected evaluator is read-only
        env:
          EVIDENCE_MODE: ${{ inputs.evidence_mode }}
        run: |
          set -euo pipefail
          if [ "$EVIDENCE_MODE" = "assertion-replay" ]; then
            FILE=server/candidateAdmission/stage0OperatorVisibleAssertionReplay.ts
            grep -q 'replayCreatorFocusFromDiagnostic' "$FILE"
            grep -q 'evaluateOfflineAdmissionV2' "$FILE"
          else
            FILE=server/candidateAdmission/stage0OperatorVisible.ts
            grep -q 'evaluateOfflineAdmissionV2' "$FILE"
          fi
          grep -q 'BEGIN TRANSACTION READ ONLY' "$FILE"
          ! grep -E 'PLACEHOLDER' "$FILE"
          ! grep -E '\b(INSERT|UPDATE|DELETE)\b' "$FILE"
          echo "Stage 0 evaluator checks passed for $EVIDENCE_MODE"

      - name: Run Stage 0 operator-visible counterfactual
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          EVIDENCE_MODE: ${{ inputs.evidence_mode }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:+x}"
          mkdir -p stage0-output
          if [ "$EVIDENCE_MODE" = "assertion-replay" ]; then
            npm run stage0:operator-visible-assertion-replay > stage0-output/stage0-console.json
            REPORT=stage0-output/stage0-operator-visible-assertion-replay.json
          else
            npm run stage0:operator-visible > stage0-output/stage0-console.json
            REPORT=stage0-output/stage0-operator-visible-counterfactual.json
          fi
          test -f "$REPORT"
          REPORT="$REPORT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['REPORT']).read_text())
          assert report.get('servingAuthority') is False
          assert report.get('readOnly') is True
          if report.get('evidenceMode') == 'ASSERTION_REPLAY':
              assert report.get('historicalReplay') is True
              assert report.get('persisted') is False
          print('reportType', report.get('reportType', 'PERSISTED_STAGE0'))
          print('totals', report.get('totals'))
          PY

      - name: Upload Stage 0 report
        uses: actions/upload-artifact@v4
        with:
          name: stage0-operator-visible-counterfactual-${{ github.run_id }}
          path: stage0-output/*.json
          if-no-files-found: error
          retention-days: 30
