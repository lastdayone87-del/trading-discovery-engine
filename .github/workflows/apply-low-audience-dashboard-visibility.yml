name: Apply low-audience dashboard visibility patch

on:
  push:
    branches:
      - fix/low-audience-dashboard-visibility
    paths:
      - 'scripts/apply-low-audience-dashboard-visibility.mjs'
      - '.github/workflows/apply-low-audience-dashboard-visibility.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/low-audience-dashboard-visibility
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-low-audience-dashboard-visibility.mjs
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/db.ts src/components/ResultsTable.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: isolate low-audience channels from default dashboard'
          git push origin HEAD:fix/low-audience-dashboard-visibility
