name: Stale channel lock recovery

on:
  pull_request:
    paths:
      - 'server/staleChannelLockRecovery.ts'
      - 'server/staleChannelLockRecovery.test.ts'
      - 'server/staleChannelLockRecovery.postgres.test.ts'
      - 'server/dbCore.ts'
      - 'server/queueManager.ts'
      - 'server/db/migrations/153_reconcile_channel_locks_on_terminal_jobs.sql'
      - 'scripts/runMigrations.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/stale-channel-lock-recovery-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stale_lock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stale_lock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stale_lock_test
      PGSSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to isolated test database
        run: npx tsx scripts/runMigrations.ts
      - name: Stale channel lock recovery PostgreSQL regression
        run: node --import tsx --test server/staleChannelLockRecovery.postgres.test.ts
      - name: Stale channel lock recovery unit tests
        run: node --import tsx --test server/staleChannelLockRecovery.test.ts
