name: PR237 dispatch-time provider failover fix
on:
  push:
    branches: [fix/restore-per-provider-429-failover]
permissions:
  contents: write
jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-per-provider-429-failover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply targeted fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/youtube.ts')
          s = p.read_text()
          start = s.index('async function youtubeFetch(')
          end = s.index('\nexport type YouTubeAdditionalQuotaCallback', start)
          replacement = '''async function youtubeFetch(url:string,operation:string,actualCost:number,attempt=1,acquisition?:YouTubePoolAcquisition,priority:YouTubeRequestPriority='enrichment',providerKey?:string):Promise<Response>{
            const traceId = `${operation}-${attempt}-${++outboundTraceSequence}`;
            const trace = (stage: string) => console.log(`[YouTube Outbound Trace] ${traceId} ${stage}`);
            trace('entered youtubeFetch; before timeout-setting-read at server/youtube.ts:119');
            const configuredTimeout=Number(await getAppSetting('youtube_provider_timeout_ms',process.env.YOUTUBE_PROVIDER_TIMEOUT_MS||'30000'));
            trace('after timeout-setting-read at server/youtube.ts:119');
            const timeout=Number.isFinite(configuredTimeout)&&configuredTimeout>0?configuredTimeout:30_000;
            // Provider selection happens before a request enters the shared scheduler. Re-check
            // the selected key at dispatch so a key cooled by an earlier queued 429 cannot be
            // used by work that was already waiting behind it.
            trace('before scheduler-run at server/youtube.ts:126');
            return youtubeRequestScheduler.run(()=>{
              if(providerKey&&!youtubeProviderCooldown.eligible(providerKey)){
                const retryAt=youtubeProviderCooldown.retryAt(providerKey);
                throw Object.assign(new Error(`Selected YouTube provider is cooling down until ${new Date(retryAt).toISOString()}.`),{
                  code:'YOUTUBE_PROVIDER_COOLING_DOWN',retryable:true,errorClass:'RATE_LIMIT',retryAt,
                  retryAfterMs:Math.max(0,retryAt-Date.now())
                });
              }
              return executeProviderCall({context:{provider:'youtube',operation,attempt,reservedCost:actualCost,actualCost},timeoutMs:timeout,enabled:true,emit:appendProviderCallEvent,trace,call:async signal=>{
                trace('before first-request-record at server/youtube.ts:128');
                await recordFirstYouTubeRequest(operation);
                trace('after first-request-record at server/youtube.ts:128');
                trace('before HTTP fetch at server/youtube.ts:131');
                const response=await fetch(url,{signal});
                trace(`after HTTP fetch at server/youtube.ts:131 (status=${response.status})`);
                if(!response.ok){
                  trace('before HTTP-error-body-read at server/youtube.ts:135');
                  const error=await youtubeHttpError(response,trace);
                  trace('after HTTP-error-body-read at server/youtube.ts:135');
                  throw error;
                }
                if(providerKey)youtubeProviderCooldown.succeeded(providerKey);
                acquisition?.providerSucceeded();return response;
              }});
            }, trace, priority);
          }
          '''
          s = s[:start] + replacement + s[end:]

          replacements = {
            "youtubeFetch(url, 'featured-channel-sections', FEATURED_CHANNEL_PROVIDER_COST, 1, acquisition)": "youtubeFetch(url, 'featured-channel-sections', FEATURED_CHANNEL_PROVIDER_COST, 1, acquisition, 'enrichment', keys[index])",
            "youtubeFetch(url,'playlist-items',1,attempt+1,acquisition)": "youtubeFetch(url,'playlist-items',1,attempt+1,acquisition,'enrichment',keys[index])",
            "youtubeFetch(searchUrl,'search',100,attempt+1,acquisition,priority)": "youtubeFetch(searchUrl,'search',100,attempt+1,acquisition,priority,apiKey)",
            "youtubeFetch(searchUrl,'recent-videos-search',100,attempt+1,acquisition)": "youtubeFetch(searchUrl,'recent-videos-search',100,attempt+1,acquisition,'enrichment',apiKey)",
            "youtubeFetch(videosUrl,'video-details',1,1,acquisition)": "youtubeFetch(videosUrl,'video-details',1,1,acquisition,'enrichment',apiKey)",
            "youtubeFetch(recentUrl,'channel-uploads',100,attempt+1,acquisition,priority)": "youtubeFetch(recentUrl,'channel-uploads',100,attempt+1,acquisition,priority,apiKey)",
            "youtubeFetch(channelUrl,'channel-details',1,attempt+1,acquisition,priority)": "youtubeFetch(channelUrl,'channel-details',1,attempt+1,acquisition,priority,apiKey)",
            "youtubeFetch(buildYouTubeApiUrl('search',apiKey,{part:'snippet',channelId,type:'playlist',maxResults:10}),'enrichment-playlists',100,attempt+1,acquisition,priority)": "youtubeFetch(buildYouTubeApiUrl('search',apiKey,{part:'snippet',channelId,type:'playlist',maxResults:10}),'enrichment-playlists',100,attempt+1,acquisition,priority,apiKey)",
            "youtubeFetch(buildYouTubeApiUrl('videos',apiKey,{part:'snippet',id:ids}),'enrichment-video-details',1,attempt+1,acquisition,priority)": "youtubeFetch(buildYouTubeApiUrl('videos',apiKey,{part:'snippet',id:ids}),'enrichment-video-details',1,attempt+1,acquisition,priority,apiKey)",
            "youtubeFetch(url, 'channel-country-metadata', 1, attempt + 1, acquisition)": "youtubeFetch(url, 'channel-country-metadata', 1, attempt + 1, acquisition, 'enrichment', keys[index])",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing expected call: {old}')
            s = s.replace(old, new)
          p.write_text(s)

          t = Path('server/youtubeRequestScheduler.test.ts')
          tests = t.read_text()
          marker = "test('search provider loop retains key failover after a rate-limited attempt', () => {"
          addition = r'''test('youtubeFetch rechecks provider eligibility at dispatch and clears provider-local 429 history on success', () => {
            const source = fs.readFileSync(new URL('./youtube.ts', import.meta.url), 'utf8');
            const youtubeFetch = source.slice(source.indexOf('async function youtubeFetch'), source.indexOf('export type YouTubeAdditionalQuotaCallback'));
            assert.match(youtubeFetch, /providerKey&&!youtubeProviderCooldown\.eligible\(providerKey\)/);
            assert.match(youtubeFetch, /youtubeProviderCooldown\.succeeded\(providerKey\)/);
            assert.match(youtubeFetch, /YOUTUBE_PROVIDER_COOLING_DOWN/);
          });

          test('provider-loop requests carry the selected API key into scheduler dispatch', () => {
            const source = fs.readFileSync(new URL('./youtube.ts', import.meta.url), 'utf8');
            assert.match(source, /youtubeFetch\(searchUrl,'search',100,attempt\+1,acquisition,priority,apiKey\)/);
            assert.match(source, /youtubeFetch\(recentUrl,'channel-uploads',100,attempt\+1,acquisition,priority,apiKey\)/);
            assert.match(source, /youtubeFetch\(channelUrl,'channel-details',1,attempt\+1,acquisition,priority,apiKey\)/);
          });

          '''
          if addition.strip() not in tests:
            if marker not in tests:
              raise SystemExit('test insertion marker missing')
            tests = tests.replace(marker, addition + marker)
          t.write_text(tests)
          PY
      - name: Validate
        run: |
          node --import tsx --test server/youtubeRequestScheduler.test.ts server/youtube429SchedulerFeedback.test.ts server/youtubeProviderCooldown.test.ts server/operationalMaintenanceWorkers.test.ts
          npm run lint
          npm run build
          git diff --check
      - name: Commit targeted fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr237-dispatch-failover-fix.yml
          git add server/youtube.ts server/youtubeRequestScheduler.test.ts
          git commit -m "Fix queued provider failover after 429"
          git push origin HEAD:fix/restore-per-provider-429-failover
