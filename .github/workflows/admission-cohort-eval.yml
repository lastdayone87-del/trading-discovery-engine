name: Admission cohort evaluation

on:
  pull_request:
    paths:
      - '.github/workflows/admission-cohort-eval.yml'
      - 'scripts/runAdmissionCohort.ts'
      - 'scripts/summarizeAdmissionCohort.ts'
      - 'scripts/fixtures/admission-cohort-60-preserved.jsonl'
      - 'scripts/fixtures/admission-cohort-60-ground-truth.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admission_cohort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d admission_cohort"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admission_cohort
      PGSSL: disable
      NODE_ENV: test
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_ORG_ID_2: ${{ secrets.GEMINI_ORG_ID_2 }}
      GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_API_KEY_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply migrations to disposable telemetry database
        run: npx tsx scripts/runMigrations.ts
      - name: Run 60-channel read-only cohort
        run: >-
          npx tsx scripts/runAdmissionCohort.ts
          --manifest=scripts/fixtures/admission-cohort-60-preserved.jsonl
          --out=admission-cohort-ai.jsonl
          --blind=admission-cohort-ai-blind.jsonl
          --concurrency=2
      - name: Summarize against independent ground truth
        run: >-
          npx tsx scripts/summarizeAdmissionCohort.ts
          --results=admission-cohort-ai.jsonl
          --ground-truth=scripts/fixtures/admission-cohort-60-ground-truth.json
          > admission-cohort-summary.json
      - name: Upload cohort evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-cohort-ai
          path: |
            admission-cohort-ai.jsonl
            admission-cohort-ai-blind.jsonl
            admission-cohort-summary.json
          if-no-files-found: warn
