name: Admission staging E2E

on:
  pull_request:
    paths:
      - '.github/workflows/admission-staging-e2e.yml'
      - 'scripts/admissionStagingE2E.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admission_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d admission_staging"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admission_staging
      ADMISSION_STAGING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admission_staging
      PGSSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply migrations to disposable PostgreSQL
        run: npx tsx scripts/runMigrations.ts
      - name: Admission database lifecycle E2E
        run: npx tsx scripts/admissionStagingE2E.ts --confirm-staging | tee admission-staging-e2e.log
      - name: Upload staging E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-staging-e2e
          path: admission-staging-e2e.log
          if-no-files-found: warn
