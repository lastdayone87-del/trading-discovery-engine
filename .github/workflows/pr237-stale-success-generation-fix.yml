name: PR237 stale success generation fix

on:
  push:
    branches:
      - fix/restore-per-provider-429-failover

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-per-provider-429-failover
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply stale-success generation fix
        run: node scripts/pr237-stale-success-generation-fix.mjs
      - name: Focused YouTube regressions
        run: node --import tsx --test server/youtubeProviderCooldown.test.ts server/youtubeRequestScheduler.test.ts server/youtubeLiveProviderDispatch.test.ts server/youtubePoolBackoff.test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/youtube.ts server/youtubeLiveProviderDispatch.test.ts server/youtubeRequestScheduler.test.ts server/youtubePoolBackoff.test.ts
          git commit -m "fix: ignore stale provider successes after newer failures"
          git push origin HEAD:fix/restore-per-provider-429-failover
