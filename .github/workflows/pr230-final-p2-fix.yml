name: PR230 final P2 fix

on:
  push:
    branches:
      - fix/post-merge-recheck-safety

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require explicitly typed transient recovery failures
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('server/queueManager.ts')
          text = p.read_text()

          transient_codes_start = text.find("const MANUAL_RECHECK_TRANSIENT_CODES = new Set([")
          classifier_start = text.find("function classifyManualRecheckAcquisitionFailure(error: any):")
          if classifier_start < 0:
              raise SystemExit('classifier start not found')
          if transient_codes_start >= 0:
              # Remove the now-forbidden code/message based transient allowlist.
              end = text.find("]);", transient_codes_start)
              if end < 0:
                  raise SystemExit('transient code set end not found')
              text = text[:transient_codes_start] + text[end + 3:]
              classifier_start = text.find("function classifyManualRecheckAcquisitionFailure(error: any):")

          classifier_end = text.find("/**\n * Triggers a manual re-scan", classifier_start)
          if classifier_end < 0:
              raise SystemExit('classifier end marker not found')

          replacement = """function classifyManualRecheckAcquisitionFailure(error: any): {
            errorClass?: ManualRecheckErrorClass;
            retryable: boolean;
            code: string;
            retryAt?: number;
            retryAfterMs?: number;
          } {
            const message = String(error?.message || error || '');
            const rawErrorClass = String(error?.errorClass || '').toUpperCase() as ManualRecheckErrorClass;
            const code = String(error?.code || error?.cause?.code || 'MANUAL_RESCAN_UPSTREAM_FAILURE');
            const status = Number(error?.status || error?.statusCode || error?.response?.status);
            const retryAt = Number(error?.retryAt);
            const retryAfterMs = Number(error?.retryAfterMs);

            // Attempt-free infrastructure retries are deliberately opt-in. The
            // upstream error itself must already carry a recognized transient
            // class and explicitly say it is retryable. Status codes, messages,
            // cooldown codes, and network-looking strings must never manufacture
            // transient semantics for migration-091 recovery.
            if (MANUAL_RECHECK_ERROR_CLASSES.has(rawErrorClass)) {
              return {
                errorClass: rawErrorClass,
                retryable: error?.retryable === true && MANUAL_RECHECK_TRANSIENT_CLASSES.has(rawErrorClass),
                code,
                retryAt: Number.isFinite(retryAt) ? retryAt : undefined,
                retryAfterMs: Number.isFinite(retryAfterMs) ? retryAfterMs : undefined
              };
            }

            // Untyped permanent/not-found outcomes may still be identified for
            // diagnostics, but they never receive attempt-free retry semantics.
            if (status === 404 || /channel ['\"][^'\"]+['\"] was not found|channel not found|does not exist|deleted channel/i.test(message)) {
              return { errorClass: 'PERMANENT_INPUT', retryable: false, code };
            }
            if ([400, 422].includes(status)) {
              return { errorClass: 'PERMANENT_INPUT', retryable: false, code };
            }

            // Every other untyped failure consumes the bounded normal attempt.
            return {
              retryable: false,
              code,
              retryAt: Number.isFinite(retryAt) ? retryAt : undefined,
              retryAfterMs: Number.isFinite(retryAfterMs) ? retryAfterMs : undefined
            };
          }

          """
          text = text[:classifier_start] + replacement + text[classifier_end:]
          p.write_text(text)

          # Strengthen the contract so future code/status/message heuristics cannot
          # silently re-enable attempt-free migration-091 retries.
          t = Path('server/postMergeRecheckSafety.contract.test.ts')
          tests = t.read_text()
          anchor = "const manualRecheck = queue.slice(manualStart, manualEnd);\n"
          if anchor not in tests:
              raise SystemExit('test anchor not found')
          if 'const failureClassifier' not in tests:
              tests = tests.replace(anchor, anchor + "const classifierStart = queue.indexOf('function classifyManualRecheckAcquisitionFailure');\nconst classifierEnd = queue.indexOf('/**\\n * Triggers a manual re-scan', classifierStart);\nconst failureClassifier = queue.slice(classifierStart, classifierEnd);\n", 1)
          extra = """
          test('attempt-free recovery requires explicit upstream transient typing', () => {
            assert.ok(classifierStart >= 0 && classifierEnd > classifierStart);
            assert.match(failureClassifier, /error\\?\\.retryable === true/);
            assert.match(failureClassifier, /MANUAL_RECHECK_TRANSIENT_CLASSES\\.has\\(rawErrorClass\\)/);
            assert.doesNotMatch(failureClassifier, /status === 429/);
            assert.doesNotMatch(failureClassifier, /MANUAL_RECHECK_TRANSIENT_CODES/);
            assert.doesNotMatch(failureClassifier, /temporar|cooling down|network failure|socket hang up/i);
          });
          """
          if "test('attempt-free recovery requires explicit upstream transient typing'" not in tests:
              tests += extra
          t.write_text(tests)
          PY
      - name: Focused regression tests
        run: node --import tsx --test server/postMergeRecheckSafety.contract.test.ts server/operationalMaintenanceWorkers.test.ts server/manualRecheckClassification.test.ts server/browserCommunityFallback.test.ts server/browserCommunityFallback.integration.test.ts server/provider2Removal.contract.test.ts server/retryLifecyclePolicy.test.ts server/providerResilience.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit final P2 fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/queueManager.ts server/postMergeRecheckSafety.contract.test.ts
          git commit -m "Require explicit transient typing for recovery retries"
          git push origin HEAD:fix/post-merge-recheck-safety
