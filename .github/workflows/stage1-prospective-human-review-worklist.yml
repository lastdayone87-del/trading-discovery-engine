name: Stage 1 prospective human review worklist

on:
  pull_request:
    paths:
      - 'server/candidateAdmission/stage1ProspectiveWorklist.ts'
      - 'server/candidateAdmission/stage1ProspectiveWorklist.test.ts'
      - 'scripts/stage1ProspectiveWorklist.ts'
      - '.github/workflows/stage1-prospective-human-review-worklist.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum unlabeled, lineage-complete candidates to export'
        required: true
        default: '100'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Prediction-blind worklist tests
        run: node --import tsx --test server/candidateAdmission/stage1ProspectiveWorklist.test.ts
      - name: Build
        run: npm run build
      - name: Verify non-serving read-only contract
        run: |
          set -euo pipefail
          FILE=server/candidateAdmission/stage1ProspectiveWorklist.ts
          ! grep -E '\b(INSERT|UPDATE|DELETE|TRUNCATE|ALTER|DROP)\b' "$FILE"
          ! grep -q 'trading_status' "$FILE"
          ! grep -q 'confidence_score' "$FILE"

  export-worklist:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
      STAGE1_WORKLIST_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Export all currently ready unlabeled candidates once
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:+x}"
          npx tsx scripts/stage1ProspectiveWorklist.ts
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-prospective-human-review-worklist-${{ github.run_id }}
          path: stage1-output/stage1-prospective-human-review-worklist.json
          retention-days: 30
