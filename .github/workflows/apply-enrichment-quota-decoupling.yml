name: Apply enrichment quota decoupling fix

on:
  push:
    branches:
      - 'fix/enrichment-quota-decoupling'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 scripts/applyEnrichmentQuotaDecoupling.py
      - name: Install dependencies
        run: npm ci
      - name: Hybrid enrichment regression
        run: node --import tsx --test server/youtubeInnerTubeEnrichment.test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-enrichment-quota-decoupling.yml scripts/applyEnrichmentQuotaDecoupling.py
          git add server/queueManager.ts server/youtube.ts server/db.ts src/components/QueueMonitor.tsx
          git commit -m "Decouple confirmed-country enrichment from official quota"
          git push origin HEAD:fix/enrichment-quota-decoupling
