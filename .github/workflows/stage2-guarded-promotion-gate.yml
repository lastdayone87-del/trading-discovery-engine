name: Stage 2 guarded promotion gate

on:
  pull_request:
    paths:
      - 'server/release5/stage2GuardedPromotionGate.ts'
      - 'scripts/stage2GuardedPromotionGate.ts'
      - '.github/workflows/stage2-guarded-promotion-gate.yml'
  workflow_dispatch:
    inputs:
      dataset_id:
        description: 'Optional sealed Stage 1 dataset UUID. Leave blank for latest.'
        required: false
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Verify fail-closed non-serving boundary
        run: |
          grep -q "servingAuthority: false" server/release5/stage2GuardedPromotionGate.ts
          grep -q "automaticPromotion: false" server/release5/stage2GuardedPromotionGate.ts
          grep -q "mutatesOperationalState: false" server/release5/stage2GuardedPromotionGate.ts
          grep -q "productionActivation: false" server/release5/stage2GuardedPromotionGate.ts
          grep -q "READY_FOR_LIMITED_CANARY_DESIGN" server/release5/stage2GuardedPromotionGate.ts

  production-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NODE_ENV: production
      STAGE1_DATASET_ID: ${{ inputs.dataset_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Evaluate guarded promotion readiness
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:+x}"
          npx tsx scripts/stage2GuardedPromotionGate.ts
          test -f stage2-output/stage2-guarded-promotion-gate.json
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('stage2-output/stage2-guarded-promotion-gate.json','utf8'));
          if(report.servingAuthority!==false || report.automaticPromotion!==false || report.mutatesOperationalState!==false || report.productionActivation!==false) process.exit(1);
          if(report.observedMetrics.genuineCreatorFalseWithhold.withheldGenuine>0) process.exit(1);
          console.log(JSON.stringify({gateStatus:report.gateStatus,blockers:report.blockers,observedMetrics:report.observedMetrics,nextAction:report.nextAction},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-guarded-promotion-gate-${{ github.run_id }}
          path: stage2-output/stage2-guarded-promotion-gate.json
          retention-days: 30
