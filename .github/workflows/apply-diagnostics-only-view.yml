name: Apply diagnostics-only dashboard view

on:
  push:
    branches: [fix/diagnostics-only-view]
    paths:
      - '.github/workflows/apply-diagnostics-only-view.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/diagnostics-only-view
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply diagnostics-only patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Frontend serialization: diagnostics checkbox now asks the server for
          # the hidden diagnostic corpus, not merely "all channels".
          replace_once(
              'src/channelListingQuery.ts',
              "  if(includeRejected)params.set('include_rejected','true');",
              "  if(includeRejected){params.set('include_rejected','true');params.set('diagnostics_only','true');}"
          )

          # Backend listing contract and scope selection. Preserve include_rejected=true
          # as the explicit all-channel API escape hatch for non-dashboard callers.
          replace_once(
              'server/db.ts',
              "export interface ChannelListingFilter {includeRejected:boolean;search?:string;country?:string;countryStatus?:string;tradingStatus?:string;discordStatus?:string;scanStatus?:string}",
              "export interface ChannelListingFilter {includeRejected:boolean;diagnosticsOnly?:boolean;search?:string;country?:string;countryStatus?:string;tradingStatus?:string;discordStatus?:string;scanStatus?:string}"
          )
          replace_once(
              'server/db.ts',
              "async function channelListingWhere(db:InstanceType<typeof Pool>,args:ChannelListingFilter):Promise<{where:string;values:string[];scope:string}> {\n  const serving=args.includeRejected?{predicate:'TRUE',scope:'ALL_CHANNELS'}:await dashboardServingPredicate(db);",
              "export function resolveChannelListingServingScope(defaultServing:{predicate:string;scope:string},includeRejected:boolean,diagnosticsOnly=false):{predicate:string;scope:string}{\n  if(diagnosticsOnly)return {predicate:`NOT (${defaultServing.predicate})`,scope:`DIAGNOSTICS_ONLY:${defaultServing.scope}`};\n  if(includeRejected)return {predicate:'TRUE',scope:'ALL_CHANNELS'};\n  return defaultServing;\n}\nasync function channelListingWhere(db:InstanceType<typeof Pool>,args:ChannelListingFilter):Promise<{where:string;values:string[];scope:string}> {\n  const defaultServing=await dashboardServingPredicate(db);\n  const serving=resolveChannelListingServingScope(defaultServing,args.includeRejected,Boolean(args.diagnosticsOnly));"
          )

          # API routes: pass diagnostics_only consistently for page and revision polling.
          replace_once(
              'server.ts',
              "const includeRejected = req.query.include_rejected === 'true';\n      res.json(await listChannelsPage({includeRejected,limit:Number(req.query.limit||100),offset:Number(req.query.offset||0),search:req.query.search as string|undefined,country:req.query.country as string|undefined,countryStatus:req.query.country_status as string|undefined,tradingStatus:req.query.trading_status as string|undefined,discordStatus:req.query.discord_status as string|undefined,scanStatus:req.query.scan_status as string|undefined}));",
              "const includeRejected = req.query.include_rejected === 'true';\n      const diagnosticsOnly = req.query.diagnostics_only === 'true';\n      res.json(await listChannelsPage({includeRejected,diagnosticsOnly,limit:Number(req.query.limit||100),offset:Number(req.query.offset||0),search:req.query.search as string|undefined,country:req.query.country as string|undefined,countryStatus:req.query.country_status as string|undefined,tradingStatus:req.query.trading_status as string|undefined,discordStatus:req.query.discord_status as string|undefined,scanStatus:req.query.scan_status as string|undefined}));"
          )
          # Revision route has the same listing filter shape but no pagination.
          old_revision = "res.json(await getChannelListingRevision({includeRejected:req.query.include_rejected==='true',search:req.query.search as string|undefined,country:req.query.country as string|undefined,countryStatus:req.query.country_status as string|undefined,tradingStatus:req.query.trading_status as string|undefined,discordStatus:req.query.discord_status as string|undefined,scanStatus:req.query.scan_status as string|undefined}));"
          new_revision = "res.json(await getChannelListingRevision({includeRejected:req.query.include_rejected==='true',diagnosticsOnly:req.query.diagnostics_only==='true',search:req.query.search as string|undefined,country:req.query.country as string|undefined,countryStatus:req.query.country_status as string|undefined,tradingStatus:req.query.trading_status as string|undefined,discordStatus:req.query.discord_status as string|undefined,scanStatus:req.query.scan_status as string|undefined}));"
          replace_once('server.ts', old_revision, new_revision)

          # Make the UI semantics explicit.
          replace_once(
              'src/App.tsx',
              "{includeRejected ? '(including diagnostics / excluded channels)' : '(validated active channels)'}",
              "{includeRejected ? '(diagnostics / excluded only)' : '(validated active channels)'}"
          )
          replace_once(
              'src/App.tsx',
              "<span>Show Diagnostics / Excluded Channels</span>",
              "<span>Show Diagnostics / Excluded Only</span>"
          )

          Path('server/dashboardDiagnosticsPolicy.test.ts').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { resolveChannelListingServingScope } from './db';\n\nconst serving={predicate:\"country_status <> 'REJECTED' AND trading_status <> 'NON_TRADING'\",scope:'ELIGIBLE_OPERATOR_VISIBLE_CHANNELS'};\n\ntest('normal dashboard keeps the governed visible corpus',()=>{\n  assert.deepEqual(resolveChannelListingServingScope(serving,false,false),serving);\n});\n\ntest('include rejected without diagnostics remains the explicit all-channel escape hatch',()=>{\n  assert.deepEqual(resolveChannelListingServingScope(serving,true,false),{predicate:'TRUE',scope:'ALL_CHANNELS'});\n});\n\ntest('diagnostics-only is the exact complement of the active dashboard serving predicate',()=>{\n  assert.deepEqual(resolveChannelListingServingScope(serving,true,true),{predicate:`NOT (${serving.predicate})`,scope:'DIAGNOSTICS_ONLY:ELIGIBLE_OPERATOR_VISIBLE_CHANNELS'});\n});\n""")

          Path('src/channelListingQuery.test.ts').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { channelListingSearchParams } from './channelListingQuery';\n\nconst filters={search:'',country:'ALL',countryStatus:'ALL',tradingStatus:'ALL',discordStatus:'ALL',scanStatus:'ALL'};\n\ntest('normal dashboard does not request rejected or diagnostics rows',()=>{\n  const params=channelListingSearchParams(filters,false);\n  assert.equal(params.has('include_rejected'),false);\n  assert.equal(params.has('diagnostics_only'),false);\n});\n\ntest('diagnostics toggle requests the hidden corpus explicitly',()=>{\n  const params=channelListingSearchParams(filters,true);\n  assert.equal(params.get('include_rejected'),'true');\n  assert.equal(params.get('diagnostics_only'),'true');\n});\n""")
          PY

          rm .github/workflows/apply-diagnostics-only-view.yml
      - name: Install dependencies
        run: npm ci
      - name: Diagnostics view regression tests
        run: node --import tsx --test server/dashboardDiagnosticsPolicy.test.ts src/channelListingQuery.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts server.ts src/App.tsx src/channelListingQuery.ts server/dashboardDiagnosticsPolicy.test.ts src/channelListingQuery.test.ts .github/workflows/apply-diagnostics-only-view.yml
          git commit -m "Make dashboard diagnostics view exclusive"
          git push origin HEAD:fix/diagnostics-only-view
