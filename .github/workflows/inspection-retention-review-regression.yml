name: Inspection retention and review routing
on:
  pull_request:
    paths:
      - 'server/inspector.ts'
      - 'server/ingestionPipeline.ts'
      - 'server/inspectionRetentionReviewRouting.test.ts'
      - 'src/types/index.ts'
      - 'src/components/InspectionModal.tsx'
      - '.github/workflows/inspection-retention-review-regression.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node --import tsx --test server/inspectionRetentionReviewRouting.test.ts
      - run: npm run build