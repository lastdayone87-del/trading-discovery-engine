name: Phase 0 zombie reconciliation

on:
  pull_request:
    paths:
      - 'server/phase0ZombieReconciliation.ts'
      - 'server/phase0ZombieReconciliation.test.ts'
      - 'server/phase0ZombieReconciliation.postgres.test.ts'
      - 'server/phase0ZombieApply.ts'
      - 'server/phase0ZombieApply.test.ts'
      - 'server/phase0ZombieApply.postgres.test.ts'
      - 'server/phase0JobClosureEvidenceMigration.test.ts'
      - 'server/communityAcquisitionWorkLedger.ts'
      - 'server/db/migrations/**'
      - 'scripts/phase0ZombieReconciliationDryRun.ts'
      - 'scripts/phase0ZombieApply.ts'
      - 'scripts/runMigrations.ts'
      - 'server/db.ts'
      - 'server/dbCore.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/phase0-zombie-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase0_zombie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase0_zombie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phase0_zombie
      # The integration test inserts job/channel/ledger fixtures, so it is
      # opt-in and only runs against this dedicated scratch database.
      PHASE0_ZOMBIE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phase0_zombie
      PGSSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to isolated test database
        run: npx tsx scripts/runMigrations.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Phase 0 zombie dry-run unit tests
        run: node --import tsx --test server/phase0ZombieReconciliation.test.ts
      - name: Phase 0 zombie dry-run PostgreSQL regression
        run: node --import tsx --test server/phase0ZombieReconciliation.postgres.test.ts
      - name: Phase 0 closure evidence migration tests
        run: node --import tsx --test server/phase0JobClosureEvidenceMigration.test.ts
      - name: Phase 0 zombie apply unit tests
        run: node --import tsx --test server/phase0ZombieApply.test.ts
      - name: Phase 0 zombie apply PostgreSQL regression
        run: node --import tsx --test server/phase0ZombieApply.postgres.test.ts
