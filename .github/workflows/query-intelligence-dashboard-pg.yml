name: Query Intelligence dashboard PostgreSQL

on:
  pull_request:
    paths:
      - 'server/db/migrations/**'
      - 'server/dbCore.ts'
      - 'server.ts'
      - 'src/components/QueryIntelligenceEngine.tsx'
      - 'server/queryIntelligenceDashboard.postgres.test.ts'
      - 'server/queryIntelligenceSummary.test.ts'
      - 'scripts/runMigrations.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/query-intelligence-dashboard-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: query_intelligence_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d query_intelligence_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/query_intelligence_dashboard
      PHASE4_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/query_intelligence_dashboard
      PGSSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to isolated test database
        run: npx tsx scripts/runMigrations.ts
      - name: Dashboard summary, filters and pagination regressions
        run: >-
          node --import tsx --test
          server/queryIntelligenceSummary.test.ts
          server/queryIntelligenceDashboard.postgres.test.ts
