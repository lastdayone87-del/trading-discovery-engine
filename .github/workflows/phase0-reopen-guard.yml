name: Phase 0 reopen guard

on:
  pull_request:
    paths:
      - 'server/db/migrations/**'
      - 'server/phase0ReopenGuardMigration.test.ts'
      - 'server/phase0ReopenGuard.postgres.test.ts'
      - 'server/communityRetryExecutedEvidence.test.ts'
      - 'server/acquisitionJobClockPolicy.ts'
      - 'server/db.ts'
      - 'server/dbCore.ts'
      - 'server/communityRecovery.ts'
      - 'server/operationalEnrichmentRecovery.ts'
      - 'server/queueManager.ts'
      - 'scripts/runMigrations.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/phase0-reopen-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase0_reopen_guard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase0_reopen_guard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phase0_reopen_guard
      # The reopen-guard suite toggles the database-wide guard config, so it is
      # opt-in and only runs against this dedicated scratch database.
      PHASE0_REOPEN_GUARD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phase0_reopen_guard
      PGSSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to isolated test database
        run: npx tsx scripts/runMigrations.ts
      - name: Phase 0 reopen guard migration assertions
        run: node --import tsx --test server/phase0ReopenGuardMigration.test.ts server/communityRetryExecutedEvidence.test.ts
      - name: Phase 0 reopen guard PostgreSQL regression
        run: node --import tsx --test server/phase0ReopenGuard.postgres.test.ts
