name: Recently confirmed Discord invites

on:
  pull_request:
    paths:
      - 'server/dbCore.ts'
      - 'server.ts'
      - 'server/db/migrations/152_discord_candidate_first_validated.sql'
      - 'server/recentDiscordInvites.test.ts'
      - 'server/recentDiscordInvites.postgres.test.ts'
      - 'server/discoveryIntegrityMigration.test.ts'
      - 'server/lowAudienceDashboardVisibility.test.ts'
      - 'src/App.tsx'
      - 'src/channelListingQuery.ts'
      - 'src/channelListingQuery.test.ts'
      - 'src/components/ResultsTable.tsx'
      - 'src/discordInviteView.ts'
      - 'src/types/index.ts'
      - 'src/utils/relativeTime.ts'
      - 'src/utils/relativeTime.test.ts'
      - '.github/workflows/recent-discord-invites.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recently confirmed invite unit tests
        run: node --import tsx --test server/recentDiscordInvites.test.ts src/utils/relativeTime.test.ts src/channelListingQuery.test.ts server/discoveryIntegrityMigration.test.ts server/lowAudienceDashboardVisibility.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build

  pg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recent_invites_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recent_invites_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recent_invites_test
      PGSSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to isolated test database
        run: npx tsx scripts/runMigrations.ts
      - name: Recently confirmed invite PostgreSQL regression
        run: node --import tsx --test server/recentDiscordInvites.postgres.test.ts
