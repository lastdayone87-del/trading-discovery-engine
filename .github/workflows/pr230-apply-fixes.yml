name: PR230 apply fixes

on:
  push:
    branches:
      - fix/post-merge-recheck-safety

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # Centralized quota gate shared by HTTP manual rechecks and already-reserved workers.
          Path('server/officialRecheckQuota.ts').write_text("""import {
            finishQuotaReservation,
            getAppSetting,
            getDailyYouTubeQuotaBudget,
            getYouTubeKeyPool,
            tryReserveQuota,
          } from './db';

          export const OFFICIAL_RECHECK_UNITS_PER_PROVIDER = 101;

          export async function reserveOfficialRecheck(operationId: string): Promise<boolean> {
            const dailyBudget = getDailyYouTubeQuotaBudget();
            const allocationPercent = Math.max(
              1,
              Math.min(100, Number(await getAppSetting('discovery_enrichment_quota_percent', '10')) || 10),
            );
            const maximumProviderAttempts = Math.max(1, getYouTubeKeyPool().length);
            const reservedUnits = OFFICIAL_RECHECK_UNITS_PER_PROVIDER * maximumProviderAttempts;
            return tryReserveQuota({
              operationType: 'OPERATIONAL_RECHECK',
              operationId,
              allocation: 'ENRICHMENT',
              units: reservedUnits,
              dailyBudget,
              allocationPercent,
            });
          }

          export async function finishOfficialRecheck(operationId: string, consumed: boolean): Promise<void> {
            await finishQuotaReservation('OPERATIONAL_RECHECK', operationId, consumed);
          }
          """.replace('          ', ''))

          # queueManager: preserve typed provider metadata and expose a quota-gated HTTP entry point.
          path = 'server/queueManager.ts'
          text = read(path)
          marker = "import { triggerPhaseBObservationReconciliation } from './phaseBObservationOutbox';"
          if "from './officialRecheckQuota'" not in text:
              text = text.replace(marker, marker + "\nimport { ProviderCallError } from './providerResilience';\nimport { YouTubeProvidersCoolingDownError } from './youtubeProviderCooldown';\nimport { finishOfficialRecheck, reserveOfficialRecheck } from './officialRecheckQuota';", 1)

          signature = "export async function triggerManualRecheck(channelId: string, enableDebug?: boolean): Promise<{ success: boolean; message: string; channel?: ChannelRecord; debugLog?: any; code?: string; retryable?: boolean }> {"
          helper = """type ManualRecheckFailureMetadata = {
            code?: string;
            retryable: boolean;
            errorClass?: string;
            status?: number;
            providerReasons?: string[];
            retryAt?: number;
          };

          const ATTEMPT_FREE_PROVIDER_ERROR_CLASSES = new Set(['TIMEOUT', 'CANCELLED', 'RATE_LIMIT', 'TRANSIENT', 'CREDENTIALS_EXHAUSTED']);

          function manualRecheckFailureMetadata(error: unknown): ManualRecheckFailureMetadata {
            if (error instanceof ProviderCallError) {
              return {
                retryable: error.retryable && ATTEMPT_FREE_PROVIDER_ERROR_CLASSES.has(error.errorClass),
                errorClass: error.errorClass,
                status: error.status,
                providerReasons: error.providerReasons,
              };
            }
            if (error instanceof YouTubeProvidersCoolingDownError) {
              return {
                code: error.code,
                retryable: true,
                errorClass: 'TRANSIENT',
                retryAt: error.retryAt,
              };
            }
            const value = error as any;
            const errorClass = typeof value?.errorClass === 'string' ? value.errorClass : undefined;
            return {
              code: typeof value?.code === 'string' ? value.code : undefined,
              retryable: Boolean(errorClass && ATTEMPT_FREE_PROVIDER_ERROR_CLASSES.has(errorClass) && value?.retryable !== false),
              errorClass,
              status: Number.isFinite(Number(value?.status)) ? Number(value.status) : undefined,
              providerReasons: Array.isArray(value?.providerReasons) ? value.providerReasons.map(String) : undefined,
              retryAt: Number.isFinite(Number(value?.retryAt)) ? Number(value.retryAt) : undefined,
            };
          }

          export type ManualRecheckResult = { success: boolean; message: string; channel?: ChannelRecord; debugLog?: any; code?: string; retryable?: boolean; errorClass?: string; status?: number; providerReasons?: string[]; retryAt?: number };

          export async function triggerManualRecheck(channelId: string, enableDebug?: boolean): Promise<ManualRecheckResult> {"""
          if signature in text:
              text = text.replace(signature, helper, 1)

          old_acq = """  } catch (error) {
            const detail = error instanceof Error ? error.message : String(error);
            console.warn(`[Manual Recheck] Fresh YouTube creator acquisition failed for ${channelId}; preserving prior trading classification: ${detail}`);
            return {
              success: false,
              message: `Manual re-scan could not acquire fresh YouTube creator evidence. Existing trading classification was preserved; retry is recommended. ${detail}`,
              code: 'MANUAL_RESCAN_UPSTREAM_FAILURE',
              retryable: true,
              channel
            };
          }
          """
          new_acq = """  } catch (error) {
            const detail = error instanceof Error ? error.message : String(error);
            const metadata = manualRecheckFailureMetadata(error);
            console.warn(`[Manual Recheck] Fresh YouTube creator acquisition failed for ${channelId}; preserving prior trading classification: ${detail}`);
            return {
              success: false,
              message: `Manual re-scan could not acquire fresh YouTube creator evidence. Existing trading classification was preserved. ${detail}`,
              code: metadata.code || 'MANUAL_RESCAN_UPSTREAM_FAILURE',
              retryable: metadata.retryable,
              errorClass: metadata.errorClass,
              status: metadata.status,
              providerReasons: metadata.providerReasons,
              retryAt: metadata.retryAt,
              channel
            };
          }
          """
          if old_acq not in text:
              raise SystemExit('queueManager acquisition catch not found')
          text = text.replace(old_acq, new_acq, 1)

          old_down = """    const code = String(error?.code || 'MANUAL_RESCAN_OPERATIONAL_FAILURE');
            console.warn(`[Manual Recheck] Reclassification failed operationally for ${channelId}; preserving prior decision where no complete classification was produced: ${detail}`);
            return {
              success: false,
              message: `Manual re-scan could not complete a reliable trading reclassification. Existing classification was preserved where the classifier had incomplete provider coverage; retry is recommended. ${detail}`,
              code,
              retryable: error?.retryable !== false,
              channel: preserved
            };
          """
          new_down = """    const metadata = manualRecheckFailureMetadata(error);
            const code = String(metadata.code || error?.code || 'MANUAL_RESCAN_OPERATIONAL_FAILURE');
            console.warn(`[Manual Recheck] Reclassification failed operationally for ${channelId}; preserving prior decision where no complete classification was produced: ${detail}`);
            return {
              success: false,
              message: `Manual re-scan could not complete a reliable trading reclassification. Existing classification was preserved where the classifier had incomplete provider coverage. ${detail}`,
              code,
              retryable: metadata.retryable,
              errorClass: metadata.errorClass,
              status: metadata.status,
              providerReasons: metadata.providerReasons,
              retryAt: metadata.retryAt,
              channel: preserved
            };
          """
          if old_down not in text:
              raise SystemExit('queueManager downstream catch not found')
          text = text.replace(old_down, new_down, 1)

          wrapper_marker = "\nexport interface SearchExecutionResult {"
          wrapper = """
          export async function triggerQuotaGatedManualRecheck(channelId: string, enableDebug?: boolean): Promise<ManualRecheckResult> {
            const operationId = `manual_http_recheck:${channelId}:${randomUUID()}`;
            const reserved = await reserveOfficialRecheck(operationId);
            if (!reserved) {
              return {
                success: false,
                message: 'Manual re-scan could not start because the official YouTube enrichment quota gate is currently full.',
                code: 'MANUAL_RESCAN_QUOTA_UNAVAILABLE',
                retryable: true,
              };
            }
            try {
              const result = await triggerManualRecheck(channelId, enableDebug);
              await finishOfficialRecheck(operationId, result.success);
              return result;
            } catch (error) {
              await finishOfficialRecheck(operationId, false).catch(() => undefined);
              throw error;
            }
          }
          """
          if 'export async function triggerQuotaGatedManualRecheck' not in text:
              text = text.replace(wrapper_marker, wrapper + wrapper_marker, 1)
          write(path, text)

          # HTTP route must use the quota-gated wrapper, not the already-reserved worker entry point.
          replace_once('server.ts', '  triggerManualRecheck,\n', '  triggerQuotaGatedManualRecheck,\n')
          replace_once('server.ts', "const result = await triggerManualRecheck(req.params.id, req.query.debug === 'true');", "const result = await triggerQuotaGatedManualRecheck(req.params.id, req.query.debug === 'true');")

          # Workers share the centralized reservation and only grant attempt-free retries to typed transients.
          path = 'server/operationalMaintenanceWorkers.ts'
          text = read(path)
          old_import = """import {
            claimNextJob,
            completeJob,
            failJob,
            finishQuotaReservation,
            getAppSetting,
            getDailyYouTubeQuotaBudget,
            getYouTubeKeyPool,
            heartbeatJob,
            tryReserveQuota
          } from './db';
          """
          new_import = """import {
            claimNextJob,
            completeJob,
            failJob,
            heartbeatJob,
          } from './db';
          import { finishOfficialRecheck, reserveOfficialRecheck } from './officialRecheckQuota';
          """
          if old_import not in text:
              raise SystemExit('operational worker db import block not found')
          text = text.replace(old_import, new_import, 1)
          text = text.replace("const OFFICIAL_RECHECK_UNITS_PER_PROVIDER = 101;\n", '')
          text = re.sub(r"\nasync function reserveOfficialRecheck\(operationId: string\): Promise<boolean> \{.*?\n\}\n\nfunction startCommunityRetryWorker", "\nconst ATTEMPT_FREE_RECOVERY_ERROR_CLASSES = new Set(['TIMEOUT', 'CANCELLED', 'RATE_LIMIT', 'TRANSIENT', 'CREDENTIALS_EXHAUSTED']);\n\nfunction isTypedTransientRecoveryFailure(result: Awaited<ReturnType<typeof triggerManualRecheck>>): boolean {\n  if (result.retryable !== true) return false;\n  if (result.code === 'YOUTUBE_PROVIDERS_COOLING_DOWN') return true;\n  return typeof result.errorClass === 'string' && ATTEMPT_FREE_RECOVERY_ERROR_CLASSES.has(result.errorClass);\n}\n\nfunction startCommunityRetryWorker", text, count=1, flags=re.S)
          text = text.replace("finishQuotaReservation('OPERATIONAL_RECHECK', operationId, processed)", "finishOfficialRecheck(operationId, processed)")
          text = text.replace("finishQuotaReservation('OPERATIONAL_RECHECK', operationId, false)", "finishOfficialRecheck(operationId, false)")
          text = text.replace("finishQuotaReservation('OPERATIONAL_RECHECK', operationId, true)", "finishOfficialRecheck(operationId, true)")
          old_failure = """      if (!result.success) {
                const retryable = result.retryable === true;
                const error = Object.assign(new Error(result.message), {
                  code: result.code,
                  retryable,
                  // triggerManualRecheck intentionally wraps upstream provider errors in
                  // MANUAL_RESCAN_UPSTREAM_FAILURE. Restore infrastructure semantics for
                  // failJob so transient provider outages do not consume normal attempts.
                  errorClass: retryable ? 'TRANSIENT' : undefined
                });
                throw error;
              }
          """
          new_failure = """      if (!result.success) {
                const typedTransient = isTypedTransientRecoveryFailure(result);
                const error = Object.assign(new Error(result.message), {
                  code: result.code,
                  retryable: typedTransient,
                  errorClass: typedTransient ? (result.errorClass || 'TRANSIENT') : result.errorClass,
                  status: result.status,
                  providerReasons: result.providerReasons,
                  retryAt: result.retryAt,
                });
                throw error;
              }
          """
          if old_failure not in text:
              raise SystemExit('false-negative recovery failure block not found')
          text = text.replace(old_failure, new_failure, 1)
          write(path, text)

          # Successful channels.list with no item is a permanent result; do not rotate keys.
          path = 'server/youtube.ts'
          text = read(path)
          text = text.replace("if (!channel) throw new Error(`YouTube channel '${channelId}' was not found.`);", "if (!channel) throw Object.assign(new ProviderCallError(`YouTube channel '${channelId}' was not found.`, 'PERMANENT_INPUT', false, { status: 404 }), { code: 'YOUTUBE_CHANNEL_NOT_FOUND' });", 1)
          catch_old = """    } catch (error: any) {
                recordProviderFailure(apiKey,error);
                if (isQuotaExceeded(error)) quotaExceededCount++;
                lastError = error instanceof Error ? error : new Error(String(error));
              }
          """
          catch_new = """    } catch (error: any) {
                recordProviderFailure(apiKey,error);
                if (isQuotaExceeded(error)) quotaExceededCount++;
                lastError = error instanceof Error ? error : new Error(String(error));
                if (error instanceof ProviderCallError && error.errorClass === 'PERMANENT_INPUT') break;
              }
          """
          if catch_old not in text:
              raise SystemExit('youtube enrichment catch block not found')
          text = text.replace(catch_old, catch_new, 1)
          write(path, text)

          # Process-wide browser fallback admission bounds concurrent Crawlee/Playwright instances.
          path = 'server/browserCommunityFallback.ts'
          text = read(path)
          anchor = "const COMMUNITY_HINTS = /discord|community|join|chat|member|membership|vip|group|private|trading.?room|links?|social|contact|about/i;\n"
          semaphore = """
          const configuredRenderedFallbackConcurrency = Number(process.env.BROWSER_FALLBACK_CONCURRENCY || 1);
          export const BROWSER_FALLBACK_MAX_CONCURRENCY = Math.min(
            2,
            Math.max(1, Number.isFinite(configuredRenderedFallbackConcurrency) ? Math.floor(configuredRenderedFallbackConcurrency) : 1),
          );
          let activeRenderedFallbacks = 0;
          const renderedFallbackWaiters: Array<() => void> = [];

          async function acquireRenderedFallbackSlot(): Promise<void> {
            if (activeRenderedFallbacks < BROWSER_FALLBACK_MAX_CONCURRENCY) {
              activeRenderedFallbacks++;
              return;
            }
            await new Promise<void>(resolve => renderedFallbackWaiters.push(resolve));
          }

          function releaseRenderedFallbackSlot(): void {
            const next = renderedFallbackWaiters.shift();
            if (next) {
              next();
              return;
            }
            activeRenderedFallbacks = Math.max(0, activeRenderedFallbacks - 1);
          }
          """
          if 'BROWSER_FALLBACK_MAX_CONCURRENCY' not in text:
              text = text.replace(anchor, anchor + semaphore, 1)
          old_start = """  const limits = { ...DEFAULT_BROWSER_FALLBACK_BUDGET, ...budget };
            const startedAt = Date.now();
            let inspectedPages = 0;
          """
          new_start = """  const limits = { ...DEFAULT_BROWSER_FALLBACK_BUDGET, ...budget };
            let inspectedPages = 0;
          """
          if old_start not in text:
              raise SystemExit('browser fallback start block not found')
          text = text.replace(old_start, new_start, 1)
          old_direct = """  if (foundInvite) return { foundInvite, foundLocation, inspectedPages, scrolls, clicks, complete: true, retryable: false, detail: 'Direct Discord invite in seed URL' };

            try {
          """
          new_direct = """  if (foundInvite) return { foundInvite, foundLocation, inspectedPages, scrolls, clicks, complete: true, retryable: false, detail: 'Direct Discord invite in seed URL' };

            await acquireRenderedFallbackSlot();
            const startedAt = Date.now();
            try {
          """
          if old_direct not in text:
              raise SystemExit('browser fallback direct block not found')
          text = text.replace(old_direct, new_direct, 1)
          old_end = """  } catch (error: any) {
            return {
              foundInvite: null,
              inspectedPages,
              scrolls,
              clicks,
              complete: false,
              retryable: true,
              detail: `Rendered acquisition unavailable or failed: ${String(error?.message || error)}`,
            };
          }
          }
          """
          new_end = """  } catch (error: any) {
            return {
              foundInvite: null,
              inspectedPages,
              scrolls,
              clicks,
              complete: false,
              retryable: true,
              detail: `Rendered acquisition unavailable or failed: ${String(error?.message || error)}`,
            };
          } finally {
            releaseRenderedFallbackSlot();
          }
          }
          """
          if old_end not in text:
              raise SystemExit('browser fallback catch/end block not found')
          text = text.replace(old_end, new_end, 1)
          write(path, text)

          # Update focused regression contracts for centralized quota helper and browser cap.
          path = 'server/operationalMaintenanceWorkers.test.ts'
          text = read(path)
          text = text.replace("  assert.match(workers, /tryReserveQuota/);\n  assert.match(workers, /allocation: 'ENRICHMENT'/);\n  assert.match(workers, /OFFICIAL_RECHECK_UNITS_PER_PROVIDER = 101/);\n  assert.match(workers, /Math\\.max\\(1, getYouTubeKeyPool\\(\\)\\.length\\)/);\n  assert.match(workers, /reservedUnits = OFFICIAL_RECHECK_UNITS_PER_PROVIDER \\* maximumProviderAttempts/);\n  assert.match(workers, /units: reservedUnits/);\n  assert.match(workers, /finishQuotaReservation\\('OPERATIONAL_RECHECK'/);", "  assert.match(workers, /reserveOfficialRecheck/);\n  assert.match(workers, /finishOfficialRecheck/);")
          text = text.replace("  assert.match(workers, /const retryable = result\\.retryable === true/);\n  assert.match(workers, /errorClass: retryable \\? 'TRANSIENT' : undefined/);", "  assert.match(workers, /isTypedTransientRecoveryFailure/);\n  assert.match(workers, /ATTEMPT_FREE_RECOVERY_ERROR_CLASSES/);\n  assert.doesNotMatch(workers, /errorClass: retryable \\? 'TRANSIENT'/);")
          write(path, text)

          path = 'server/browserCommunityFallback.test.ts'
          text = read(path)
          text = text.replace("import { DEFAULT_BROWSER_FALLBACK_BUDGET, shouldEscalateToRenderedFallback } from './browserCommunityFallback';", "import { BROWSER_FALLBACK_MAX_CONCURRENCY, DEFAULT_BROWSER_FALLBACK_BUDGET, shouldEscalateToRenderedFallback } from './browserCommunityFallback';")
          text = text.replace("  assert.ok(DEFAULT_BROWSER_FALLBACK_BUDGET.totalTimeoutMs <= 35_000);", "  assert.ok(DEFAULT_BROWSER_FALLBACK_BUDGET.totalTimeoutMs <= 35_000);\n  assert.ok(BROWSER_FALLBACK_MAX_CONCURRENCY <= 2);")
          write(path, text)
          PY
      - name: Focused tests
        run: node --import tsx --test server/postMergeRecheckSafety.contract.test.ts server/operationalMaintenanceWorkers.test.ts server/manualRecheckClassification.test.ts server/youtubeHttpError.test.ts server/browserCommunityFallback.test.ts server/browserCommunityFallback.integration.test.ts server/provider2Removal.contract.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts server .github/workflows/pr230-apply-fixes.yml
          git commit -m "Harden manual recheck recovery and concurrency"
          git push origin HEAD:fix/post-merge-recheck-safety
