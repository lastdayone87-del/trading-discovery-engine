name: Apply retry lifecycle hardening

on:
  push:
    branches: [fix/retry-lifecycle-hardening]
    paths: ['.github/workflows/retry-lifecycle-apply.yml']

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retry-lifecycle-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply retry lifecycle patch
        run: python3 scripts/apply_retry_patch.py
      - name: Retry lifecycle regression tests
        run: node --import tsx --test server/retryLifecyclePolicy.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit production patch and remove applicator
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/db.ts server/queueManager.ts server/retryLifecyclePolicy.test.ts
          git commit -m 'Harden transient retries and community acquisition lifecycle'
          git rm .github/workflows/retry-lifecycle-apply.yml scripts/apply_retry_patch.py
          git commit -m 'Remove one-time retry lifecycle applicator'
          git push origin HEAD:fix/retry-lifecycle-hardening
