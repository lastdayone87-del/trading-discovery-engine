name: Harden PostgreSQL startup retry bound

on:
  push:
    branches:
      - fix/postgres-startup-retry

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/postgres-startup-retry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate finite startup wait
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/db.ts')
          s = p.read_text()
          old = "  const maxWaitMs = Math.max(30_000, Number(process.env.POSTGRES_STARTUP_MAX_WAIT_MS || '300000'));"
          new = "  const configuredMaxWaitMs = Number(process.env.POSTGRES_STARTUP_MAX_WAIT_MS || '300000');\n  const maxWaitMs = Number.isFinite(configuredMaxWaitMs) && configuredMaxWaitMs >= 30_000 ? configuredMaxWaitMs : 300_000;"
          if old not in s:
              raise SystemExit('Expected startup wait expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify guard
        run: |
          grep -F "Number.isFinite(configuredMaxWaitMs)" server/db.ts
          grep -F "configuredMaxWaitMs >= 30_000" server/db.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit hardening and remove helper
        run: |
          rm .github/workflows/postgres-startup-retry-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts .github/workflows/postgres-startup-retry-hardening.yml
          git commit -m "Validate PostgreSQL startup retry wait bound"
          git push origin HEAD:fix/postgres-startup-retry
