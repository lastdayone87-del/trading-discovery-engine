name: Official Enrichment Accounting Applicator
on:
  push:
    branches:
      - fix/official-enrichment-quota-accounting
    paths:
      - '.github/workflows/official-enrichment-stage2-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/official-enrichment-quota-accounting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node scripts/applyOfficialEnrichmentQuotaAccounting.mjs
      - run: node --import tsx --test server/officialEnrichmentQuotaAccounting.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit validated implementation
        run: |
          rm .github/workflows/official-enrichment-stage2-apply.yml
          rm .github/workflows/official-enrichment-quota-accounting-apply.yml
          rm scripts/applyOfficialEnrichmentQuotaAccounting.mjs
          git config user.name youtube-quota-accounting-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Fix official enrichment quota accounting'
          git push origin HEAD:fix/official-enrichment-quota-accounting
