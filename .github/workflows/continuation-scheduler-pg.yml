name: Continuation scheduler PostgreSQL

on:
  pull_request:
    paths:
      - 'server/db/migrations/**'
      - 'server/db.ts'
      - 'server/dbCore.ts'
      - 'server/queryIntelligence.ts'
      - 'server/queryRunJobLifecycle.ts'
      - 'server/queryRunJobLifecycle.test.ts'
      - 'server/queryQuality/lifecycle.ts'
      - 'server/queryRunLifecycle.postgres.test.ts'
      - 'server/continuationSegment.postgres.test.ts'
      - 'server/activeQueryRunIds.postgres.test.ts'
      - 'scripts/runMigrations.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/continuation-scheduler-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: continuation_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d continuation_scheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/continuation_scheduler
      PHASE4_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/continuation_scheduler
      PGSSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to isolated test database
        run: npx tsx scripts/runMigrations.ts
      - name: Continuation segment, selector and lifecycle PostgreSQL regressions
        run: >-
          node --import tsx --test
          server/queryRunJobLifecycle.test.ts
          server/queryRunLifecycle.postgres.test.ts
          server/continuationSegment.postgres.test.ts
          server/activeQueryRunIds.postgres.test.ts
