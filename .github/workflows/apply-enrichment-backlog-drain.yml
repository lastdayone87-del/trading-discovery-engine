name: Apply enrichment backlog drain

on:
  push:
    branches:
      - fix/enrichment-backlog-gemini-degradation
    paths:
      - .github/workflows/apply-enrichment-backlog-drain.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrichment-backlog-gemini-degradation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fix
        run: python scripts/apply_enrichment_backlog_fix.py
      - name: Validate
        run: |
          set -euo pipefail
          node --import tsx --test server/enrichmentOperationalFailure.test.ts server/enrichmentBacklogDrain.contract.test.ts server/providerResilience.test.ts server/quotaRecovery.test.ts
          npm run lint
          npm run build
          git diff --check
      - name: Commit validated fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-enrichment-backlog-drain.yml scripts/apply_enrichment_backlog_fix.py
          git add -A
          git commit -m "Drain enrichment backlog during semantic provider degradation"
          git push origin HEAD:fix/enrichment-backlog-gemini-degradation
