name: Rendered crawl E2E baseline

# Baseline harness for E2E-1..E2E-9. This workflow is intentionally triggered
# by pushes to the e2e/* branch namespace and by changes to the harness so the
# authoritative Linux Chromium run does not depend on opening a pull request.
on:
  push:
    branches:
      - 'e2e/**'
  pull_request:
    paths:
      # The E2E drives the production rendered-crawl implementation and its
      # transitive server dependencies (extraction, policy, telemetry, proxy,
      # and the inspection entry point). Any server change can alter its
      # outcome, so do not maintain a fragile hand-written dependency list.
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rendered-crawl-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify Chromium is installed
        run: npx playwright install --list
      - name: TypeScript validation
        run: npm run lint
      - name: Full-crawler real-browser E2E baseline
        run: |
          set -o pipefail
          node --import tsx --test server/renderedCrawlE2E.browser.test.ts 2>&1 | tee rendered-crawl-e2e.log
      - name: Upload baseline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-crawl-e2e-log
          path: rendered-crawl-e2e.log
          if-no-files-found: warn
