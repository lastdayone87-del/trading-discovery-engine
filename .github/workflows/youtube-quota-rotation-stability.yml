name: YouTube quota rotation stability

on:
  pull_request:
  push:
    branches:
      - fix/restore-per-provider-429-failover

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-per-provider-429-failover
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Patch transport failure accounting
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/youtube.ts')
          s=p.read_text()
          old="""        const response=await fetch(dispatchedUrl,{signal});
        trace(`after HTTP fetch at server/youtube.ts:131 (status=${response.status})`);"""
          new="""        let response: Response;
        try {
          response=await fetch(dispatchedUrl,{signal});
        } catch (error) {
          if(dispatchedProviderKey){
            failedDispatchProviders(acquisition)?.add(dispatchedProviderKey);
            if(error&&typeof error==='object')Object.assign(error,{providerKey:dispatchedProviderKey});
          }
          throw error;
        }
        trace(`after HTTP fetch at server/youtube.ts:131 (status=${response.status})`);"""
          if old not in s:
              raise SystemExit('youtube fetch target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Focused tests
        run: npx tsx --test server/youtubeRequestScheduler.test.ts server/youtubeProviderCooldown.test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit fix
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/youtube.ts
          git commit -m "fix: rotate providers after transport failures"
          git push origin HEAD:fix/restore-per-provider-429-failover