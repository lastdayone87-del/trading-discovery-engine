name: YouTube quota rotation stability

on:
  pull_request:
    paths:
      - 'server/youtubeProviderCooldown.ts'
      - 'server/youtubePoolBackoff.ts'
      - 'server/youtubeRequestScheduler.ts'
      - 'server/youtubeRequestScheduler.test.ts'
      - 'scripts/youtube-quota-rotation-stability-test.ts'
      - '.github/workflows/youtube-quota-rotation-stability.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Scheduler cooldown regression tests
        run: node --import tsx --test server/youtubeRequestScheduler.test.ts
      - name: Quota reset and failover regression tests
        run: node --import tsx --test scripts/youtube-quota-rotation-stability-test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
