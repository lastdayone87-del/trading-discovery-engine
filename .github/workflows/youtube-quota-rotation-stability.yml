name: YouTube quota rotation stability

on:
  pull_request:
    paths:
      - 'package.json'
      - 'server/secretSafeLogging.cjs'
      - 'server/secretSafeLogging.test.ts'
      - 'server/youtubeKeyPool.ts'
      - 'server/youtubeKeyPool.test.ts'
      - 'server/youtubeProviderCooldown.ts'
      - 'server/youtubeProviderCooldown.test.ts'
      - 'server/youtubePoolBackoff.ts'
      - 'server/youtubeRequestScheduler.ts'
      - 'server/youtubeRequestScheduler.test.ts'
      - 'server/youtubeRuntimePressureBoundary.test.ts'
      - 'server/youtubeAdaptivePacing.test.ts'
      - 'server/youtubeRatePressureDiagnostics.test.ts'
      - 'server/youtubeRatePressureDiagnostics.contract.test.ts'
      - 'server/youtube.ts'
      - 'scripts/youtube-quota-rotation-stability-test.ts'
      - '.github/workflows/youtube-quota-rotation-stability.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Provider secret redaction and quota-group configuration tests
        run: node --import tsx --test server/secretSafeLogging.test.ts server/youtubeKeyPool.test.ts
      - name: Provider cooldown and failover regression tests
        run: node --import tsx --test server/youtubeProviderCooldown.test.ts
      - name: Scheduler cooldown regression tests
        run: node --import tsx --test server/youtubeRequestScheduler.test.ts
      - name: Runtime pressure boundary regression tests
        run: node --import tsx --test server/youtubeRuntimePressureBoundary.test.ts
      - name: Adaptive request-pressure regression tests
        run: node --import tsx --test server/youtubeAdaptivePacing.test.ts
      - name: Rate-pressure attribution diagnostics tests
        run: node --import tsx --test server/youtubeRatePressureDiagnostics.test.ts server/youtubeRatePressureDiagnostics.contract.test.ts
      - name: Quota reset and failover regression tests
        run: node --import tsx --test scripts/youtube-quota-rotation-stability-test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
