name: YouTube quota rotation stability

on:
  push:
    branches:
      - 'fix/restore-per-provider-429-failover'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-per-provider-429-failover
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node scripts/pr237-transport-fix.mjs
      - run: npx tsx --test server/youtubeRequestScheduler.test.ts server/youtubeProviderCooldown.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/youtube.ts
          git commit -m 'fix: rotate providers after transport failures'
          git push origin HEAD:fix/restore-per-provider-429-failover