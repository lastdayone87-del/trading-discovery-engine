name: PR237 live dispatch reselection fix

on:
  push:
    branches:
      - fix/restore-per-provider-429-failover

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply PR237 live dispatch reselection fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-per-provider-429-failover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply targeted live-provider reselection fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/youtube.ts')
          src = path.read_text()

          old = """function recordProviderFailure(key: string, error: unknown): void {\n  if (isQuotaExceeded(error)) youtubeProviderCooldown.failed(key, 'DAILY_QUOTA_EXHAUSTED');\n  else if (isYouTubeRateLimited(error)) youtubeProviderCooldown.failed(key, 'RATE_LIMITED');\n}\n"""
          new = """function recordProviderFailure(key: string, error: unknown): void {\n  const dispatchedKey = typeof (error as any)?.providerKey === 'string' ? (error as any).providerKey : key;\n  if (isQuotaExceeded(error)) youtubeProviderCooldown.failed(dispatchedKey, 'DAILY_QUOTA_EXHAUSTED');\n  else if (isYouTubeRateLimited(error)) youtubeProviderCooldown.failed(dispatchedKey, 'RATE_LIMITED');\n}\n\nexport function selectYouTubeDispatchProviderIndex(\n  providerKeys: string[],\n  selectedProviderKey: string | undefined,\n  isEligible: (key: string) => boolean = key => youtubeProviderCooldown.eligible(key)\n): number {\n  if (!providerKeys.length) return -1;\n  const selectedIndex = selectedProviderKey ? providerKeys.indexOf(selectedProviderKey) : -1;\n  if (selectedIndex >= 0 && isEligible(providerKeys[selectedIndex])) return selectedIndex;\n  for (let offset = 0; offset < providerKeys.length; offset++) {\n    const index = (activeKeyIndex + offset) % providerKeys.length;\n    if (isEligible(providerKeys[index])) return index;\n  }\n  return -1;\n}\n"""
          if old not in src:
              raise SystemExit('recordProviderFailure block not found')
          src = src.replace(old, new, 1)

          old_fetch = """async function youtubeFetch(url:string,operation:string,actualCost:number,attempt=1,acquisition?:YouTubePoolAcquisition,priority:YouTubeRequestPriority='enrichment',providerKey?:string):Promise<Response>{\n  const traceId = `${operation}-${attempt}-${++outboundTraceSequence}`;\n  const trace = (stage: string) => console.log(`[YouTube Outbound Trace] ${traceId} ${stage}`);\n  trace('entered youtubeFetch; before timeout-setting-read at server/youtube.ts:119');\n  const configuredTimeout=Number(await getAppSetting('youtube_provider_timeout_ms',process.env.YOUTUBE_PROVIDER_TIMEOUT_MS||'30000'));\n  trace('after timeout-setting-read at server/youtube.ts:119');\n  const timeout=Number.isFinite(configuredTimeout)&&configuredTimeout>0?configuredTimeout:30_000;\n  // Provider selection happens before a request enters the shared scheduler. Re-check\n  // the selected key at dispatch so a key cooled by an earlier queued 429 cannot be\n  // used by work that was already waiting behind it.\n  trace('before scheduler-run at server/youtube.ts:126');\n  return youtubeRequestScheduler.run(()=>{\n    if(providerKey&&!youtubeProviderCooldown.eligible(providerKey)){\n      const retryAt=youtubeProviderCooldown.retryAt(providerKey);\n      throw Object.assign(new Error(`Selected YouTube provider is cooling down until ${new Date(retryAt).toISOString()}.`),{\n        code:'YOUTUBE_PROVIDER_COOLING_DOWN',retryable:true,errorClass:'RATE_LIMIT',retryAt,\n        retryAfterMs:Math.max(0,retryAt-Date.now())\n      });\n    }\n    return executeProviderCall({context:{provider:'youtube',operation,attempt,reservedCost:actualCost,actualCost},timeoutMs:timeout,enabled:true,emit:appendProviderCallEvent,trace,call:async signal=>{\n      trace('before first-request-record at server/youtube.ts:128');\n      await recordFirstYouTubeRequest(operation);\n      trace('after first-request-record at server/youtube.ts:128');\n      trace('before HTTP fetch at server/youtube.ts:131');\n      const response=await fetch(url,{signal});\n      trace(`after HTTP fetch at server/youtube.ts:131 (status=${response.status})`);\n      if(!response.ok){\n        trace('before HTTP-error-body-read at server/youtube.ts:135');\n        const error=await youtubeHttpError(response,trace);\n        trace('after HTTP-error-body-read at server/youtube.ts:135');\n        throw error;\n      }\n      if(providerKey)youtubeProviderCooldown.succeeded(providerKey);\n      acquisition?.providerSucceeded();return response;\n    }});\n  }, trace, priority);\n}\n"""
          new_fetch = """async function youtubeFetch(url:string,operation:string,actualCost:number,attempt=1,acquisition?:YouTubePoolAcquisition,priority:YouTubeRequestPriority='enrichment',providerKey?:string):Promise<Response>{\n  const traceId = `${operation}-${attempt}-${++outboundTraceSequence}`;\n  const trace = (stage: string) => console.log(`[YouTube Outbound Trace] ${traceId} ${stage}`);\n  trace('entered youtubeFetch; before timeout-setting-read at server/youtube.ts:119');\n  const configuredTimeout=Number(await getAppSetting('youtube_provider_timeout_ms',process.env.YOUTUBE_PROVIDER_TIMEOUT_MS||'30000'));\n  trace('after timeout-setting-read at server/youtube.ts:119');\n  const timeout=Number.isFinite(configuredTimeout)&&configuredTimeout>0?configuredTimeout:30_000;\n  let dispatchedProviderKey=providerKey;\n  trace('before scheduler-run at server/youtube.ts:126');\n  try {\n    return await youtubeRequestScheduler.run(()=>{\n      let dispatchedUrl=url;\n      if(providerKey){\n        const livePool=getYouTubeKeyPool();\n        if(!livePool.length)throw new Error('YouTube provider pool became unavailable before request dispatch.');\n        const dispatchIndex=selectYouTubeDispatchProviderIndex(livePool,providerKey);\n        if(dispatchIndex<0){\n          throwIfAllProvidersCoolingDown(livePool);\n          throw new Error('No eligible YouTube provider is available at request dispatch.');\n        }\n        dispatchedProviderKey=livePool[dispatchIndex];\n        if(dispatchedProviderKey!==providerKey){\n          const rebuiltUrl=new URL(url);\n          rebuiltUrl.searchParams.set('key',dispatchedProviderKey);\n          dispatchedUrl=rebuiltUrl.toString();\n          trace(`reselected provider at dispatch (key #${dispatchIndex+1})`);\n        }\n        activeKeyIndex=dispatchIndex;\n      }\n      return executeProviderCall({context:{provider:'youtube',operation,attempt,reservedCost:actualCost,actualCost},timeoutMs:timeout,enabled:true,emit:appendProviderCallEvent,trace,call:async signal=>{\n        trace('before first-request-record at server/youtube.ts:128');\n        await recordFirstYouTubeRequest(operation);\n        trace('after first-request-record at server/youtube.ts:128');\n        trace('before HTTP fetch at server/youtube.ts:131');\n        const response=await fetch(dispatchedUrl,{signal});\n        trace(`after HTTP fetch at server/youtube.ts:131 (status=${response.status})`);\n        if(!response.ok){\n          trace('before HTTP-error-body-read at server/youtube.ts:135');\n          const error=await youtubeHttpError(response,trace);\n          trace('after HTTP-error-body-read at server/youtube.ts:135');\n          throw error;\n        }\n        if(dispatchedProviderKey)youtubeProviderCooldown.succeeded(dispatchedProviderKey);\n        acquisition?.providerSucceeded();return response;\n      }});\n    }, trace, priority);\n  } catch(error) {\n    if(dispatchedProviderKey&&error&&typeof error==='object')Object.assign(error,{providerKey:dispatchedProviderKey});\n    throw error;\n  }\n}\n"""
          if old_fetch not in src:
              raise SystemExit('youtubeFetch block not found')
          src = src.replace(old_fetch, new_fetch, 1)

          # youtubeFetch now owns the preferred working provider because dispatch can reselect.
          src = src.replace('await incrementQuota(FEATURED_CHANNEL_PROVIDER_COST); activeKeyIndex = index;', 'await incrementQuota(FEATURED_CHANNEL_PROVIDER_COST);')
          src = src.replace('await incrementQuota(1);activeKeyIndex=index;', 'await incrementQuota(1);')
          src = src.replace('          activeKeyIndex = currentIndex; // Pin working key as preferred\n', '')
          src = src.replace('        activeKeyIndex = currentIndex;\n', '')
          src = src.replace('      activeKeyIndex = currentIndex;\n', '')
          path.write_text(src)

          test_path = Path('server/youtubeLiveProviderDispatch.test.ts')
          test_path.write_text("""import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport fs from 'node:fs';\nimport { selectYouTubeDispatchProviderIndex } from './youtube';\n\ntest('dispatch provider selection keeps a healthy selected key', () => {\n  const keys=['key-a','key-b','key-c'];\n  assert.equal(selectYouTubeDispatchProviderIndex(keys,'key-b',key=>key!=='key-a'),1);\n});\n\ntest('dispatch provider selection reselects a currently healthy key when the queued key cooled', () => {\n  const keys=['key-a','key-b','key-c'];\n  const eligible=new Set(['key-c']);\n  assert.equal(selectYouTubeDispatchProviderIndex(keys,'key-a',key=>eligible.has(key)),2);\n  eligible.delete('key-c');\n  eligible.add('key-a');\n  assert.equal(selectYouTubeDispatchProviderIndex(keys,'key-b',key=>eligible.has(key)),0);\n});\n\ntest('youtubeFetch performs live reselection inside scheduler dispatch and rebuilds the provider URL', () => {\n  const source=fs.readFileSync(new URL('./youtube.ts',import.meta.url),'utf8');\n  const schedulerStart=source.indexOf('return await youtubeRequestScheduler.run(()=>{');\n  const selection=source.indexOf('selectYouTubeDispatchProviderIndex(livePool,providerKey)',schedulerStart);\n  const rewrite=source.indexOf("rebuiltUrl.searchParams.set('key',dispatchedProviderKey)",selection);\n  const outbound=source.indexOf('fetch(dispatchedUrl,{signal})',rewrite);\n  assert.ok(schedulerStart>=0&&selection>schedulerStart&&rewrite>selection&&outbound>rewrite);\n  assert.match(source,/recordProviderFailure\(key: string, error: unknown\)[\\s\\S]*providerKey/);\n  assert.match(source,/youtubeProviderCooldown\\.succeeded\\(dispatchedProviderKey\\)/);\n});\n""")
          PY
      - name: Focused regression tests
        run: node --import tsx --test server/youtubeLiveProviderDispatch.test.ts server/youtubeProviderCooldown.test.ts server/youtube429SchedulerFeedback.test.ts server/youtubeRequestScheduler.test.ts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "lastdayone87-del"
          git config user.email "lastdayone87@gmail.com"
          git add server/youtube.ts server/youtubeLiveProviderDispatch.test.ts
          git diff --cached --check
          git commit -m "Apply PR237 live dispatch reselection fix"
          git push origin HEAD:fix/restore-per-provider-429-failover
