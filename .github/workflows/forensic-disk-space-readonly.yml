name: Read-only Postgres Disk Space Forensic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disk-forensic:
    name: Query Postgres disk usage read-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.RAILWAY_FORENSIC_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify database secret exists without revealing it
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "RAILWAY_FORENSIC_DATABASE_URL is not configured."
            exit 1
          fi
          echo "Database secret is present."

      - name: Run strictly read-only disk space forensic
        run: node scripts/forensicDiskSpaceReadOnly.cjs

      - name: Upload disk forensic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-disk-space-forensic
          path: forensic-output/
          if-no-files-found: warn
          retention-days: 7
