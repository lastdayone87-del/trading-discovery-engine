name: Apply manual recheck classification fix

on:
  push:
    branches: [fix/manual-recheck-rerun-classification]
    paths:
      - '.github/workflows/apply-manual-recheck-classification-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-recheck-rerun-classification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Apply bounded source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          queue = Path('server/queueManager.ts')
          text = queue.read_text()
          replacement = r'''export async function triggerManualRecheck(channelId: string, enableDebug?: boolean): Promise<{ success: boolean; message: string; channel?: ChannelRecord; debugLog?: any; code?: string; retryable?: boolean }> {
            const channel = await getChannelById(channelId);
            if (!channel) {
              return { success: false, message: 'Channel not found in database.' };
            }

            if (channel.trading_status === 'HUMAN_REJECTED') {
              return { success: false, message: 'Human-rejected channels require the authenticated, audited force-rescan review action.', channel };
            }

            const exclusion = await getCountryExclusion(channel.country);
            if (exclusion) {
              console.warn(JSON.stringify({ event: 'excluded_country_blocked', country: exclusion.country, reason: exclusion.reason, context: 'manual_recheck', channelId, timestamp: new Date().toISOString() }));
              return { success: false, message: `Manual re-scan blocked because ${exclusion.country} is excluded: ${exclusion.reason}`, channel };
            }

            // A manual recheck is a true creator reclassification, not merely a
            // Discord/community recrawl. Acquire fresh authoritative YouTube
            // creator metadata first. If acquisition is unavailable, preserve
            // the existing trading classification and return a retryable
            // operational failure rather than classifying placeholder data.
            const fallback: DiscoveredChannelRaw = {
              channelId: channel.channel_id,
              channelName: channel.channel_name,
              youtubeUrl: channel.youtube_url,
              description: channel.channel_name,
              videoTitles: [channel.channel_name],
              channelLinks: channel.discord_invite ? [channel.discord_invite] : [],
              channelThumbnailUrl: channel.channel_thumbnail_url
            };

            let freshCandidate: DiscoveredChannelRaw;
            try {
              freshCandidate = await fetchYouTubeChannelEnrichment(channelId, fallback, 1);
            } catch (error) {
              const detail = error instanceof Error ? error.message : String(error);
              console.warn(`[Manual Recheck] Fresh YouTube creator acquisition failed for ${channelId}; preserving prior trading classification: ${detail}`);
              return {
                success: false,
                message: `Manual re-scan could not acquire fresh YouTube creator evidence. Existing trading classification was preserved; retry is recommended. ${detail}`,
                code: 'MANUAL_RESCAN_UPSTREAM_FAILURE',
                retryable: true,
                channel
              };
            }

            freshCandidate.enrichmentStage = Math.max(1, freshCandidate.enrichmentStage || 0);
            freshCandidate.matchedDocument = { type: 'MANUAL', locator: `recheck:${channelId}` };
            console.log(`[Manual Reclassification Started] Channel: ${channel.channel_name} (${channel.channel_id})`);

            try {
              const outcome = await processChannelThroughPipeline(freshCandidate, channel.country, 'recheck', true, true);
              const updatedChannel = outcome.channelRecord || await getChannelById(channelId) || undefined;
              console.log(`[Manual Reclassification Completed] Channel: ${channel.channel_name}, Trading Status: ${updatedChannel?.trading_status || outcome.tradingStatus}, Score: ${updatedChannel?.trading_confidence_score ?? 'unknown'}, Discord Status: ${updatedChannel?.discord_status || outcome.discordStatus}`);
              return {
                success: true,
                message: `Manual re-scan completed for ${channel.channel_name}. Trading classification and downstream inspection were refreshed from current evidence.`,
                channel: updatedChannel
              };
            } catch (error: any) {
              const detail = error instanceof Error ? error.message : String(error);
              const preserved = await getChannelById(channelId) || channel;
              const code = String(error?.code || 'MANUAL_RESCAN_OPERATIONAL_FAILURE');
              console.warn(`[Manual Recheck] Reclassification failed operationally for ${channelId}; preserving prior decision where no complete classification was produced: ${detail}`);
              return {
                success: false,
                message: `Manual re-scan could not complete a reliable trading reclassification. Existing classification was preserved where the classifier had incomplete provider coverage; retry is recommended. ${detail}`,
                code,
                retryable: error?.retryable !== false,
                channel: preserved
              };
            }
          }

          export interface SearchExecutionResult'''
          pattern = re.compile(r"export async function triggerManualRecheck\(.*?\n}\n\nexport interface SearchExecutionResult", re.S)
          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one triggerManualRecheck block, replaced {count}')
          queue.write_text(new_text)

          ingestion = Path('server/ingestionPipeline.ts')
          text = ingestion.read_text()
          needle = "  const productionClassification = await classifyTradingRelevanceDetailed(classifierInput);\n"
          insertion = needle + "  // Manual rechecks are operator-requested semantic refreshes. A runtime provider\n  // failure must not turn incomplete evidence into a replacement classification.\n  // Fail before diagnostic/admission/channel writes so the prior production\n  // decision remains authoritative until a complete recheck can run.\n  if (source === 'recheck' && isManualScan && productionClassification.decision.evidenceCollection.degraded) {\n    const failedProviders = productionClassification.decision.evidenceCollection.providers.filter(provider => provider.availability === 'FAILED');\n    const reasonCodes = failedProviders.flatMap(provider => provider.reasonCodes || []);\n    const error = Object.assign(\n      new Error(`Manual recheck classification provider coverage is degraded: ${failedProviders.map(provider => provider.provider).join(', ') || 'unknown provider'}.`),\n      { code: 'MANUAL_RESCAN_CLASSIFICATION_DEGRADED', retryable: true, providerReasons: reasonCodes }\n    );\n    throw error;\n  }\n"
          if text.count(needle) != 1:
              raise SystemExit(f'expected one classification call, found {text.count(needle)}')
          ingestion.write_text(text.replace(needle, insertion, 1))
          PY
      - name: Add regression tests
        run: |
          cat > server/manualRecheckClassification.test.ts <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const queue = readFileSync(new URL('./queueManager.ts', import.meta.url), 'utf8');
          const ingestion = readFileSync(new URL('./ingestionPipeline.ts', import.meta.url), 'utf8');
          const recheck = queue.slice(queue.indexOf('export async function triggerManualRecheck'), queue.indexOf('export interface SearchExecutionResult'));

          test('manual recheck acquires fresh creator metadata and reruns unified trading pipeline', () => {
            assert.match(recheck, /fetchYouTubeChannelEnrichment\(channelId, fallback, 1\)/);
            assert.match(recheck, /processChannelThroughPipeline\(freshCandidate, channel\.country, 'recheck', true, true\)/);
            assert.doesNotMatch(recheck, /inspectAndValidateChannel\(/);
          });

          test('manual recheck preserves existing classification when fresh YouTube acquisition fails', () => {
            const acquisition = recheck.indexOf('fetchYouTubeChannelEnrichment');
            const pipeline = recheck.indexOf('processChannelThroughPipeline');
            assert.ok(acquisition >= 0 && pipeline > acquisition);
            assert.match(recheck, /MANUAL_RESCAN_UPSTREAM_FAILURE/);
            assert.match(recheck, /Existing trading classification was preserved/);
          });

          test('manual recheck fails closed on degraded classifier provider coverage before diagnostic writes', () => {
            const classify = ingestion.indexOf('const productionClassification = await classifyTradingRelevanceDetailed(classifierInput);');
            const guard = ingestion.indexOf("source === 'recheck' && isManualScan && productionClassification.decision.evidenceCollection.degraded");
            const diagnostic = ingestion.indexOf('observeProductionDiagnosticReliably', classify);
            assert.ok(classify >= 0 && guard > classify && diagnostic > guard);
            assert.match(ingestion, /MANUAL_RESCAN_CLASSIFICATION_DEGRADED/);
          });
          EOF
      - name: Verify focused tests and build
        run: |
          node --import tsx --test server/manualRecheckClassification.test.ts server/providerResilience.test.ts server/evidenceEngine/providerFailureDiagnostics.test.ts
          npm run build
          git diff --check
      - name: Remove temporary patch workflow and commit
        run: |
          rm .github/workflows/apply-manual-recheck-classification-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/queueManager.ts server/ingestionPipeline.ts server/manualRecheckClassification.test.ts .github/workflows/apply-manual-recheck-classification-fix.yml
          git commit -m "fix(rescan): rerun trading classification from fresh evidence"
          git push origin HEAD:fix/manual-recheck-rerun-classification
