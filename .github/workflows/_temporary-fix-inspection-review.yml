name: Temporary inspection review rewrite
on:
  push:
    branches:
      - fix/inspection-retention-and-review-routing
jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inspection-retention-and-review-routing
      - run: python .github/scripts/fix_inspection_review.py
      - run: |
          rm .github/workflows/_temporary-fix-inspection-review.yml
          rm .github/scripts/fix_inspection_review.py
          git config user.name lastdayone87-del
          git config user.email lastdayone87@gmail.com
          git add -A
          git commit -m "Fix Discord retention trail and exhausted review routing"
          git push origin HEAD:fix/inspection-retention-and-review-routing