name: YouTube provider bake-off

on:
  pull_request:
    paths:
      - 'scripts/youtubeProviderBakeoff.ts'
      - 'server/youtubeProviderShadowQuality.ts'
      - 'server/youtubeProviderShadowQuality.test.ts'
      - 'server/candidateTriage.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/youtube-provider-bakeoff.yml'

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deterministic shadow-quality tests
        run: node --import tsx --test server/youtubeProviderShadowQuality.test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Shadow runner smoke test
        env:
          BAKEOFF_QUERY_LIMIT: '1'
          BAKEOFF_MAX_PAGES: '1'
          BAKEOFF_OUTPUT: youtube-provider-bakeoff-smoke.json
        run: npm run youtube:provider-bakeoff
      - name: Verify smoke shadow-mode contract
        run: |
          node -e "const r=require('./youtube-provider-bakeoff-smoke.json'); if(r.shadowMode!==true||r.productionWrites!==false||r.productionConfirmationMeasured!==false) process.exit(1); if(!r.summary.every(x=>x.productionWrites===false&&x.productionConfirmationMeasured===false)) process.exit(1); const names=new Set(r.summary.map(x=>x.provider)); for(const n of ['YOUTUBE_JS','YOUTUBE_JS_MONTH','YOUTUBE_JS_YEAR','YOUTUBE_SEARCH_API']) if(!names.has(n)) process.exit(1);"
      - name: Larger multilingual shadow bake-off
        env:
          BAKEOFF_QUERY_LIMIT: '20'
          BAKEOFF_MAX_PAGES: '2'
          BAKEOFF_OUTPUT: youtube-provider-bakeoff-large.json
        run: npm run youtube:provider-bakeoff
      - name: Verify larger bake-off safety contract
        run: |
          node -e "const r=require('./youtube-provider-bakeoff-large.json'); if(r.shadowMode!==true||r.productionWrites!==false||r.productionConfirmationMeasured!==false) process.exit(1); if(r.queryCount!==20||r.maxPages!==2) process.exit(1); if(!r.summary.every(x=>x.productionWrites===false&&x.productionConfirmationMeasured===false)) process.exit(1); const names=new Set(r.summary.map(x=>x.provider)); for(const n of ['YOUTUBE_JS','YOUTUBE_JS_MONTH','YOUTUBE_JS_YEAR','YOUTUBE_SEARCH_API']) if(!names.has(n)) process.exit(1);"
      - name: Upload larger bake-off report
        uses: actions/upload-artifact@v4
        with:
          name: youtube-provider-bakeoff-large
          path: youtube-provider-bakeoff-large.json
          if-no-files-found: error
          retention-days: 7
