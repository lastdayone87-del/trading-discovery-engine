name: Legacy false-negative recovery

on:
  pull_request:
    paths:
      - 'server/db/migrations/098_recover_conflict_policy_false_negatives.sql'
      - 'server/legacyFalseNegativeRecovery.test.ts'
      - 'server/operationalMaintenanceWorkers.ts'
      - 'server/ingestionPipeline.ts'
      - 'src/components/ResultsTable.tsx'
      - '.github/workflows/legacy-false-negative-recovery.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Recovery policy regressions
        run: node --import tsx --test server/legacyFalseNegativeRecovery.test.ts server/operationalMaintenanceWorkers.test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
