name: Apply manual recheck community fallback

on:
  push:
    branches:
      - fix/manual-recheck-community-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-recheck-community-fallback
          fetch-depth: 0
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          q = Path('server/queueManager.ts')
          text = q.read_text()

          import_anchor = "import { triggerPhaseBObservationReconciliation } from './phaseBObservationOutbox';\n"
          import_line = "import { canContinueCommunityInspectionAfterDegradedManualClassification } from './manualRecheckPolicy';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('queueManager import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = """      console.warn(`[Manual Recheck] Reclassification failed operationally for ${channelId}; preserving prior decision where no complete classification was produced: ${detail}`);\n      return {\n        success: false,\n        message: `Manual re-scan could not complete a reliable trading reclassification. Existing classification was preserved where the classifier had incomplete provider coverage. ${detail}`,\n        code,\n        retryable: typedTransient,\n        errorClass: MANUAL_RECHECK_ERROR_CLASSES.has(rawErrorClass) ? rawErrorClass : undefined,\n        retryAt: Number.isFinite(Number(error?.retryAt)) ? Number(error.retryAt) : undefined,\n        retryAfterMs: Number.isFinite(Number(error?.retryAfterMs)) ? Number(error.retryAfterMs) : undefined,\n        channel: preserved\n      };\n"""
          new = """      console.warn(`[Manual Recheck] Reclassification failed operationally for ${channelId}; preserving prior decision where no complete classification was produced: ${detail}`);\n\n      if (canContinueCommunityInspectionAfterDegradedManualClassification({\n        existingTradingStatus: preserved.trading_status,\n        errorCode: code\n      })) {\n        console.warn(`[Manual Recheck] Gemini classification coverage is degraded for already-confirmed trading creator ${channelId}; preserving TRADING_CONFIRMED and continuing fresh community inspection.`);\n        try {\n          preserved.trading_status = 'TRADING_CONFIRMED';\n          await inspectAndValidateChannel(preserved, freshCandidate, true, enableDebug, false);\n          const communityRefreshed = await getChannelById(channelId) || preserved;\n          const communityIncomplete = communityRefreshed.scan_status === 'FAILED' || communityRefreshed.scan_status === 'FAILED_PERMANENT';\n          if (communityIncomplete) {\n            return {\n              success: false,\n              message: `Manual re-scan preserved the existing trading classification because semantic provider coverage was degraded, but the fresh Discord/community inspection did not complete reliably.`,\n              code: 'MANUAL_RESCAN_COMMUNITY_INCOMPLETE',\n              retryable: true,\n              errorClass: 'TRANSIENT',\n              channel: communityRefreshed\n            };\n          }\n          return {\n            success: true,\n            message: `Manual re-scan preserved the existing TRADING_CONFIRMED classification while semantic provider coverage was degraded, and refreshed Discord/community inspection from current evidence.`,\n            channel: communityRefreshed\n          };\n        } catch (communityError: any) {\n          const communityDetail = communityError instanceof Error ? communityError.message : String(communityError);\n          console.warn(`[Manual Recheck] Community-only continuation failed for ${channelId}: ${communityDetail}`);\n          return {\n            success: false,\n            message: `Manual re-scan preserved the existing trading classification because semantic provider coverage was degraded, but fresh Discord/community inspection failed operationally. ${communityDetail}`,\n            code: 'MANUAL_RESCAN_COMMUNITY_INCOMPLETE',\n            retryable: true,\n            errorClass: 'TRANSIENT',\n            channel: await getChannelById(channelId) || preserved\n          };\n        }\n      }\n\n      return {\n        success: false,\n        message: `Manual re-scan could not complete a reliable trading reclassification. Existing classification was preserved where the classifier had incomplete provider coverage. ${detail}`,\n        code,\n        retryable: typedTransient,\n        errorClass: MANUAL_RECHECK_ERROR_CLASSES.has(rawErrorClass) ? rawErrorClass : undefined,\n        retryAt: Number.isFinite(Number(error?.retryAt)) ? Number(error.retryAt) : undefined,\n        retryAfterMs: Number.isFinite(Number(error?.retryAfterMs)) ? Number(error.retryAfterMs) : undefined,\n        channel: preserved\n      };\n"""
          if old not in text:
              raise SystemExit('manual recheck catch anchor not found')
          text = text.replace(old, new, 1)
          q.write_text(text)

          Path('server/manualRecheckPolicy.ts').write_text("""export interface DegradedManualClassificationInput {\n  existingTradingStatus?: string | null;\n  errorCode?: string | null;\n}\n\n/**\n * Manual community inspection may continue without a fresh semantic trading\n * decision only when an earlier trusted decision already says the creator is\n * trading and the current failure is specifically incomplete classifier\n * coverage. This is deliberately not a general provider-failure bypass.\n */\nexport function canContinueCommunityInspectionAfterDegradedManualClassification(\n  input: DegradedManualClassificationInput\n): boolean {\n  return input.existingTradingStatus === 'TRADING_CONFIRMED'\n    && input.errorCode === 'MANUAL_RESCAN_CLASSIFICATION_DEGRADED';\n}\n""")

          Path('server/manualRecheckPolicy.test.ts').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { canContinueCommunityInspectionAfterDegradedManualClassification } from './manualRecheckPolicy';\n\ntest('already-confirmed trading creator can continue community inspection on classification coverage degradation', () => {\n  assert.equal(canContinueCommunityInspectionAfterDegradedManualClassification({\n    existingTradingStatus: 'TRADING_CONFIRMED',\n    errorCode: 'MANUAL_RESCAN_CLASSIFICATION_DEGRADED'\n  }), true);\n});\n\ntest('uncertain or non-trading creator cannot bypass reliable reclassification', () => {\n  for (const status of ['UNCERTAIN', 'NON_TRADING', 'NEEDS_REVIEW', 'HUMAN_REJECTED']) {\n    assert.equal(canContinueCommunityInspectionAfterDegradedManualClassification({\n      existingTradingStatus: status,\n      errorCode: 'MANUAL_RESCAN_CLASSIFICATION_DEGRADED'\n    }), false);\n  }\n});\n\ntest('confirmed creator does not bypass unrelated manual recheck failures', () => {\n  for (const code of ['MANUAL_RESCAN_UPSTREAM_FAILURE', 'QUOTA_ALLOCATION_EXHAUSTED', 'MANUAL_RESCAN_OPERATIONAL_FAILURE']) {\n    assert.equal(canContinueCommunityInspectionAfterDegradedManualClassification({\n      existingTradingStatus: 'TRADING_CONFIRMED',\n      errorCode: code\n    }), false);\n  }\n});\n""")

          Path('.github/workflows/apply-manual-recheck-community-fallback.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Allow confirmed creators to refresh community data during Gemini degradation"
          git push origin HEAD:fix/manual-recheck-community-fallback
