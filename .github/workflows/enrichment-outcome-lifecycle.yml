name: Enrichment outcome lifecycle

on:
  pull_request:
    paths:
      - 'server/candidateTriage.ts'
      - 'server/voiEvidenceController.ts'
      - 'server/evidenceEngine/stagedClassification.ts'
      - 'server/enrichmentOutcomeLifecycle.test.ts'
      - 'server/enrichmentBacklogDiagnostics.ts'
      - 'server/enrichmentOperationalFailure.ts'
      - 'server/enrichmentBacklogEvidence.test.ts'
      - 'server/operationalEnrichmentRecovery.ts'
      - 'server/operationalEnrichmentRecovery.test.ts'
      - 'server/communityRecovery.ts'
      - 'server/communityRecovery.test.ts'
      - 'server/communityRetryPolicy.ts'
      - 'server/communityRetryPolicy.test.ts'
      - 'server/restoreOfficialEnrichmentFlow.test.ts'
      - 'server/db/migrations/088_restore_official_enrichment_flow.sql'
      - '.github/workflows/enrichment-outcome-lifecycle.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Enrichment outcome lifecycle tests
        run: node --import tsx --test server/enrichmentOutcomeLifecycle.test.ts server/enrichmentBacklogEvidence.test.ts server/operationalEnrichmentRecovery.test.ts server/communityRecovery.test.ts server/communityRetryPolicy.test.ts server/restoreOfficialEnrichmentFlow.test.ts server/autonomousRootFirewall.test.ts server/queryEvidenceIndependence.test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
