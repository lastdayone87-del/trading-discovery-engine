name: Phase1Autofix

on:
  push:
    branches:
      - fix/review-state-semantics-phase1
    paths:
      - .github/workflows/phase1-source-autofix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-state-semantics-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/phase1_autofix.py
      - run: |
          git config user.name phase1-autofix
          git config user.email phase1-autofix@users.noreply.github.com
          git rm .github/workflows/phase1-source-autofix.yml scripts/phase1_autofix.py
          git add server/ingestionPipeline.ts server/queueManager.ts server/investigationWorkflow.ts
          git commit -m 'fix: apply final Phase 1 source patches'
          git push origin HEAD:fix/review-state-semantics-phase1
