name: Temporary PR235 expired reservation recovery fix
on: push
permissions:
  contents: write
jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrichment-backlog-gemini-degradation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch recovery path and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          q=Path('server/queueManager.ts')
          s=q.read_text()
          old="""      const candidateAlreadyEnriched=Number(candidate.enrichmentStage||0)>=enrichmentStage;
      const enrichmentQuotaUnits=candidateAlreadyEnriched?0:(enrichmentStage>=2?202:101);
      let quotaReserved=false;"""
          new="""      const candidateAlreadyEnriched=Number(candidate.enrichmentStage||0)>=enrichmentStage;
      const enrichmentQuotaUnits=candidateAlreadyEnriched?0:(enrichmentStage>=2?202:101);
      let enrichmentProviderCostUnits=candidateAlreadyEnriched
        ? Math.max(0,Number((candidate as DiscoveredChannelRaw & {enrichmentProviderCostUnits?:number}).enrichmentProviderCostUnits||0))
        : enrichmentQuotaUnits;
      let quotaReserved=false;"""
          if s.count(old)!=1: raise SystemExit(f'quota anchor matches={s.count(old)}')
          s=s.replace(old,new,1)

          old="""          if(!toppedUp)throw new QuotaAllocationExhaustedError('ENRICHMENT');
        });
        if(!candidateAlreadyEnriched){
          const db=await getDb();"""
          new="""          if(!toppedUp)throw new QuotaAllocationExhaustedError('ENRICHMENT');
          enrichmentProviderCostUnits+=additionalUnits;
        });
        if(!candidateAlreadyEnriched){
          (enriched as DiscoveredChannelRaw & {enrichmentProviderCostUnits?:number}).enrichmentProviderCostUnits=enrichmentProviderCostUnits;
          const db=await getDb();"""
          if s.count(old)!=1: raise SystemExit(f'persist anchor matches={s.count(old)}')
          s=s.replace(old,new,1)

          old="""        } else {
          // Idempotently reconcile a reservation left RESERVED if a prior worker
          // crashed after persisting the paid enrichment payload.
          await finishQuotaReservation('ENRICH_CHANNEL',job.id,true);
        }
        const pipelineOutcome=await processChannelThroughPipeline(enriched,targetCountry,source,false,true);
        if(evidenceDecisionId)await recordEvidenceActionOutcome({decisionId:evidenceDecisionId,jobId:job.id,attempt:job.attempts,status:'SUCCEEDED',resultingStatus:pipelineOutcome.tradingStatus,providerCost:enrichmentQuotaUnits,latencyMs:Date.now()-evidenceStartedAt"""
          new="""        } else {
          // A cached payload proves the paid YouTube acquisition completed. Recover
          // both RESERVED and EXPIRED reservations so stale-job delay cannot erase
          // real cost/accounting after the durable payload crash boundary.
          const db=await getDb();
          const recovered=await db.query(`UPDATE quota_reservations SET status='CONSUMED',consumed_at=COALESCE(consumed_at,now()) WHERE operation_type='ENRICH_CHANNEL' AND operation_id=$1 AND status IN('RESERVED','EXPIRED') RETURNING units`,[job.id]);
          if(enrichmentProviderCostUnits<=0){
            const units=recovered.rows[0]?.units ?? (await db.query(`SELECT units FROM quota_reservations WHERE operation_type='ENRICH_CHANNEL' AND operation_id=$1 AND status='CONSUMED' LIMIT 1`,[job.id])).rows[0]?.units;
            enrichmentProviderCostUnits=Math.max(0,Number(units||0));
          }
        }
        const pipelineOutcome=await processChannelThroughPipeline(enriched,targetCountry,source,false,true);
        if(evidenceDecisionId)await recordEvidenceActionOutcome({decisionId:evidenceDecisionId,jobId:job.id,attempt:job.attempts,status:'SUCCEEDED',resultingStatus:pipelineOutcome.tradingStatus,providerCost:enrichmentProviderCostUnits,latencyMs:Date.now()-evidenceStartedAt"""
          if s.count(old)!=1: raise SystemExit(f'cached anchor matches={s.count(old)}')
          s=s.replace(old,new,1)
          q.write_text(s)

          t=Path('server/enrichmentBacklogDrain.contract.test.ts')
          s=t.read_text().rstrip()
          marker='expired cached-payload recovery preserves paid quota and provider cost'
          if marker not in s:
            s += """

test('expired cached-payload recovery preserves paid quota and provider cost',()=>{
  const source=fs.readFileSync(new URL('./queueManager.ts',import.meta.url),'utf8');
  assert.match(source,/let enrichmentProviderCostUnits=candidateAlreadyEnriched/);
  assert.match(source,/enrichmentProviderCostUnits\\+=additionalUnits/);
  assert.match(source,/enrichmentProviderCostUnits=enrichmentProviderCostUnits/);
  assert.match(source,/status IN\\('RESERVED','EXPIRED'\\) RETURNING units/);
  assert.match(source,/SELECT units FROM quota_reservations[\\s\\S]*?status='CONSUMED'/);
  assert.match(source,/providerCost:enrichmentProviderCostUnits/);
});
"""
          t.write_text(s+'\n')
          PY
      - name: Focused tests
        run: node --import tsx --test server/enrichmentBacklogDrain.contract.test.ts server/enrichmentOperationalFailure.test.ts server/quotaRecovery.test.ts server/providerRetryPolicy.test.ts server/pre203ThroughputRestoration.contract.test.ts server/youtubeRequestScheduler.test.ts server/restoreOfficialEnrichmentFlow.test.ts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-fix-pr235-expired-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/queueManager.ts server/enrichmentBacklogDrain.contract.test.ts .github/workflows/temp-fix-pr235-expired-recovery.yml
          git commit -m "Recover expired enrichment reservations safely"
          git push origin HEAD:fix/enrichment-backlog-gemini-degradation
