name: Apply PR229 final fixes

on:
  push:
    branches:
      - fix/remove-provider2-runtime
    paths:
      - .github/workflows/apply-pr229-final-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add PR229 final fix applicator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-provider2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply surgical fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def require(text, needle, label):
              if needle not in text:
                  raise SystemExit(f'missing expected pattern: {label}')

          # queueManager: operational consumers must be exclusive and quota admission
          # must cover the bounded configured key-pool worst case while actual accounting
          # remains at the real stage/page cost.
          p = Path('server/queueManager.ts')
          s = p.read_text()
          require(s, "  getDailyYouTubeQuotaBudget,\n  appendDiscordCheckAttempts,", 'db import anchor')
          s = s.replace(
              "  getDailyYouTubeQuotaBudget,\n  appendDiscordCheckAttempts,",
              "  getDailyYouTubeQuotaBudget,\n  getYouTubeKeyPool,\n  appendDiscordCheckAttempts,",
              1,
          )
          require(s, "if (!qStatus.channelProcessing.isPaused && (!claimableOverride || claimableOverride.includes('POST_APPROVAL_ENRICH'))) claimableTypes.push('POST_APPROVAL_ENRICH');", 'post approval unrestricted claim')
          require(s, "if (!qStatus.channelProcessing.isPaused && (!claimableOverride || claimableOverride.includes('FORCE_REVIEW_RESCAN'))) claimableTypes.push('FORCE_REVIEW_RESCAN');", 'force rescan unrestricted claim')
          s = s.replace(
              "if (!qStatus.channelProcessing.isPaused && (!claimableOverride || claimableOverride.includes('POST_APPROVAL_ENRICH'))) claimableTypes.push('POST_APPROVAL_ENRICH');",
              "if (!qStatus.channelProcessing.isPaused && claimableOverride?.includes('POST_APPROVAL_ENRICH')) claimableTypes.push('POST_APPROVAL_ENRICH');",
              1,
          )
          s = s.replace(
              "if (!qStatus.channelProcessing.isPaused && (!claimableOverride || claimableOverride.includes('FORCE_REVIEW_RESCAN'))) claimableTypes.push('FORCE_REVIEW_RESCAN');",
              "if (!qStatus.channelProcessing.isPaused && claimableOverride?.includes('FORCE_REVIEW_RESCAN')) claimableTypes.push('FORCE_REVIEW_RESCAN');",
              1,
          )
          require(s, "      const enrichmentQuotaUnits=enrichmentStage>=2?202:101;\n      const quotaReserved = await tryReserveQuota({\n        operationType: 'ENRICH_CHANNEL', operationId: job.id, allocation: 'ENRICHMENT',\n        units: enrichmentQuotaUnits, dailyBudget, allocationPercent: enrichmentPercent\n      });", 'enrichment reservation')
          s = s.replace(
              "      const enrichmentQuotaUnits=enrichmentStage>=2?202:101;\n      const quotaReserved = await tryReserveQuota({\n        operationType: 'ENRICH_CHANNEL', operationId: job.id, allocation: 'ENRICHMENT',\n        units: enrichmentQuotaUnits, dailyBudget, allocationPercent: enrichmentPercent\n      });",
              "      const enrichmentQuotaUnits=enrichmentStage>=2?202:101;\n      const enrichmentReservationUnits=enrichmentQuotaUnits*Math.max(1,getYouTubeKeyPool().length);\n      const quotaReserved = await tryReserveQuota({\n        operationType: 'ENRICH_CHANNEL', operationId: job.id, allocation: 'ENRICHMENT',\n        units: enrichmentReservationUnits, dailyBudget, allocationPercent: enrichmentPercent\n      });",
              1,
          )
          require(s, "      providerQuotaUnits=100;\n      const budget=getDailyYouTubeQuotaBudget();\n      const percent=Number(await getAppSetting('discovery_autonomous_quota_percent','70'));\n      if(!await tryReserveQuota({operationType:'AUTONOMOUS_QUERY_PAGE',operationId:autonomousOperationId,allocation:'AUTONOMOUS',units:providerQuotaUnits,dailyBudget:budget,allocationPercent:percent}))", 'autonomous reservation')
          s = s.replace(
              "      providerQuotaUnits=100;\n      const budget=getDailyYouTubeQuotaBudget();\n      const percent=Number(await getAppSetting('discovery_autonomous_quota_percent','70'));\n      if(!await tryReserveQuota({operationType:'AUTONOMOUS_QUERY_PAGE',operationId:autonomousOperationId,allocation:'AUTONOMOUS',units:providerQuotaUnits,dailyBudget:budget,allocationPercent:percent}))",
              "      providerQuotaUnits=100;\n      const providerReservationUnits=providerQuotaUnits*Math.max(1,getYouTubeKeyPool().length);\n      const budget=getDailyYouTubeQuotaBudget();\n      const percent=Number(await getAppSetting('discovery_autonomous_quota_percent','70'));\n      if(!await tryReserveQuota({operationType:'AUTONOMOUS_QUERY_PAGE',operationId:autonomousOperationId,allocation:'AUTONOMOUS',units:providerReservationUnits,dailyBudget:budget,allocationPercent:percent}))",
              1,
          )
          p.write_text(s)

          # Provider2 incident recovery: only explicit retryable upstream failures are
          # infrastructure retries. Policy/not-found/ineligible outcomes remain bounded.
          p = Path('server/operationalMaintenanceWorkers.ts')
          s = p.read_text()
          require(s, 'const retryable = result.retryable !== false;', 'recovery retryability')
          s = s.replace('const retryable = result.retryable !== false;', 'const retryable = result.retryable === true;', 1)
          p.write_text(s)

          # Queue monitor: remove retired YouTube.js/hybrid telemetry and expose only
          # official Data API enrichment health/costs.
          p = Path('src/components/QueueMonitor.tsx')
          s = p.read_text()
          s = s.replace("  return operation === 'hybrid-enrichment-channel-details'\n    || operation === 'channel-details'", "  return operation === 'channel-details'", 1)
          old = """    const youtubeJsRows = providerRows.filter(row => row.provider.toLowerCase() === 'youtube_js' && row.operation.includes('channel-enrichment'));
    const officialRows = providerRows.filter(row => row.provider.toLowerCase() === 'youtube' && isOfficialEnrichmentOperation(row.operation));
    const hybridOfficialRows = officialRows.filter(row => row.operation === 'hybrid-enrichment-channel-details');
    const displayedRows = [...youtubeJsRows, ...officialRows];

    const sum = (rows: ProviderMetricRow[], key: keyof ProviderMetricRow) => rows.reduce((total, row) => total + Number(row[key] || 0), 0);
    const youtubeJsCalls = sum(youtubeJsRows, 'calls');
    const youtubeJsSuccesses = sum(youtubeJsRows, 'successes');
    const youtubeJsErrors = sum(youtubeJsRows, 'errors') + sum(youtubeJsRows, 'timeouts');
    const officialActualCost = sum(officialRows, 'actual_cost');
    const officialReservedCost = sum(officialRows, 'reserved_cost');
    const hybridOfficialActualCost = sum(hybridOfficialRows, 'actual_cost');
    const baseAcquisitions = youtubeJsRows.filter(row => row.operation === 'channel-enrichment');
    const baseSuccesses = sum(baseAcquisitions, 'successes');
    const averageOfficialUnits = baseSuccesses > 0 ? hybridOfficialActualCost / baseSuccesses : null;
    const weightedLatency = youtubeJsCalls > 0
      ? youtubeJsRows.reduce((total, row) => total + Number(row.average_latency_ms || 0) * Number(row.calls || 0), 0) / youtubeJsCalls
      : 0;"""
          new = """    const officialRows = providerRows.filter(row => row.provider.toLowerCase() === 'youtube' && isOfficialEnrichmentOperation(row.operation));
    const displayedRows = officialRows;

    const sum = (rows: ProviderMetricRow[], key: keyof ProviderMetricRow) => rows.reduce((total, row) => total + Number(row[key] || 0), 0);
    const officialCalls = sum(officialRows, 'calls');
    const officialSuccesses = sum(officialRows, 'successes');
    const officialErrors = sum(officialRows, 'errors') + sum(officialRows, 'timeouts');
    const officialActualCost = sum(officialRows, 'actual_cost');
    const officialReservedCost = sum(officialRows, 'reserved_cost');
    const baseAcquisitions = officialRows.filter(row => row.operation === 'channel-uploads');
    const baseSuccesses = sum(baseAcquisitions, 'successes');
    const averageOfficialUnits = baseSuccesses > 0 ? officialActualCost / baseSuccesses : null;
    const weightedLatency = officialCalls > 0
      ? officialRows.reduce((total, row) => total + Number(row.average_latency_ms || 0) * Number(row.calls || 0), 0) / officialCalls
      : 0;"""
          require(s, old, 'QueueMonitor provider aggregation block')
          s = s.replace(old, new, 1)
          s = s.replace('youtubeJsCalls', 'officialCalls')
          s = s.replace('youtubeJsSuccesses', 'officialSuccesses')
          s = s.replace('youtubeJsErrors', 'officialErrors')
          s = s.replace('youtubeJsLatencyMs', 'officialLatencyMs')
          s = s.replace('YouTube.js', 'YouTube Data API')
          s = s.replace('hybrid enrichment', 'official enrichment')
          s = s.replace('Hybrid enrichment', 'Official enrichment')
          s = s.replace('near 1 official unit', '101 units for stage 1 and 202 units for stage 2')
          s = s.replace('~1 official unit', '101/202 official units by stage')
          if 'youtube_js' in s or 'hybrid-enrichment-channel-details' in s or 'YouTube.js' in s:
              raise SystemExit('retired QueueMonitor provider telemetry still present')
          p.write_text(s)

          # Update focused contracts to protect the final behavior.
          p = Path('server/operationalMaintenanceWorkers.test.ts')
          s = p.read_text().replace(
              r"assert.match(workers, /const retryable = result\.retryable !== false/);",
              r"assert.match(workers, /const retryable = result\.retryable === true/);",
          )
          p.write_text(s)

          p = Path('server/provider2Removal.contract.test.ts')
          s = p.read_text()
          additions = """

test('operational rechecks cannot bypass their dedicated quota-gated workers', () => {
  assert.match(queueManager, /claimableOverride\?\.includes\('POST_APPROVAL_ENRICH'\)/);
  assert.match(queueManager, /claimableOverride\?\.includes\('FORCE_REVIEW_RESCAN'\)/);
  assert.doesNotMatch(queueManager, /!claimableOverride \|\| claimableOverride\.includes\('POST_APPROVAL_ENRICH'\)/);
  assert.doesNotMatch(queueManager, /!claimableOverride \|\| claimableOverride\.includes\('FORCE_REVIEW_RESCAN'\)/);
});

test('official enrichment and autonomous admission reserve the configured key-pool worst case', () => {
  assert.match(queueManager, /getYouTubeKeyPool/);
  assert.match(queueManager, /enrichmentReservationUnits=enrichmentQuotaUnits\*Math\.max\(1,getYouTubeKeyPool\(\)\.length\)/);
  assert.match(queueManager, /units: enrichmentReservationUnits/);
  assert.match(queueManager, /providerReservationUnits=providerQuotaUnits\*Math\.max\(1,getYouTubeKeyPool\(\)\.length\)/);
  assert.match(queueManager, /units:providerReservationUnits/);
});

test('queue monitor reports only official Data API enrichment health', () => {
  assert.doesNotMatch(queueMonitor, /youtube_js|YouTube\.js|hybrid-enrichment-channel-details/);
  assert.match(queueMonitor, /YouTube Data API/);
  assert.match(queueMonitor, /channel-uploads/);
});
"""
          if "queue monitor reports only official Data API enrichment health" not in s:
              # Ensure the contract has a QueueMonitor source binding.
              if "const queueMonitor" not in s:
                  anchor = "const packageJson = readFileSync(join(root, 'package.json'), 'utf8');"
                  if anchor in s:
                      s = s.replace(anchor, anchor + "\nconst queueMonitor = readFileSync(join(root, 'src/components/QueueMonitor.tsx'), 'utf8');", 1)
                  else:
                      # Fallback near other readFileSync declarations.
                      m = re.search(r"(const .*?= readFileSync\(join\(root, 'package\.json'\).*?;)", s)
                      if not m:
                          raise SystemExit('provider2 contract packageJson anchor not found')
                      s = s[:m.end()] + "\nconst queueMonitor = readFileSync(join(root, 'src/components/QueueMonitor.tsx'), 'utf8');" + s[m.end():]
              s += additions
          p.write_text(s)
          PY
      - name: Focused regression tests
        run: node --import tsx --test server/operationalMaintenanceWorkers.test.ts server/restoreOfficialEnrichmentFlow.test.ts server/officialEnrichmentQuotaAccounting.test.ts server/provider2Removal.contract.test.ts server/retryPendingUi.contract.test.ts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Verify retired provider remnants absent from active runtime/dashboard
        run: |
          ! grep -RniE 'youtubeInnerTubeProvider|youtubei\.js|youtube_js_hybrid_enrichment|youtube_inner_tube|YOUTUBE_INNERTUBE|YOUTUBE_JS_HYBRID|hybrid-enrichment-channel-details|YouTube\.js' server src package.json package-lock.json --exclude='088_restore_official_enrichment_flow.sql' --exclude='089_restore_autonomous_data_api_routing.sql' --exclude='091_recover_provider2_false_negatives.sql' --exclude='provider2Removal.contract.test.ts' --exclude='operationalMaintenanceWorkers.ts' --exclude='operationalMaintenanceWorkers.test.ts'
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/queueManager.ts server/operationalMaintenanceWorkers.ts server/operationalMaintenanceWorkers.test.ts server/provider2Removal.contract.test.ts src/components/QueueMonitor.tsx
          git commit -m 'Close PR229 quota and monitoring gaps'
          git push origin HEAD:fix/remove-provider2-runtime
