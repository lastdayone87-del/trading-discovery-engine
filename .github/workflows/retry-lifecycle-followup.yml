name: Apply normalized provider retry follow-up

on:
  push:
    branches:
      - fix/retry-lifecycle-hardening
    paths:
      - '.github/workflows/retry-lifecycle-followup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retry-lifecycle-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply normalized provider retry fix
        run: python3 scripts/apply_retry_provider_followup.py
      - name: Retry lifecycle regression tests
        run: node --import tsx --test server/retryLifecyclePolicy.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit follow-up and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/db.ts server/retryLifecyclePolicy.test.ts
          git commit -m 'Recognize normalized retryable provider failures'
          git rm .github/workflows/retry-lifecycle-followup.yml scripts/apply_retry_provider_followup.py
          git commit -m 'Remove one-time normalized retry follow-up'
          git push origin HEAD:fix/retry-lifecycle-hardening
