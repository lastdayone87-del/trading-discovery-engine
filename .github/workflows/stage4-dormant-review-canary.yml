name: Stage 4 dormant review canary

on:
  pull_request:
    paths:
      - 'server/release5/stage4ReviewCanaryContract.test.ts'
      - 'server/release5/reviewMaterializer.ts'
      - 'server/reviewEligibility/**'
      - 'server/enrichmentLifecycle.ts'
      - 'server/db/migrations/094_authoritative_review_projection.sql'
      - '.github/workflows/stage4-dormant-review-canary.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Review serving contracts
        run: node --import tsx --test server/reviewEligibility/policy.test.ts server/enrichmentLifecycle.test.ts server/reviewEligibility/servingIntegration.test.ts server/release5/stage4ReviewCanaryContract.test.ts
      - name: Build
        run: npm run build
      - name: Verify authoritative review boundary
        run: |
          set -euo pipefail
          grep -q "servingAuthority:true" server/reviewEligibility/policy.ts
          grep -q "r.state = 'PENDING'" server/db/migrations/094_authoritative_review_projection.sql
          grep -q "serving_authority!==true" server/release5/reviewMaterializer.ts
          ! git diff origin/main...HEAD -- server/youtube.ts server/youtubeProviderScheduler.ts | grep -E '^\+|^-'
