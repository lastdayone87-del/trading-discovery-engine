name: Stage 4 dormant review canary

on:
  pull_request:
    paths:
      - 'server/release5/stage4ReviewCanaryContract.test.ts'
      - 'server/release5/reviewMaterializer.ts'
      - 'server/reviewEligibility/**'
      - 'server/enrichmentLifecycle.ts'
      - 'server/ingestionPipeline.ts'
      - 'server/queueManager.ts'
      - 'server/investigationWorkflow.ts'
      - 'server/db/migrations/094_authoritative_review_projection.sql'
      - '.github/workflows/stage4-dormant-review-canary.yml'
      - '.github/workflows/phase1-source-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-state-semantics-phase1
          fetch-depth: 0
      - name: Apply pending Phase 1 source patch
        run: |
          if [ ! -f .github/workflows/phase1-source-autofix.yml ]; then
            echo "No autofix marker present."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: target count {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          p=Path('server/ingestionPipeline.ts'); s=p.read_text()
          old="import { recordReviewEligibilityShadow } from './reviewEligibility/store';\n"
          if "import { evaluateReviewEligibilityV2 } from './reviewEligibility/policy';" not in s:
              if s.count(old)!=1: raise SystemExit('ingestion import mismatch')
              s=s.replace(old,old+"import { evaluateReviewEligibilityV2 } from './reviewEligibility/policy';\n",1)
          old_block="""    const appliedAction=evidencePlan?.appliedAction||legacyAction,shouldReview=appliedAction==='HUMAN_REVIEW';
    const lifecycle = resolveUncertainLifecycle(shouldReview);
    const finalUncertainStatus = lifecycle.tradingStatus;
    const finalScanStatus = lifecycle.scanStatus;
    const corroboration=productionClassification.decision.stagedClassification?.stages.find(stage=>stage.stage==='CORROBORATION');
    void recordReviewEligibilityShadow({channelId:candidate.channelId,classificationDiagnosticId,classificationStatus:'UNCERTAIN',investigationState:shouldReview?'UNRESOLVED':'ACTIVE',plausibleTradingHypothesis:independentHypothesis,evidenceSufficient:productionClassification.decision.evidenceCollection.sufficiency==='SUFFICIENT',independentEvidence:corroboration?.disposition==='PASS',countryAllowed:true,operationalFailure:false,providerDegraded:productionClassification.decision.evidenceCollection.degraded,unsupportedLanguage:productionClassification.decision.evidenceCollection.providers.some(provider=>provider.outcome==='ABSTAINED_UNSUPPORTED_LANGUAGE'),terminalDecision:false}).catch(error=>console.warn(`[ReviewEligibility] shadow write failed for ${candidate.channelId}:`,error instanceof Error?error.message:error));
"""
          new_block="""    const appliedAction=evidencePlan?.appliedAction||legacyAction,shouldReview=appliedAction==='HUMAN_REVIEW';
    const corroboration=productionClassification.decision.stagedClassification?.stages.find(stage=>stage.stage==='CORROBORATION');
    const reviewEligibilityInput={classificationStatus:'UNCERTAIN',investigationState:shouldReview?'UNRESOLVED':'ACTIVE',plausibleTradingHypothesis:independentHypothesis,evidenceSufficient:productionClassification.decision.evidenceCollection.sufficiency==='SUFFICIENT',independentEvidence:corroboration?.disposition==='PASS',countryAllowed:true,operationalFailure:false,providerDegraded:productionClassification.decision.evidenceCollection.degraded,unsupportedLanguage:productionClassification.decision.evidenceCollection.providers.some(provider=>provider.outcome==='ABSTAINED_UNSUPPORTED_LANGUAGE'),terminalDecision:false};
    const reviewEligibility=evaluateReviewEligibilityV2(reviewEligibilityInput);
    const lifecycle = resolveUncertainLifecycle(shouldReview,reviewEligibility);
    const finalUncertainStatus = lifecycle.tradingStatus==='NEEDS_REVIEW'?'UNCERTAIN':lifecycle.tradingStatus;
    const finalScanStatus = lifecycle.scanStatus==='NEEDS_REVIEW'?'COMPLETED':lifecycle.scanStatus;
"""
          if old_block not in s: raise SystemExit('ingestion lifecycle mismatch')
          s=s.replace(old_block,new_block,1)
          old_after="""    await upsertChannel(uncertainChannel);

    if (lifecycle.shouldEnqueue) {
"""
          new_after="""    await upsertChannel(uncertainChannel);
    await recordReviewEligibilityShadow({channelId:candidate.channelId,classificationDiagnosticId,...reviewEligibilityInput})
      .catch(error=>console.warn(`[ReviewEligibility] authoritative write failed for ${candidate.channelId}:`,error instanceof Error?error.message:error));
    const authoritativeChannel=(await getChannelById(candidate.channelId))||uncertainChannel;

    if (lifecycle.shouldEnqueue) {
"""
          if old_after not in s: raise SystemExit('ingestion persistence mismatch')
          s=s.replace(old_after,new_after,1)
          old_return="""      tradingStatus: finalUncertainStatus,
      discordStatus: 'UNCERTAIN',
      discordInvite: null,
      channelRecord: uncertainChannel
"""
          new_return="""      tradingStatus: authoritativeChannel.trading_status || finalUncertainStatus,
      discordStatus: 'UNCERTAIN',
      discordInvite: null,
      channelRecord: authoritativeChannel
"""
          if old_return not in s: raise SystemExit('ingestion return mismatch')
          p.write_text(s.replace(old_return,new_return,1))

          replace_once('server/queueManager.ts',"        channel.scan_status = 'NEEDS_REVIEW';\n        channel.trading_status = 'NEEDS_REVIEW';","        channel.scan_status = 'FAILED';\n        channel.trading_status = 'UNCERTAIN';")
          replace_once('server/investigationWorkflow.ts',"if(event.type==='FAIL'&&event.terminal)return {...projection,state:'NEEDS_REVIEW',version:projection.version+1,hasPendingSuccessor:false};","if(event.type==='FAIL'&&event.terminal)return {...projection,state:'OPERATIONALLY_BLOCKED',version:projection.version+1,hasPendingSuccessor:false};")
          replace_once('server/investigationWorkflow.ts',"if(input.terminal)await client.query(`UPDATE investigations SET state='NEEDS_REVIEW',version=version+1,completed_at=now(),updated_at=now() WHERE id=$1 AND state='ACTIVE'`,[input.investigationId]);","if(input.terminal)await client.query(`UPDATE investigations SET state='OPERATIONALLY_BLOCKED',version=version+1,completed_at=now(),updated_at=now() WHERE id=$1 AND state='ACTIVE'`,[input.investigationId]);")
          replace_once('server/investigationWorkflow.ts',"event.resultingStatus==='NEEDS_REVIEW'?'NEEDS_REVIEW':projection.hasPendingSuccessor?'ACTIVE':'NEEDS_REVIEW'","event.resultingStatus==='NEEDS_REVIEW'?'NEEDS_REVIEW':projection.hasPendingSuccessor?'ACTIVE':'UNRESOLVED'")
          replace_once('server/investigationWorkflow.ts',"input.resultingStatus==='NEEDS_REVIEW'?'NEEDS_REVIEW':successor.rowCount?'ACTIVE':'NEEDS_REVIEW'","input.resultingStatus==='NEEDS_REVIEW'?'NEEDS_REVIEW':successor.rowCount?'ACTIVE':'UNRESOLVED'")
          PY
          git config user.name "phase1-autofix"
          git config user.email "phase1-autofix@users.noreply.github.com"
          git rm .github/workflows/phase1-source-autofix.yml
          git add server/ingestionPipeline.ts server/queueManager.ts server/investigationWorkflow.ts
          git commit -m "fix: apply final Phase 1 source patches"
          git push origin HEAD:fix/review-state-semantics-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Review serving contracts
        run: node --import tsx --test server/reviewEligibility/policy.test.ts server/enrichmentLifecycle.test.ts server/reviewEligibility/servingIntegration.test.ts server/release5/stage4ReviewCanaryContract.test.ts
      - name: Build
        run: npm run build
      - name: Verify authoritative review boundary
        run: |
          set -euo pipefail
          grep -q "servingAuthority:true" server/reviewEligibility/policy.ts
          grep -q "review-eligibility-v2-serving-1" server/db/migrations/094_authoritative_review_projection.sql
          grep -q "serving_authority!==true" server/release5/reviewMaterializer.ts
          grep -q "evaluateReviewEligibilityV2(reviewEligibilityInput)" server/ingestionPipeline.ts
          grep -q "channel.scan_status = 'FAILED'" server/queueManager.ts
          grep -q "state='OPERATIONALLY_BLOCKED'" server/investigationWorkflow.ts
          ! git diff origin/main...HEAD -- server/youtube.ts server/youtubeProviderScheduler.ts | grep -E '^\+|^-'
