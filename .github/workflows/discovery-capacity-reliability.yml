name: Discovery capacity reliability

on:
  pull_request:
    paths:
      - 'server/dbCore.ts'
      - 'server/queueManager.ts'
      - 'server/classificationDecoupling.ts'
      - 'server/classificationDecoupling.test.ts'
      - 'server/enrichmentScaleGate.ts'
      - 'server/enrichmentScaleGate.test.ts'
      - 'server/enrichmentWorkerLanes.test.ts'
      - 'server/enrichmentBacklogDiagnostics.ts'
      - 'server/enrichmentBacklogDiagnostics.test.ts'
      - 'server/runtimeCapacityConfig.test.ts'
      - 'server/operationalMaintenanceScheduler.ts'
      - 'server/operationalMaintenanceScheduler.test.ts'
      - 'server/staleChannelLockRecovery.test.ts'
      - 'server/providerEventIndexes.test.ts'
      - 'server/providerCapacityCircuit.test.ts'
      - 'server/providerCapacityState.ts'
      - 'server/providerResilience.ts'
      - 'server/db/migrations/210_provider_capacity_state.sql'
      - 'server/db/migrations/209_provider_event_indexes.sql'
      - 'server/queueManagerDiscoveryOverflow.test.ts'
      - 'server/channelAdmission/evidence.ts'
      - 'server/channelAdmission/pipelineIntegration.test.ts'
      - '.github/workflows/discovery-capacity-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capacity, lane, heartbeat and evidence bounds
        run: >-
          node --import tsx --test
          server/classificationDecoupling.test.ts
          server/enrichmentScaleGate.test.ts
          server/enrichmentWorkerLanes.test.ts
          server/enrichmentBacklogDiagnostics.test.ts
          server/runtimeCapacityConfig.test.ts
          server/operationalMaintenanceScheduler.test.ts
          server/staleChannelLockRecovery.test.ts
          server/providerEventIndexes.test.ts
          server/providerCapacityCircuit.test.ts
          server/queueManagerDiscoveryOverflow.test.ts
          server/channelAdmission/pipelineIntegration.test.ts
      - name: TypeScript validation
        run: npm run lint
