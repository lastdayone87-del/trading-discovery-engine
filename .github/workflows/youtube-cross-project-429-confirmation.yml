name: YouTube cross-project 429 confirmation
on:
  pull_request:
    paths:
      - 'server/youtubeProviderCooldown.ts'
      - 'server/youtubeProviderCooldown.test.ts'
      - 'server/youtubeRuntimePressureBoundary.test.ts'
      - 'server/youtube.ts'
      - '.github/workflows/youtube-cross-project-429-confirmation.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node --import tsx --test server/youtubeProviderCooldown.test.ts server/youtubeRuntimePressureBoundary.test.ts
      - run: npm run lint
      - run: npm run build
