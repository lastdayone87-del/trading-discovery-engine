name: Fix Provider2 review regression contract

on:
  push:
    branches:
      - fix/remove-provider2-runtime
    paths:
      - .github/workflows/provider2-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-provider2-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update renamed official enrichment contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('server/officialEnrichmentQuotaAccounting.test.ts')
          text=path.read_text()
          text=text.replace("youtube.indexOf('async function fetchYouTubeChannelEnrichmentOfficial')","youtube.indexOf('export async function fetchYouTubeChannelEnrichment(')")
          text=text.replace("youtube.indexOf('Quota-free hybrid evidence acquisition', start)","youtube.indexOf('/** One-unit metadata hydration used only when country evidence remains uncertain. */', start)")
          marker="  const official = youtube.slice(start, end);"
          text=text.replace(marker,"  assert.ok(start >= 0 && end > start, 'official enrichment function boundary must remain discoverable');\n"+marker)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Focused contracts
        run: node --import tsx --test server/provider2Removal.contract.test.ts server/restoreOfficialEnrichmentFlow.test.ts server/retryPendingUi.contract.test.ts server/officialEnrichmentQuotaAccounting.test.ts
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit review fix
        shell: bash
        run: |
          rm -f .github/workflows/provider2-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update official enrichment quota contract'
          git push origin HEAD:fix/remove-provider2-runtime
