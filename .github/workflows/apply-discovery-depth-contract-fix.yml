name: Apply discovery depth contract fix
on:
  push:
    branches:
      - fix/discord-multi-candidate-ownership
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discord-multi-candidate-ownership
          fetch-depth: 0
      - name: Update Discord candidate selection source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/discoveryDepthRegression.test.ts')
          s=p.read_text()
          old="""test('Discord candidate selection contract does not stop on the first merely operational success', () => {\n  const source = readFileSync(new URL('./queueManager.ts', import.meta.url), 'utf8');\n  assert.match(source, /const validationRank=/);\n  assert.match(source, /TRADING_RELEVANT[^\\n]*ACTIVE[^\\n]*ACTIVE_LOW_VOLUME[^\\n]*return 100/);\n  assert.match(source, /if\\(rank>=100\\)break;/);\n  assert.doesNotMatch(source, /if\\(validation\\.operationalOutcome==='SUCCEEDED'\\)\\{selected=validation;selectedCandidate=candidate;break;\\}/);\n});"""
          new="""test('Discord candidate selection validates the retained set and ranks creator ownership before health', () => {\n  const source = readFileSync(new URL('./queueManager.ts', import.meta.url), 'utf8');\n  assert.match(source, /discordCandidateCompositeRank\\(candidate,validation\\)/);\n  assert.doesNotMatch(source, /if\\(rank>=100\\)break;/);\n  assert.doesNotMatch(source, /if\\(validation\\.operationalOutcome==='SUCCEEDED'\\)\\{selected=validation;selectedCandidate=candidate;break;\\}/);\n});"""
          if old not in s: raise SystemExit('old Discord selection contract test missing')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/apply-discovery-depth-contract-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/discoveryDepthRegression.test.ts .github/workflows/apply-discovery-depth-contract-fix.yml
          git diff --cached --check
          git commit -m "Update Discord selection regression for ownership ranking"
          git push origin HEAD:fix/discord-multi-candidate-ownership
