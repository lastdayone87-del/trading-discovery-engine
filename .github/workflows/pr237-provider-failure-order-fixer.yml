name: PR237 provider failure ordering fix
on:
  push:
    branches: [fix/restore-per-provider-429-failover]
    paths: [.github/workflows/pr237-provider-failure-order-fixer.yml]
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-per-provider-429-failover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python .github/scripts/pr237_provider_failure_order_fix.py
      - run: npx tsx --test server/youtubeRequestScheduler.test.ts server/youtubeProviderCooldown.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/youtube.ts server/youtubeRequestScheduler.test.ts
          git commit -m "Record YouTube provider failures before scheduler release"
          git push origin HEAD:fix/restore-per-provider-429-failover
