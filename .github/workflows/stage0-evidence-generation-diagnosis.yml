name: Stage 0 evidence generation diagnosis (temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run read-only evidence generation diagnosis
        run: npx tsx scripts/diagnoseStage0EvidenceGeneration.ts
      - name: Upload diagnosis report
        uses: actions/upload-artifact@v4
        with:
          name: stage0-evidence-generation-diagnosis-${{ github.run_id }}
          path: stage0-output/stage0-evidence-generation-diagnosis.json
          if-no-files-found: error
