name: PR237 avoid repeated fallback provider
on:
  push:
    branches: [fix/restore-per-provider-429-failover]
    paths: [.github/workflows/pr237-avoid-repeat-fallback.yml]
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-per-provider-429-failover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fallback rotation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('server/youtube.ts')
          s=path.read_text()
          anchor="let outboundTraceSequence = 0;\n"
          insert="let outboundTraceSequence = 0;\nconst failedDispatchProvidersByAcquisition = new WeakMap<object, Set<string>>();\n\nfunction failedDispatchProviders(acquisition?: YouTubePoolAcquisition): Set<string> | undefined {\n  if (!acquisition || (typeof acquisition !== 'object' && typeof acquisition !== 'function')) return undefined;\n  const key = acquisition as unknown as object;\n  let failed = failedDispatchProvidersByAcquisition.get(key);\n  if (!failed) { failed = new Set<string>(); failedDispatchProvidersByAcquisition.set(key, failed); }\n  return failed;\n}\n"
          if 'failedDispatchProvidersByAcquisition' not in s:
              if anchor not in s: raise SystemExit('outbound trace anchor missing')
              s=s.replace(anchor,insert,1)

          old="""        const dispatchIndex=selectYouTubeDispatchProviderIndex(livePool,providerKey);\n        if(dispatchIndex<0){\n          throwIfAllProvidersCoolingDown(livePool);\n          throw new Error('No eligible YouTube provider is available at request dispatch.');\n        }\n        dispatchedProviderKey=livePool[dispatchIndex];\n"""
          new="""        const failedProviders=failedDispatchProviders(acquisition);\n        let dispatchIndex=selectYouTubeDispatchProviderIndex(livePool,providerKey,key=>youtubeProviderCooldown.eligible(key)&&!failedProviders?.has(key));\n        if(dispatchIndex<0) dispatchIndex=selectYouTubeDispatchProviderIndex(livePool,providerKey);\n        if(dispatchIndex<0){\n          throwIfAllProvidersCoolingDown(livePool);\n          throw new Error('No eligible YouTube provider is available at request dispatch.');\n        }\n        dispatchedProviderKey=livePool[dispatchIndex];\n"""
          if old not in s: raise SystemExit('dispatch selection block missing')
          s=s.replace(old,new,1)

          old2="""          if(dispatchedProviderKey){\n            if(isQuotaExceeded(error))youtubeProviderCooldown.failed(dispatchedProviderKey,'DAILY_QUOTA_EXHAUSTED');\n            else if(isYouTubeRateLimited(error))youtubeProviderCooldown.failed(dispatchedProviderKey,'RATE_LIMITED');\n            if(error&&typeof error==='object')Object.assign(error,{providerKey:dispatchedProviderKey,providerFailureRecorded:true});\n          }\n"""
          new2="""          if(dispatchedProviderKey){\n            failedDispatchProviders(acquisition)?.add(dispatchedProviderKey);\n            if(isQuotaExceeded(error))youtubeProviderCooldown.failed(dispatchedProviderKey,'DAILY_QUOTA_EXHAUSTED');\n            else if(isYouTubeRateLimited(error))youtubeProviderCooldown.failed(dispatchedProviderKey,'RATE_LIMITED');\n            if(error&&typeof error==='object')Object.assign(error,{providerKey:dispatchedProviderKey,providerFailureRecorded:true});\n          }\n"""
          if old2 not in s: raise SystemExit('provider failure block missing')
          s=s.replace(old2,new2,1)
          path.write_text(s)

          t=Path('server/youtubeRequestScheduler.test.ts')
          tests=t.read_text()
          anchor="test('provider-loop requests carry the selected API key into scheduler dispatch', () => {\n"
          addition="""test('dispatch-time fallback failure is excluded when another healthy provider becomes available', () => {\n  const source = fs.readFileSync(new URL('./youtube.ts', import.meta.url), 'utf8');\n  const youtubeFetch = source.slice(source.indexOf('async function youtubeFetch'), source.indexOf('export type YouTubeAdditionalQuotaCallback'));\n  assert.match(source, /failedDispatchProvidersByAcquisition = new WeakMap<object, Set<string>>/);\n  assert.match(youtubeFetch, /!failedProviders\\?\\.has\\(key\\)/);\n  assert.match(youtubeFetch, /if\\(dispatchIndex<0\\) dispatchIndex=selectYouTubeDispatchProviderIndex\\(livePool,providerKey\\)/);\n  assert.match(youtubeFetch, /failedDispatchProviders\\(acquisition\\)\\?\\.add\\(dispatchedProviderKey\\)/);\n});\n\n"""
          if addition not in tests:
              if anchor not in tests: raise SystemExit('test anchor missing')
              tests=tests.replace(anchor,addition+anchor,1)
              t.write_text(tests)
          PY
      - run: npx tsx --test server/youtubeRequestScheduler.test.ts server/youtubeProviderCooldown.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/youtube.ts server/youtubeRequestScheduler.test.ts
          git commit -m "Avoid retrying failed dispatch fallback provider"
          git push origin HEAD:fix/restore-per-provider-429-failover
