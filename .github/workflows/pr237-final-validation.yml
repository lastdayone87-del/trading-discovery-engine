name: PR237 final validation

on:
  push:
    branches:
      - fix/restore-per-provider-429-failover

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-per-provider-429-failover
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Focused restoration contracts
        run: node --import tsx --test server/pre203ThroughputRestoration.contract.test.ts server/youtubeProviderCooldown.test.ts server/youtubeRequestScheduler.test.ts server/youtubeLiveProviderDispatch.test.ts server/youtubePoolBackoff.test.ts
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Full test suite
        run: npm test
