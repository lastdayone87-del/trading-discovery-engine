name: Apply low-audience zero and serving hardening

on:
  push:
    branches:
      - fix/low-audience-zero-serving

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/low-audience-zero-serving
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Patch low-audience behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          gate = Path('server/lowAudienceGate.ts')
          text = gate.read_text()
          text = text.replace(
              ' * 1-29 subscribers: stored, visible/auditable, marked low-audience skip, deep crawl/enrichment skipped.\n * 30+ subscribers or hidden/unavailable: proceeds normally.',
              ' * 0-29 known subscribers: stored and marked low-audience skip; deep crawl/enrichment is skipped.\n * 30+ subscribers or hidden/unavailable: proceeds normally.'
          )
          old = "  if (count >= 1 && count < threshold) {\n    return { shouldSkipDeepEnrichment: true, subscriberCountNumber: count, reasonCode: 'LOW_AUDIENCE_SKIP' };\n  }"
          new = "  if (count < threshold) {\n    return { shouldSkipDeepEnrichment: true, subscriberCountNumber: count, reasonCode: 'LOW_AUDIENCE_SKIP' };\n  }"
          if old not in text:
              raise SystemExit('lowAudienceGate boundary not found')
          gate.write_text(text.replace(old, new, 1))

          test = Path('server/lowAudienceGate.test.ts')
          text = test.read_text()
          old_title = "test('evaluateLowAudienceGate skips deep crawl for 1-29 subscribers and proceeds for 30+ or hidden', () => {"
          new_title = "test('evaluateLowAudienceGate skips deep crawl for known 0-29 subscribers and proceeds for 30+ or hidden', () => {"
          if old_title not in text:
              raise SystemExit('lowAudienceGate test title not found')
          text = text.replace(old_title, new_title, 1)
          needle = "  assert.equal(evaluateLowAudienceGate('2').shouldSkipDeepEnrichment, true);"
          if needle not in text:
              raise SystemExit('lowAudienceGate assertion anchor not found')
          text = text.replace(needle, "  assert.equal(evaluateLowAudienceGate('0').shouldSkipDeepEnrichment, true);\n" + needle, 1)
          old_gate_probe = "  const lowAudienceGateIndex = source.indexOf('evaluateLowAudienceGate(candidate.subscriberCount)');"
          new_gate_probe = "  const lowAudienceGateIndex = source.indexOf('const lowAudienceGate = evaluateLowAudienceGate(candidate.subscriberCount);');"
          if old_gate_probe not in text:
              raise SystemExit('lowAudienceGate ordering probe not found')
          text = text.replace(old_gate_probe, new_gate_probe, 1)
          test.write_text(text)

          db = Path('server/db.ts')
          text = db.read_text()
          old = "if(!args.includeRejected&&!args.diagnosticsOnly&&!explicitlyViewingLowAudience)clauses.push(`scan_status <> 'SKIPPED_LOW_AUDIENCE'`);"
          new = "if(!args.includeRejected&&!args.diagnosticsOnly&&!explicitlyViewingLowAudience)clauses.push(`scan_status <> 'SKIPPED_LOW_AUDIENCE' AND NOT (subscriber_count ~ '^\\\\d+$' AND subscriber_count::integer < 30)`);"
          if old not in text:
              raise SystemExit('dashboard low-audience serving clause not found')
          db.write_text(text.replace(old, new, 1))

          vis = Path('server/lowAudienceDashboardVisibility.test.ts')
          text = vis.read_text()
          old_assert = "  assert.match(db,/!explicitlyViewingLowAudience\\)clauses\\.push\\(`scan_status <> 'SKIPPED_LOW_AUDIENCE'`\\)/);"
          if old_assert not in text:
              raise SystemExit('dashboard visibility assertion not found')
          new_assert = "  assert.match(db,/scan_status <> 'SKIPPED_LOW_AUDIENCE'/);\n  assert.match(db,/subscriber_count::integer < 30/);"
          text = text.replace(old_assert, new_assert, 1)
          vis.write_text(text)

          migration = Path('server/db/migrations/097_reconcile_low_audience_zero_and_stale_rows.sql')
          migration.write_text("""-- Reconcile known numeric subscriber counts below the authoritative 30-subscriber gate.\n-- Preserve stronger country/trading terminal states; these rows remain stored for auditability.\nUPDATE channels\nSET scan_status = 'SKIPPED_LOW_AUDIENCE',\n    updated_at = now()\nWHERE subscriber_count ~ '^\\d+$'\n  AND subscriber_count::integer < 30\n  AND country_status <> 'REJECTED'\n  AND trading_status NOT IN ('NON_TRADING', 'HUMAN_REJECTED')\n  AND scan_status NOT IN ('SKIPPED_EXCLUDED', 'SKIPPED_NON_TRADING', 'SKIPPED_LOW_AUDIENCE');\n""")

          Path('.github/workflows/apply-low-audience-zero-serving.yml').unlink()
          PY
      - name: Run focused tests
        run: node --import tsx --test server/lowAudienceGate.test.ts server/lowAudienceDashboardVisibility.test.ts
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Treat zero and stale sub-30 channels as low audience'
          git push origin HEAD:fix/low-audience-zero-serving
