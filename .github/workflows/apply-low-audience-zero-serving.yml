name: Apply low-audience zero and serving hardening

on:
  push:
    branches:
      - fix/low-audience-zero-serving

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/low-audience-zero-serving
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Patch low-audience behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          gate = Path('server/lowAudienceGate.ts')
          text = gate.read_text()
          text = text.replace(
              ' * 1-29 subscribers: stored, visible/auditable, marked low-audience skip, deep crawl/enrichment skipped.\n * 30+ subscribers or hidden/unavailable: proceeds normally.',
              ' * 0-29 known subscribers: stored, visible/auditable only through the explicit low-audience filter, marked low-audience skip, deep crawl/enrichment skipped.\n * 30+ subscribers or hidden/unavailable: proceeds normally.'
          )
          old = "  if (count >= 1 && count < threshold) {\n    return { shouldSkipDeepEnrichment: true, subscriberCountNumber: count, reasonCode: 'LOW_AUDIENCE_SKIP' };\n  }"
          new = "  if (count < threshold) {\n    return { shouldSkipDeepEnrichment: true, subscriberCountNumber: count, reasonCode: 'LOW_AUDIENCE_SKIP' };\n  }"
          if old not in text:
              raise SystemExit('lowAudienceGate boundary not found')
          gate.write_text(text.replace(old, new))

          test = Path('server/lowAudienceGate.test.ts')
          text = test.read_text()
          anchor = "test('29 subscribers is skipped',()=>{\n"
          if anchor not in text:
              raise SystemExit('lowAudienceGate test anchor not found')
          insertion = "test('zero subscribers is a known low-audience value and is skipped',()=>{\n  const result=evaluateLowAudienceGate('0');\n  assert.equal(result.shouldSkipDeepEnrichment,true);\n  assert.equal(result.subscriberCountNumber,0);\n  assert.equal(result.reasonCode,'LOW_AUDIENCE_SKIP');\n});\n\n"
          text = text.replace(anchor, insertion + anchor, 1)
          test.write_text(text)

          db = Path('server/db.ts')
          text = db.read_text()
          old = "if(!args.includeRejected&&!args.diagnosticsOnly&&!explicitlyViewingLowAudience)clauses.push(`scan_status <> 'SKIPPED_LOW_AUDIENCE'`);"
          new = "if(!args.includeRejected&&!args.diagnosticsOnly&&!explicitlyViewingLowAudience)clauses.push(`scan_status <> 'SKIPPED_LOW_AUDIENCE' AND NOT (subscriber_count ~ '^\\\\d+$' AND subscriber_count::integer < 30)`);"
          if old not in text:
              raise SystemExit('dashboard low-audience serving clause not found')
          db.write_text(text.replace(old, new, 1))

          vis = Path('server/lowAudienceDashboardVisibility.test.ts')
          text = vis.read_text()
          old = "  assert.match(db,/!explicitlyViewingLowAudience\\)clauses\\.push\\(`scan_status <> 'SKIPPED_LOW_AUDIENCE'`\\)/);"
          new = "  assert.match(db,/scan_status <> 'SKIPPED_LOW_AUDIENCE' AND NOT \\(subscriber_count ~ '\\\\^\\\\\\\\d\\\\+\\\\$' AND subscriber_count::integer < 30\\)/);"
          if old not in text:
              raise SystemExit('dashboard visibility assertion not found')
          text = text.replace(old, new, 1)
          extra = "\ntest('default channel listing defensively hides stale known counts below 30 even before status repair',()=>{\n  const db=fs.readFileSync(new URL('./db.ts',import.meta.url),'utf8');\n  assert.match(db,/subscriber_count::integer < 30/);\n  assert.match(db,/subscriber_count ~ '\\\\^\\\\\\\\d\\\\+\\\\$'/);\n});\n"
          vis.write_text(text + extra)

          migration = Path('server/db/migrations/097_reconcile_low_audience_zero_and_stale_rows.sql')
          migration.write_text("""-- Repair rows that were allowed through when subscriber_count was the known value 0\n-- (or another stale known value below the 30-subscriber gate). Preserve stronger\n-- terminal policy states; only reconcile rows that should be low-audience skips.\nUPDATE channels\nSET scan_status = 'SKIPPED_LOW_AUDIENCE',\n    updated_at = now()\nWHERE subscriber_count ~ '^\\d+$'\n  AND subscriber_count::integer < 30\n  AND country_status <> 'REJECTED'\n  AND trading_status NOT IN ('NON_TRADING', 'HUMAN_REJECTED')\n  AND scan_status NOT IN ('SKIPPED_EXCLUDED', 'SKIPPED_NON_TRADING', 'SKIPPED_LOW_AUDIENCE');\n\n-- Retire queued enrichment work for rows repaired above so stale jobs do not keep\n-- spending provider quota after the low-audience decision is authoritative.\nUPDATE jobs j\nSET status = 'COMPLETED',\n    completed_at = COALESCE(j.completed_at, now()),\n    last_error = COALESCE(j.last_error, 'SKIPPED_LOW_AUDIENCE_RECONCILIATION')\nFROM channels c\nWHERE j.payload->>'channelId' = c.channel_id\n  AND c.scan_status = 'SKIPPED_LOW_AUDIENCE'\n  AND j.status IN ('PENDING', 'RETRY')\n  AND j.type IN ('ENRICH_CHANNEL', 'POST_APPROVAL_ENRICH');\n""")

          workflow = Path('.github/workflows/apply-low-audience-zero-serving.yml')
          workflow.unlink()
          PY
      - name: Run focused tests
        run: node --import tsx --test server/lowAudienceGate.test.ts server/lowAudienceDashboardVisibility.test.ts
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Treat zero and stale sub-30 channels as low audience'
          git push origin HEAD:fix/low-audience-zero-serving
