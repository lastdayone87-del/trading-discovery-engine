name: Apply PR235 review fixes

on:
  push:
    branches:
      - fix/enrichment-backlog-gemini-degradation
    paths:
      - .github/workflows/apply-pr235-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrichment-backlog-gemini-degradation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply both P2 fixes
        shell: python
        run: |
          from pathlib import Path

          # 1) Require a staged decision that is provably independent of failed providers.
          p = Path('server/enrichmentOperationalFailure.ts')
          s = p.read_text()
          s = s.replace(
              "import type { EvidenceCollectionReport } from './evidenceEngine';",
              "import type { EvidenceCollectionReport, VerificationDecision } from './evidenceEngine';",
              1,
          )
          old = """export function enrichmentOperationalFailure(\n  report: EvidenceCollectionReport,\n  isEnrichmentPass: boolean\n): ProviderCallError | null {\n  if (!isEnrichmentPass || !report.degraded || report.sufficiency === 'SUFFICIENT') return null;\n"""
          new = """export function hasDecisionGradeEvidenceWithoutFailedProviders(decision: VerificationDecision): boolean {\n  const failedProviders = new Set(\n    decision.evidenceCollection.providers\n      .filter(provider => provider.availability === 'FAILED')\n      .map(provider => provider.provider)\n  );\n  const staged = decision.stagedClassification;\n  if (!staged) return false;\n  const expectedStages = staged.lifecycleAction === 'CONFIRM'\n    ? [['CANDIDATE_DETECTION', 'PASS'], ['CORROBORATION', 'PASS']] as const\n    : staged.lifecycleAction === 'REJECT'\n      ? [['CONTRADICTION', 'FAIL']] as const\n      : [];\n  if (!expectedStages.length) return false;\n  const evidenceById = new Map(\n    [...decision.positiveEvidence, ...decision.negativeEvidence].map(item => [item.id, item])\n  );\n  return expectedStages.every(([stageName, disposition]) => {\n    const stage = staged.stages.find(item => item.stage === stageName);\n    if (!stage || stage.disposition !== disposition || stage.evidenceIds.length === 0) return false;\n    return stage.evidenceIds.every(id => {\n      const evidence = evidenceById.get(id);\n      return !!evidence && !failedProviders.has(evidence.source);\n    });\n  });\n}\n\nexport function enrichmentOperationalFailure(\n  report: EvidenceCollectionReport,\n  isEnrichmentPass: boolean,\n  decisionReadyWithoutFailedProvider: boolean = false\n): ProviderCallError | null {\n  if (!isEnrichmentPass || !report.degraded || decisionReadyWithoutFailedProvider) return null;\n"""
          if old not in s:
              raise SystemExit('operational failure anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('server/ingestionPipeline.ts')
          s = p.read_text()
          old = "import { enrichmentOperationalFailure } from './enrichmentOperationalFailure';"
          new = "import { enrichmentOperationalFailure, hasDecisionGradeEvidenceWithoutFailedProviders } from './enrichmentOperationalFailure';"
          if old not in s:
              raise SystemExit('ingestion import anchor not found')
          s = s.replace(old, new, 1)
          old = """  const productionClassification = await classifyTradingRelevanceDetailed(classifierInput);\n  const enrichmentProviderFailure=enrichmentOperationalFailure(productionClassification.decision.evidenceCollection,isEnrichmentPass);\n"""
          new = """  const productionClassification = await classifyTradingRelevanceDetailed(classifierInput);\n  const decisionReadyWithoutFailedProvider=hasDecisionGradeEvidenceWithoutFailedProviders(productionClassification.decision);\n  const enrichmentProviderFailure=enrichmentOperationalFailure(\n    productionClassification.decision.evidenceCollection,\n    isEnrichmentPass,\n    decisionReadyWithoutFailedProvider\n  );\n"""
          if old not in s:
              raise SystemExit('ingestion operational guard anchor not found')
          p.write_text(s.replace(old, new, 1))

          # 2) Close/reconcile the paid YouTube reservation at the durable payload boundary.
          p = Path('server/queueManager.ts')
          s = p.read_text()
          old = """      const candidateAlreadyEnriched=Number(candidate.enrichmentStage||0)>=enrichmentStage;\n      const enrichmentQuotaUnits=candidateAlreadyEnriched?0:(enrichmentStage>=2?202:101);\n      let quotaReserved=false;\n"""
          new = """      const candidateAlreadyEnriched=Number(candidate.enrichmentStage||0)>=enrichmentStage;\n      const enrichmentQuotaUnits=candidateAlreadyEnriched?0:(enrichmentStage>=2?202:101);\n      let quotaReserved=false;\n      let acquisitionPersisted=candidateAlreadyEnriched;\n"""
          if old not in s:
              raise SystemExit('quota state anchor not found')
          s = s.replace(old, new, 1)
          old = """        if(!candidateAlreadyEnriched){\n          const db=await getDb();\n          await db.query(`UPDATE jobs SET payload=jsonb_set(payload,'{candidate}',$2::jsonb,true),updated_at=now() WHERE id=$1`,[job.id,JSON.stringify(enriched)]);\n        }\n        const pipelineOutcome=await processChannelThroughPipeline(enriched,targetCountry,source,false,true);\n"""
          new = """        if(!candidateAlreadyEnriched){\n          const db=await getDb();\n          await db.query(`UPDATE jobs SET payload=jsonb_set(payload,'{candidate}',$2::jsonb,true),updated_at=now() WHERE id=$1`,[job.id,JSON.stringify(enriched)]);\n          acquisitionPersisted=true;\n          await finishQuotaReservation('ENRICH_CHANNEL',job.id,true);\n          quotaReserved=false;\n        } else {\n          // Idempotently reconcile a reservation left RESERVED if a prior worker\n          // crashed after persisting the paid enrichment payload.\n          await finishQuotaReservation('ENRICH_CHANNEL',job.id,true);\n        }\n        const pipelineOutcome=await processChannelThroughPipeline(enriched,targetCountry,source,false,true);\n"""
          if old not in s:
              raise SystemExit('durable candidate anchor not found')
          s = s.replace(old, new, 1)
          old = """        if(quotaReserved)await finishQuotaReservation('ENRICH_CHANNEL',job.id,false);\n        throw error;\n"""
          new = """        if(quotaReserved)await finishQuotaReservation('ENRICH_CHANNEL',job.id,acquisitionPersisted);\n        throw error;\n"""
          if old not in s:
              raise SystemExit('quota failure finalization anchor not found')
          p.write_text(s.replace(old, new, 1))

          # Replace focused operational tests with decision-stage regressions.
          Path('server/enrichmentOperationalFailure.test.ts').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { enrichmentOperationalFailure, hasDecisionGradeEvidenceWithoutFailedProviders } from './enrichmentOperationalFailure';
          import { decideJobFailure } from './db';
          import { resolveUncertainLifecycle } from './enrichmentLifecycle';
          import type { EvidenceCollectionReport, VerificationDecision } from './evidenceEngine';

          function report(degraded:boolean, reasonCodes:string[]=[], sufficiency:EvidenceCollectionReport['sufficiency']='SUFFICIENT'):EvidenceCollectionReport {
            return {
              sufficiency, sparseMetadata:false, degraded, fieldsPresent:['video_titles'], reasonCodes:[],
              providers:[{provider:'gemini_semantic',availability:degraded?'FAILED':'AVAILABLE',evidenceCount:0,outcome:degraded?'FAILED_PROVIDER':'EXECUTED_NO_MATCH',reasonCodes}],
              terminalNegativeSufficiency:{status:'INSUFFICIENT',creatorLevelCoverage:false,independentSourceFamilies:0,independentObservations:0,reasonCodes:['TERMINAL_NEGATIVE_EVIDENCE_INSUFFICIENT']}
            };
          }

          function decision(args:{lifecycle:'CONFIRM'|'REJECT'|'ENRICH'|'REVIEW'; source?:'video_metadata'|'gemini_semantic'; degraded?:boolean}):VerificationDecision {
            const source=args.source||'video_metadata';
            const positive={id:'p1',source,polarity:'POSITIVE' as const,category:'METHODOLOGY_CONCEPT' as const,fact:'trading',rawMatches:['trading'],confidence:90,reliability:'HIGH' as const,reliabilityMultiplier:1,rawWeight:10,finalWeight:9,timestamp:new Date(0).toISOString()};
            const negative={...positive,id:'n1',polarity:'NEGATIVE' as const,category:'IRRELEVANT_DOMAIN' as const,finalWeight:-9};
            const stages=args.lifecycle==='CONFIRM'
              ? [{stage:'CANDIDATE_DETECTION' as const,disposition:'PASS' as const,reasonCodes:[],evidenceIds:['p1'],fields:[],metrics:{}},{stage:'CORROBORATION' as const,disposition:'PASS' as const,reasonCodes:[],evidenceIds:['p1'],fields:[],metrics:{}}]
              : args.lifecycle==='REJECT'
                ? [{stage:'CONTRADICTION' as const,disposition:'FAIL' as const,reasonCodes:[],evidenceIds:['n1'],fields:[],metrics:{}}]
                : [{stage:'CANDIDATE_DETECTION' as const,disposition:'ABSTAIN' as const,reasonCodes:[],evidenceIds:[],fields:[],metrics:{}}];
            return {
              status:args.lifecycle==='CONFIRM'?'TRADING_CONFIRMED':args.lifecycle==='REJECT'?'NON_TRADING':'UNCERTAIN',confidenceScore:50,category:'OTHER',multiVideoConsistencyRatio:0,
              positiveEvidence:[positive],negativeEvidence:args.lifecycle==='REJECT'?[negative]:[],totalPositiveWeight:9,totalNegativeWeight:args.lifecycle==='REJECT'?9:0,
              countryContextUsed:{country:'US',language:'en',matchedTerms:[],matchedNegativeTerms:[]},
              versions:{evidenceEngineVersion:'t',decisionEngineVersion:'t',scoringEngineVersion:'t',knowledgePackVersion:'t',geminiModelVersion:'t'},
              mathematicalJustification:'test',evidenceCollection:report(args.degraded??true,['PROVIDER_RATE_LIMIT'],'SUFFICIENT'),
              stagedClassification:{pipelineVersion:'test',stages,lifecycleAction:args.lifecycle},timestamp:new Date(0).toISOString()
            };
          }

          test('coarse SUFFICIENT metadata still retries when Gemini failed and no decision-grade stage is resolved',()=>{
            const d=decision({lifecycle:'ENRICH'});
            const ready=hasDecisionGradeEvidenceWithoutFailedProviders(d);
            assert.equal(ready,false);
            const error=enrichmentOperationalFailure(d.evidenceCollection,true,ready);
            assert.ok(error);
            assert.equal(decideJobFailure(error!,4,4,1_700_000_000_000).disposition,'RETRYING_WITHOUT_ATTEMPT');
          });

          test('independent confirm evidence may proceed despite optional Gemini degradation',()=>{
            const d=decision({lifecycle:'CONFIRM',source:'video_metadata'});
            const ready=hasDecisionGradeEvidenceWithoutFailedProviders(d);
            assert.equal(ready,true);
            assert.equal(enrichmentOperationalFailure(d.evidenceCollection,true,ready),null);
          });

          test('failed-provider evidence never qualifies as independent decision-grade support',()=>{
            const d=decision({lifecycle:'CONFIRM',source:'gemini_semantic'});
            assert.equal(hasDecisionGradeEvidenceWithoutFailedProviders(d),false);
            assert.ok(enrichmentOperationalFailure(d.evidenceCollection,true,false));
          });

          test('insufficient degraded enrichment remains an attempt-free infrastructure retry',()=>{
            const error=enrichmentOperationalFailure(report(true,['PROVIDER_TIMEOUT'],'INSUFFICIENT'),true,false);
            assert.ok(error);
            assert.equal(error!.name,'OperationalEnrichmentProviderError');
            assert.equal(error!.retryable,true);
            assert.equal(error!.errorClass,'TRANSIENT');
          });

          test('all governed operational provider failure classes remain retryable without decision-grade support',()=>{
            for(const reason of ['PROVIDER_TIMEOUT','PROVIDER_RATE_LIMIT','PROVIDER_TRANSIENT_FAILURE','PROVIDER_CREDENTIALS_EXHAUSTED','PROVIDER_CANCELLED','PROVIDER_EXECUTION_FAILED']) {
              const error=enrichmentOperationalFailure(report(true,[reason]),true,false);
              assert.ok(error,reason);
            }
          });

          test('non-enrichment and permanent-input degradation are not rewritten by this guard',()=>{
            assert.equal(enrichmentOperationalFailure(report(true,['PROVIDER_TIMEOUT']),false,false),null);
            assert.equal(enrichmentOperationalFailure(report(true,['PROVIDER_PERMANENT_INPUT']),true,false),null);
          });

          test('fully observed genuine ambiguity can still reach human review when providers are healthy',()=>{
            assert.equal(enrichmentOperationalFailure(report(false),true,false),null);
            assert.deepEqual(resolveUncertainLifecycle(true),{scanStatus:'NEEDS_REVIEW',tradingStatus:'NEEDS_REVIEW',shouldEnqueue:false});
          });
          """)

          Path('server/enrichmentBacklogDrain.contract.test.ts').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          test('Gemini rate pressure cannot monopolize an enrichment worker for the full cooldown by default',()=>{
            const source=fs.readFileSync(new URL('./providerResilience.ts',import.meta.url),'utf8');
            assert.match(source,/GEMINI_SEMANTIC_MAX_INLINE_WAIT_MS', 8000/);
            assert.doesNotMatch(source,/GEMINI_SEMANTIC_MAX_INLINE_WAIT_MS', 90000/);
          });

          test('paid YouTube enrichment is durably cached and its reservation is closed at the same boundary',()=>{
            const source=fs.readFileSync(new URL('./queueManager.ts',import.meta.url),'utf8');
            const payloadWrite=source.indexOf("UPDATE jobs SET payload=jsonb_set(payload,'{candidate}'");
            const persistedFlag=source.indexOf('acquisitionPersisted=true',payloadWrite);
            const consume=source.indexOf("finishQuotaReservation('ENRICH_CHANNEL',job.id,true)",persistedFlag);
            const pipeline=source.indexOf('processChannelThroughPipeline(enriched,targetCountry,source,false,true)',consume);
            assert.ok(payloadWrite>=0&&persistedFlag>payloadWrite&&consume>persistedFlag&&pipeline>consume);
            assert.match(source,/candidateAlreadyEnriched\?candidate:await fetchYouTubeChannelEnrichment/);
            assert.match(source,/else \{[\s\S]*?finishQuotaReservation\('ENRICH_CHANNEL',job\.id,true\);[\s\S]*?\}[\s\S]*?const pipelineOutcome=/);
          });

          test('a crash after payload persistence cannot release already-consumed quota',()=>{
            const source=fs.readFileSync(new URL('./queueManager.ts',import.meta.url),'utf8');
            assert.match(source,/let acquisitionPersisted=candidateAlreadyEnriched/);
            assert.match(source,/if\(quotaReserved\)await finishQuotaReservation\('ENRICH_CHANNEL',job\.id,acquisitionPersisted\)/);
          });
          """)
      - name: Validate
        run: |
          set -euo pipefail
          node --import tsx --test \
            server/enrichmentOperationalFailure.test.ts \
            server/enrichmentBacklogDrain.contract.test.ts \
            server/providerResilience.test.ts \
            server/quotaRecovery.test.ts \
            server/pre203ThroughputRestoration.contract.test.ts
          npm run lint
          npm run build
          git diff --check
      - name: Commit validated fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-pr235-review-fixes.yml
          git add -A
          git commit -m "Fix PR235 decision and quota crash boundaries"
          git push origin HEAD:fix/enrichment-backlog-gemini-degradation
