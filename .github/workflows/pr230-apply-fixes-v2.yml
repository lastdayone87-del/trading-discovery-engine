name: PR230 apply fixes v2

on:
  push:
    branches:
      - fix/post-merge-recheck-safety

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed fixes
        shell: bash
        run: |
          cat > /tmp/apply_pr230.py <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p, s): Path(p).write_text(s)
          def must_sub(pattern, repl, text, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          Path('server/officialRecheckQuota.ts').write_text("""import {
            finishQuotaReservation,
            getAppSetting,
            getDailyYouTubeQuotaBudget,
            getYouTubeKeyPool,
            tryReserveQuota,
          } from './db';

          export const OFFICIAL_RECHECK_UNITS_PER_PROVIDER = 101;

          export async function reserveOfficialRecheck(operationId: string): Promise<boolean> {
            const dailyBudget = getDailyYouTubeQuotaBudget();
            const allocationPercent = Math.max(
              1,
              Math.min(100, Number(await getAppSetting('discovery_enrichment_quota_percent', '10')) || 10),
            );
            const maximumProviderAttempts = Math.max(1, getYouTubeKeyPool().length);
            return tryReserveQuota({
              operationType: 'OPERATIONAL_RECHECK',
              operationId,
              allocation: 'ENRICHMENT',
              units: OFFICIAL_RECHECK_UNITS_PER_PROVIDER * maximumProviderAttempts,
              dailyBudget,
              allocationPercent,
            });
          }

          export async function finishOfficialRecheck(operationId: string, consumed: boolean): Promise<void> {
            await finishQuotaReservation('OPERATIONAL_RECHECK', operationId, consumed);
          }
          """.replace('          ', ''))

          # queueManager: typed recheck failures + quota-gated HTTP wrapper.
          p='server/queueManager.ts'; text=read(p)
          marker="import { triggerPhaseBObservationReconciliation } from './phaseBObservationOutbox';"
          if "from './officialRecheckQuota'" not in text:
              if marker not in text: raise SystemExit('queue import marker missing')
              text=text.replace(marker, marker+"\nimport { ProviderCallError } from './providerResilience';\nimport { YouTubeProvidersCoolingDownError } from './youtubeProviderCooldown';\nimport { finishOfficialRecheck, reserveOfficialRecheck } from './officialRecheckQuota';",1)

          sig="export async function triggerManualRecheck(channelId: string, enableDebug?: boolean): Promise<{ success: boolean; message: string; channel?: ChannelRecord; debugLog?: any; code?: string; retryable?: boolean }> {"
          helper="""type ManualRecheckFailureMetadata = {
            code?: string;
            retryable: boolean;
            errorClass?: string;
            status?: number;
            providerReasons?: string[];
            retryAt?: number;
          };

          const ATTEMPT_FREE_PROVIDER_ERROR_CLASSES = new Set(['TIMEOUT', 'CANCELLED', 'RATE_LIMIT', 'TRANSIENT', 'CREDENTIALS_EXHAUSTED']);

          function manualRecheckFailureMetadata(error: unknown): ManualRecheckFailureMetadata {
            if (error instanceof ProviderCallError) {
              return {
                code: typeof (error as any).code === 'string' ? (error as any).code : undefined,
                retryable: error.retryable && ATTEMPT_FREE_PROVIDER_ERROR_CLASSES.has(error.errorClass),
                errorClass: error.errorClass,
                status: error.status,
                providerReasons: error.providerReasons,
              };
            }
            if (error instanceof YouTubeProvidersCoolingDownError) {
              return { code: error.code, retryable: true, errorClass: 'TRANSIENT', retryAt: error.retryAt };
            }
            const value = error as any;
            const errorClass = typeof value?.errorClass === 'string' ? value.errorClass : undefined;
            return {
              code: typeof value?.code === 'string' ? value.code : undefined,
              retryable: Boolean(errorClass && ATTEMPT_FREE_PROVIDER_ERROR_CLASSES.has(errorClass) && value?.retryable !== false),
              errorClass,
              status: Number.isFinite(Number(value?.status)) ? Number(value.status) : undefined,
              providerReasons: Array.isArray(value?.providerReasons) ? value.providerReasons.map(String) : undefined,
              retryAt: Number.isFinite(Number(value?.retryAt)) ? Number(value.retryAt) : undefined,
            };
          }

          export type ManualRecheckResult = { success: boolean; message: string; channel?: ChannelRecord; debugLog?: any; code?: string; retryable?: boolean; errorClass?: string; status?: number; providerReasons?: string[]; retryAt?: number };

          export async function triggerManualRecheck(channelId: string, enableDebug?: boolean): Promise<ManualRecheckResult> {"""
          if sig not in text: raise SystemExit('manual recheck signature missing')
          text=text.replace(sig,helper,1)

          acq_pattern=r"  \} catch \(error\) \{\n    const detail = error instanceof Error \? error\.message : String\(error\);\n    console\.warn\(`\[Manual Recheck\] Fresh YouTube creator acquisition failed for \$\{channelId\}; preserving prior trading classification: \$\{detail\}`\);\n    return \{\n      success: false,\n      message: `Manual re-scan could not acquire fresh YouTube creator evidence\.[^`]*\$\{detail\}`,\n      code: 'MANUAL_RESCAN_UPSTREAM_FAILURE',\n      retryable: true,\n      channel\n    \};\n  \}\n"
          acq_repl="""  } catch (error) {
            const detail = error instanceof Error ? error.message : String(error);
            const metadata = manualRecheckFailureMetadata(error);
            console.warn(`[Manual Recheck] Fresh YouTube creator acquisition failed for ${channelId}; preserving prior trading classification: ${detail}`);
            return {
              success: false,
              message: `Manual re-scan could not acquire fresh YouTube creator evidence. Existing trading classification was preserved. ${detail}`,
              code: metadata.code || 'MANUAL_RESCAN_UPSTREAM_FAILURE',
              retryable: metadata.retryable,
              errorClass: metadata.errorClass,
              status: metadata.status,
              providerReasons: metadata.providerReasons,
              retryAt: metadata.retryAt,
              channel
            };
          }
          """
          text=must_sub(acq_pattern,acq_repl,text,'queue acquisition catch')

          down_pattern=r"    const code = String\(error\?\.code \|\| 'MANUAL_RESCAN_OPERATIONAL_FAILURE'\);\n    console\.warn\(`\[Manual Recheck\] Reclassification failed operationally for \$\{channelId\}; preserving prior decision where no complete classification was produced: \$\{detail\}`\);\n    return \{\n      success: false,\n      message: `Manual re-scan could not complete a reliable trading reclassification\.[^`]*\$\{detail\}`,\n      code,\n      retryable: error\?\.retryable !== false,\n      channel: preserved\n    \};"
          down_repl="""    const metadata = manualRecheckFailureMetadata(error);
            const code = String(metadata.code || error?.code || 'MANUAL_RESCAN_OPERATIONAL_FAILURE');
            console.warn(`[Manual Recheck] Reclassification failed operationally for ${channelId}; preserving prior decision where no complete classification was produced: ${detail}`);
            return {
              success: false,
              message: `Manual re-scan could not complete a reliable trading reclassification. Existing classification was preserved where the classifier had incomplete provider coverage. ${detail}`,
              code,
              retryable: metadata.retryable,
              errorClass: metadata.errorClass,
              status: metadata.status,
              providerReasons: metadata.providerReasons,
              retryAt: metadata.retryAt,
              channel: preserved
            };"""
          text=must_sub(down_pattern,down_repl,text,'queue downstream catch')

          wrapper="""
          export async function triggerQuotaGatedManualRecheck(channelId: string, enableDebug?: boolean): Promise<ManualRecheckResult> {
            const operationId = `manual_http_recheck:${channelId}:${randomUUID()}`;
            const reserved = await reserveOfficialRecheck(operationId);
            if (!reserved) {
              return { success: false, message: 'Manual re-scan could not start because the official YouTube enrichment quota gate is currently full.', code: 'MANUAL_RESCAN_QUOTA_UNAVAILABLE', retryable: true };
            }
            try {
              const result = await triggerManualRecheck(channelId, enableDebug);
              await finishOfficialRecheck(operationId, result.success);
              return result;
            } catch (error) {
              await finishOfficialRecheck(operationId, false).catch(() => undefined);
              throw error;
            }
          }
          """
          marker2='\nexport interface SearchExecutionResult {'
          if marker2 not in text: raise SystemExit('SearchExecutionResult marker missing')
          text=text.replace(marker2,wrapper+marker2,1)
          write(p,text)

          p='server.ts'; text=read(p)
          if '  triggerManualRecheck,\n' not in text: raise SystemExit('server import triggerManualRecheck missing')
          text=text.replace('  triggerManualRecheck,\n','  triggerQuotaGatedManualRecheck,\n',1)
          old="const result = await triggerManualRecheck(req.params.id, req.query.debug === 'true');"
          if old not in text: raise SystemExit('server direct recheck route call missing')
          text=text.replace(old,"const result = await triggerQuotaGatedManualRecheck(req.params.id, req.query.debug === 'true');",1)
          write(p,text)

          # Operational workers: central quota helper + typed-only attempt-free mapping.
          p='server/operationalMaintenanceWorkers.ts'; text=read(p)
          text=must_sub(r"import \{\n  claimNextJob,\n  completeJob,\n  failJob,\n  finishQuotaReservation,\n  getAppSetting,\n  getDailyYouTubeQuotaBudget,\n  getYouTubeKeyPool,\n  heartbeatJob,\n  tryReserveQuota\n\} from './db';", "import {\n  claimNextJob,\n  completeJob,\n  failJob,\n  heartbeatJob,\n} from './db';\nimport { finishOfficialRecheck, reserveOfficialRecheck } from './officialRecheckQuota';", text, 'worker imports')
          text=text.replace("const OFFICIAL_RECHECK_UNITS_PER_PROVIDER = 101;\n",'')
          text=must_sub(r"\nasync function reserveOfficialRecheck\(operationId: string\): Promise<boolean> \{.*?\n\}\n\nfunction startCommunityRetryWorker", "\nconst ATTEMPT_FREE_RECOVERY_ERROR_CLASSES = new Set(['TIMEOUT', 'CANCELLED', 'RATE_LIMIT', 'TRANSIENT', 'CREDENTIALS_EXHAUSTED']);\n\nfunction isTypedTransientRecoveryFailure(result: Awaited<ReturnType<typeof triggerManualRecheck>>): boolean {\n  if (result.retryable !== true) return false;\n  if (result.code === 'YOUTUBE_PROVIDERS_COOLING_DOWN') return true;\n  return typeof result.errorClass === 'string' && ATTEMPT_FREE_RECOVERY_ERROR_CLASSES.has(result.errorClass);\n}\n\nfunction startCommunityRetryWorker", text, 'worker local reserve helper', re.S)
          text=text.replace("finishQuotaReservation('OPERATIONAL_RECHECK', operationId, processed)","finishOfficialRecheck(operationId, processed)")
          text=text.replace("finishQuotaReservation('OPERATIONAL_RECHECK', operationId, false)","finishOfficialRecheck(operationId, false)")
          text=text.replace("finishQuotaReservation('OPERATIONAL_RECHECK', operationId, true)","finishOfficialRecheck(operationId, true)")
          failure_pattern=r"      if \(!result\.success\) \{\n        const retryable = result\.retryable === true;\n        const error = Object\.assign\(new Error\(result\.message\), \{\n          code: result\.code,\n          retryable,\n          // triggerManualRecheck intentionally wraps upstream provider errors in\n          // MANUAL_RESCAN_UPSTREAM_FAILURE\. Restore infrastructure semantics for\n          // failJob so transient provider outages do not consume normal attempts\.\n          errorClass: retryable \? 'TRANSIENT' : undefined\n        \}\);\n        throw error;\n      \}"
          failure_repl="""      if (!result.success) {
                const typedTransient = isTypedTransientRecoveryFailure(result);
                const error = Object.assign(new Error(result.message), {
                  code: result.code,
                  retryable: typedTransient,
                  errorClass: typedTransient ? (result.errorClass || 'TRANSIENT') : result.errorClass,
                  status: result.status,
                  providerReasons: result.providerReasons,
                  retryAt: result.retryAt,
                });
                throw error;
              }"""
          text=must_sub(failure_pattern,failure_repl,text,'worker recovery failure mapping')
          write(p,text)

          # YouTube: a successful no-item channels.list is permanent and stops key rotation.
          p='server/youtube.ts'; text=read(p)
          old="if (!channel) throw new Error(`YouTube channel '${channelId}' was not found.`);"
          if old not in text: raise SystemExit('youtube missing-channel throw missing')
          text=text.replace(old,"if (!channel) throw Object.assign(new ProviderCallError(`YouTube channel '${channelId}' was not found.`, 'PERMANENT_INPUT', false, { status: 404 }), { code: 'YOUTUBE_CHANNEL_NOT_FOUND' });",1)
          enrichment_start=text.index('export async function fetchYouTubeChannelEnrichment')
          enrichment_end=text.index('/** One-unit metadata hydration',enrichment_start)
          block=text[enrichment_start:enrichment_end]
          block=must_sub(r"    \} catch \(error: any\) \{\n      recordProviderFailure\(apiKey,error\);\n      if \(isQuotaExceeded\(error\)\) quotaExceededCount\+\+;\n      lastError = error instanceof Error \? error : new Error\(String\(error\)\);\n    \}", "    } catch (error: any) {\n      recordProviderFailure(apiKey,error);\n      if (isQuotaExceeded(error)) quotaExceededCount++;\n      lastError = error instanceof Error ? error : new Error(String(error));\n      if (error instanceof ProviderCallError && error.errorClass === 'PERMANENT_INPUT') break;\n    }", block, 'youtube enrichment catch')
          text=text[:enrichment_start]+block+text[enrichment_end:]
          write(p,text)

          # Browser fallback: process-wide cap to bound parallel Chromium/Crawlee instances.
          p='server/browserCommunityFallback.ts'; text=read(p)
          anchor="const COMMUNITY_HINTS = /discord|community|join|chat|member|membership|vip|group|private|trading.?room|links?|social|contact|about/i;\n"
          if anchor not in text: raise SystemExit('browser COMMUNITY_HINTS marker missing')
          semaphore="""
          const configuredRenderedFallbackConcurrency = Number(process.env.BROWSER_FALLBACK_CONCURRENCY || 1);
          export const BROWSER_FALLBACK_MAX_CONCURRENCY = Math.min(2, Math.max(1, Number.isFinite(configuredRenderedFallbackConcurrency) ? Math.floor(configuredRenderedFallbackConcurrency) : 1));
          let activeRenderedFallbacks = 0;
          const renderedFallbackWaiters: Array<() => void> = [];

          async function acquireRenderedFallbackSlot(): Promise<void> {
            if (activeRenderedFallbacks < BROWSER_FALLBACK_MAX_CONCURRENCY) { activeRenderedFallbacks++; return; }
            await new Promise<void>(resolve => renderedFallbackWaiters.push(resolve));
          }

          function releaseRenderedFallbackSlot(): void {
            const next = renderedFallbackWaiters.shift();
            if (next) { next(); return; }
            activeRenderedFallbacks = Math.max(0, activeRenderedFallbacks - 1);
          }
          """
          text=text.replace(anchor,anchor+semaphore,1)
          text=text.replace("  const startedAt = Date.now();\n",'',1)
          direct="  if (foundInvite) return { foundInvite, foundLocation, inspectedPages, scrolls, clicks, complete: true, retryable: false, detail: 'Direct Discord invite in seed URL' };\n\n  try {"
          if direct not in text: raise SystemExit('browser direct/try marker missing')
          text=text.replace(direct,"  if (foundInvite) return { foundInvite, foundLocation, inspectedPages, scrolls, clicks, complete: true, retryable: false, detail: 'Direct Discord invite in seed URL' };\n\n  await acquireRenderedFallbackSlot();\n  const startedAt = Date.now();\n  try {",1)
          tail="""  } catch (error: any) {
            return {
              foundInvite: null,
              inspectedPages,
              scrolls,
              clicks,
              complete: false,
              retryable: true,
              detail: `Rendered acquisition unavailable or failed: ${String(error?.message || error)}`,
            };
          }
          }
          """
          if tail not in text: raise SystemExit('browser catch tail missing')
          text=text.replace(tail,"""  } catch (error: any) {
            return {
              foundInvite: null,
              inspectedPages,
              scrolls,
              clicks,
              complete: false,
              retryable: true,
              detail: `Rendered acquisition unavailable or failed: ${String(error?.message || error)}`,
            };
          } finally {
            releaseRenderedFallbackSlot();
          }
          }
          """,1)
          write(p,text)

          # Update focused contracts.
          p='server/operationalMaintenanceWorkers.test.ts'; text=read(p)
          start=text.index("test('ordinary official rescans reserve")
          end=text.index("test('false-negative recovery reserves",start)
          new_test="""test('ordinary official rescans use the centralized ENRICHMENT quota gate', () => {
            assert.match(workers, /reserveOfficialRecheck/);
            assert.match(workers, /finishOfficialRecheck/);
          });

          """
          text=text[:start]+new_test+text[end:]
          start=text.index("test('false-negative recovery maps wrapped upstream failures")
          end=text.index("test('maintenance concurrency",start)
          new_test2="""test('false-negative recovery maps only typed transient failures to attempt-free retries', () => {
            assert.match(workers, /isTypedTransientRecoveryFailure/);
            assert.match(workers, /ATTEMPT_FREE_RECOVERY_ERROR_CLASSES/);
            assert.doesNotMatch(workers, /errorClass: retryable \\? 'TRANSIENT'/);
          });

          """
          text=text[:start]+new_test2+text[end:]
          write(p,text)

          p='server/browserCommunityFallback.test.ts'; text=read(p)
          text=text.replace("import { DEFAULT_BROWSER_FALLBACK_BUDGET, shouldEscalateToRenderedFallback } from './browserCommunityFallback';","import { BROWSER_FALLBACK_MAX_CONCURRENCY, DEFAULT_BROWSER_FALLBACK_BUDGET, shouldEscalateToRenderedFallback } from './browserCommunityFallback';",1)
          text=text.replace("  assert.ok(DEFAULT_BROWSER_FALLBACK_BUDGET.totalTimeoutMs <= 35_000);","  assert.ok(DEFAULT_BROWSER_FALLBACK_BUDGET.totalTimeoutMs <= 35_000);\n  assert.ok(BROWSER_FALLBACK_MAX_CONCURRENCY <= 2);",1)
          write(p,text)
          PY
          python3 /tmp/apply_pr230.py
      - name: Focused tests
        run: node --import tsx --test server/postMergeRecheckSafety.contract.test.ts server/operationalMaintenanceWorkers.test.ts server/manualRecheckClassification.test.ts server/youtubeHttpError.test.ts server/browserCommunityFallback.test.ts server/browserCommunityFallback.integration.test.ts server/provider2Removal.contract.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts server
          git commit -m "Harden manual recheck recovery and concurrency"
          git push origin HEAD:fix/post-merge-recheck-safety
