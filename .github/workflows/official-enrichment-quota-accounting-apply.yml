name: Official Enrichment Quota Accounting Applicator
on:
  push:
    branches:
      - fix/official-enrichment-quota-accounting
    paths:
      - .github/workflows/official-enrichment-quota-accounting-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/official-enrichment-quota-accounting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply accounting fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/youtube.ts')
          s=p.read_text()
          a="const [channelResponse, recentResponse] = await Promise.all([youtubeFetch(channelUrl,'channel-details',1,attempt+1,acquisition),youtubeFetch(recentUrl,'channel-uploads',100,attempt+1,acquisition)]);"
          b="const recentResponse = await youtubeFetch(recentUrl,'channel-uploads',100,attempt+1,acquisition);\n      const recentData = await readYouTubeJsonObject(recentResponse, 'channel-uploads');\n      await incrementQuota(100);\n      const channelResponse = await youtubeFetch(channelUrl,'channel-details',1,attempt+1,acquisition);"
          if s.count(a)!=1: raise SystemExit('stage1 request anchor mismatch')
          s=s.replace(a,b,1)
          s=s.replace("      activeKeyIndex = currentIndex;\n      await incrementQuota(101);\n      const channelData = await readYouTubeJsonObject(channelResponse, 'channel-details');\n      const recentData = await readYouTubeJsonObject(recentResponse, 'channel-uploads');","      const channelData = await readYouTubeJsonObject(channelResponse, 'channel-details');\n      await incrementQuota(1);\n      activeKeyIndex = currentIndex;",1)
          p.write_text(s)
          PY
      - run: node --import tsx --test server/officialEnrichmentQuotaAccounting.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit result
        run: |
          rm .github/workflows/official-enrichment-quota-accounting-apply.yml
          git config user.name youtube-quota-accounting-bot
          git config user.email actions@users.noreply.github.com
          git add server/youtube.ts .github/workflows/official-enrichment-quota-accounting-apply.yml
          git commit -m 'Account stage-one enrichment quota per successful request'
          git push origin HEAD:fix/official-enrichment-quota-accounting
