name: PR237 propagate failure marker
on:
  push:
    branches: [fix/restore-per-provider-429-failover]
    paths: [.github/workflows/pr237-propagate-failure-marker.yml]
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-per-provider-429-failover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply marker propagation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('server/youtube.ts')
          source=path.read_text()
          old="""  } catch(error) {\n    if(dispatchedProviderKey&&error&&typeof error==='object')Object.assign(error,{providerKey:dispatchedProviderKey});\n    throw error;\n  }\n}\n"""
          new="""  } catch(error) {\n    if(dispatchedProviderKey&&error&&typeof error==='object'){\n      const wrappedCause=(error as any).cause;\n      const providerFailureRecorded=(error as any).providerFailureRecorded===true||(wrappedCause&&typeof wrappedCause==='object'&&(wrappedCause as any).providerFailureRecorded===true);\n      Object.assign(error,{providerKey:dispatchedProviderKey,...(providerFailureRecorded?{providerFailureRecorded:true}:{})});\n    }\n    throw error;\n  }\n}\n"""
          if old not in source:
              raise SystemExit('youtubeFetch catch block not found')
          source=source.replace(old,new,1)
          path.write_text(source)

          test=Path('server/youtubeRequestScheduler.test.ts')
          tests=test.read_text()
          anchor="test('provider-loop requests carry the selected API key into scheduler dispatch', () => {\n"
          addition="""test('youtubeFetch preserves the already-recorded provider failure marker through ProviderCallError wrapping', () => {\n  const source = fs.readFileSync(new URL('./youtube.ts', import.meta.url), 'utf8');\n  const youtubeFetch = source.slice(source.indexOf('async function youtubeFetch'), source.indexOf('export type YouTubeAdditionalQuotaCallback'));\n  assert.match(youtubeFetch, /const wrappedCause=\\(error as any\\)\\.cause/);\n  assert.match(youtubeFetch, /providerFailureRecorded=.*wrappedCause/);\n  assert.match(youtubeFetch, /providerFailureRecorded:true/);\n});\n\n"""
          if addition not in tests:
              if anchor not in tests:
                  raise SystemExit('test anchor not found')
              tests=tests.replace(anchor,addition+anchor,1)
              test.write_text(tests)
          PY
      - run: npx tsx --test server/youtubeRequestScheduler.test.ts server/youtubeProviderCooldown.test.ts
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/youtube.ts server/youtubeRequestScheduler.test.ts
          git commit -m "Propagate YouTube provider failure marker through wrapping"
          git push origin HEAD:fix/restore-per-provider-429-failover
