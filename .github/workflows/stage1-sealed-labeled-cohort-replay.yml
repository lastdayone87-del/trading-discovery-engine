name: Stage 1 sealed labeled cohort replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/candidateAdmission/stage1SealedDatasetReplay.ts'
      - 'server/candidateAdmission/stage1SealedDatasetReplay.test.ts'
      - 'scripts/stage1SealedDatasetReplay.ts'
      - '.github/workflows/stage1-sealed-labeled-cohort-replay.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Stage 1 sealed cohort tests
        run: node --import tsx --test server/candidateAdmission/stage1SealedDatasetReplay.test.ts
      - name: Build
        run: npm run build
      - name: Verify non-serving contract
        run: |
          set -euo pipefail
          grep -q 'servingAuthority: false' server/candidateAdmission/stage1SealedDatasetReplay.ts
          grep -q 'automaticPromotion: false' server/candidateAdmission/stage1SealedDatasetReplay.ts
          ! grep -E '\b(INSERT|UPDATE|DELETE|TRUNCATE|ALTER|CREATE|DROP)\b' server/candidateAdmission/stage1SealedDatasetReplay.ts scripts/stage1SealedDatasetReplay.ts

  production-replay:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run read-only sealed labeled cohort replay
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:+x}"
          npx tsx scripts/stage1SealedDatasetReplay.ts > stage1-sealed-console.json
          test -f stage1-output/stage1-sealed-labeled-cohort-replay.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('stage1-output/stage1-sealed-labeled-cohort-replay.json').read_text())
          assert report['readOnly'] is True
          assert report['servingAuthority'] is False
          assert report['automaticPromotion'] is False
          print(json.dumps({'dataset': report['dataset'], 'totals': report['totals'], 'metrics': report['metrics']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-sealed-labeled-cohort-replay-${{ github.run_id }}
          path: |
            stage1-output/stage1-sealed-labeled-cohort-replay.json
            stage1-sealed-console.json
          retention-days: 30
