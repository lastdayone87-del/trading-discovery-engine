name: Research bootstrap E2E PostgreSQL

on:
  pull_request:
    paths:
      - 'server/persistentResearchController.ts'
      - 'server/persistentResearchPhase6.ts'
      - 'server/persistentResearchPhase5.ts'
      - 'server/persistentResearchPhase4.ts'
      - 'server/persistentResearchPhase3.ts'
      - 'server/persistentResearchPhase2.ts'
      - 'server/persistentResearch.ts'
      - 'server/portfolioAllocator.ts'
      - 'server/db.ts'
      - 'server/dbCore.ts'
      - 'server/researchBootstrap.e2e.postgres.test.ts'
      - 'server/policyPromotion.postgres.test.ts'
      - 'server/projectEntityCredits.postgres.test.ts'
      - 'server/db/migrations/**'
      - 'scripts/runMigrations.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/research-bootstrap-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research_bootstrap_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d research_bootstrap_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/research_bootstrap_e2e
      RESEARCH_E2E_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/research_bootstrap_e2e
      RESEARCH_BOOTSTRAP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/research_bootstrap_e2e
      PGSSL: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply migrations to isolated test database
        run: npx tsx scripts/runMigrations.ts
      - name: Research bootstrap end-to-end lifecycle test
        run: npx tsx --test server/researchBootstrap.e2e.postgres.test.ts
      - name: Promotion gate matrix tests
        run: npx tsx --test server/policyPromotion.postgres.test.ts
      - name: Entity credit regression tests
        run: npx tsx --test server/projectEntityCredits.postgres.test.ts
