name: Apply Enrichment Operational Fix

on:
  push:
    branches: [fix/enrichment-operational-failures]
    paths: ['.github/workflows/apply-enrichment-operational-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrichment-operational-failures
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply runtime guard, recovery correction, and regressions
        shell: python
        run: |
          from pathlib import Path

          helper = Path('server/enrichmentOperationalFailure.ts')
          helper.write_text("""import type { EvidenceCollectionReport } from './evidenceEngine';
          import { ProviderCallError } from './providerResilience';

          const OPERATIONAL_PROVIDER_REASONS = new Set([
            'PROVIDER_TIMEOUT',
            'PROVIDER_RATE_LIMIT',
            'PROVIDER_TRANSIENT_FAILURE',
            'PROVIDER_CREDENTIALS_EXHAUSTED',
            'PROVIDER_CANCELLED',
            'PROVIDER_EXECUTION_FAILED'
          ]);

          /**
           * An enrichment pass may only advance evidentiary uncertainty when provider
           * coverage was actually observed. Operational degradation is infrastructure,
           * not ambiguity, so surface it as an attempt-free durable retry instead.
           */
          export function enrichmentOperationalFailure(
            report: EvidenceCollectionReport,
            isEnrichmentPass: boolean
          ): ProviderCallError | null {
            if (!isEnrichmentPass || !report.degraded) return null;
            const reasonCodes = report.providers
              .filter(provider => provider.availability === 'FAILED')
              .flatMap(provider => provider.reasonCodes || [])
              .filter(code => OPERATIONAL_PROVIDER_REASONS.has(code));
            if (!reasonCodes.length) return null;
            return new ProviderCallError(
              'Enrichment classification provider coverage is operationally degraded; retry after provider recovery.',
              'TRANSIENT',
              true,
              { providerReasons: [...new Set(reasonCodes)] }
            );
          }
          """)

          p = Path('server/ingestionPipeline.ts')
          text = p.read_text()
          import_anchor = "import { deterministicUuid, entityChecksum, observeYouTubeChannelEntity, sourceFamilyIdentity } from './entityResolution';\n"
          import_line = "import { enrichmentOperationalFailure } from './enrichmentOperationalFailure';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('ingestion import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          guard_anchor = "  const productionClassification = await classifyTradingRelevanceDetailed(classifierInput);\n"
          guard = "  const productionClassification = await classifyTradingRelevanceDetailed(classifierInput);\n  const enrichmentProviderFailure=enrichmentOperationalFailure(productionClassification.decision.evidenceCollection,isEnrichmentPass);\n  if(enrichmentProviderFailure) throw enrichmentProviderFailure;\n"
          if "enrichmentProviderFailure=enrichmentOperationalFailure" not in text:
              if guard_anchor not in text:
                  raise SystemExit('classification guard anchor not found')
              text = text.replace(guard_anchor, guard, 1)
          p.write_text(text)

          Path('server/enrichmentOperationalFailure.test.ts').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { enrichmentOperationalFailure } from './enrichmentOperationalFailure';
          import { decideJobFailure } from './db';
          import { resolveUncertainLifecycle } from './enrichmentLifecycle';
          import type { EvidenceCollectionReport } from './evidenceEngine';

          function report(degraded:boolean, reasonCodes:string[]=[]):EvidenceCollectionReport {
            return {
              sufficiency:'SUFFICIENT', sparseMetadata:false, degraded, fieldsPresent:['video_titles'], reasonCodes:[],
              providers:[{provider:'gemini_semantic',availability:degraded?'FAILED':'AVAILABLE',evidenceCount:0,outcome:degraded?'FAILED_PROVIDER':'EXECUTED_NO_MATCH',reasonCodes}],
              terminalNegativeSufficiency:{status:'INSUFFICIENT',creatorLevelCoverage:false,independentSourceFamilies:0,independentObservations:0,reasonCodes:['TERMINAL_NEGATIVE_EVIDENCE_INSUFFICIENT']}
            };
          }

          test('degraded enrichment becomes an attempt-free infrastructure retry instead of review',()=>{
            const error=enrichmentOperationalFailure(report(true,['PROVIDER_TIMEOUT']),true);
            assert.ok(error);
            assert.equal(error!.retryable,true);
            assert.equal(error!.errorClass,'TRANSIENT');
            assert.equal(decideJobFailure(error,4,4,1_700_000_000_000).disposition,'RETRYING_WITHOUT_ATTEMPT');
          });

          test('all governed operational provider failure classes are retryable during enrichment',()=>{
            for(const reason of ['PROVIDER_TIMEOUT','PROVIDER_RATE_LIMIT','PROVIDER_TRANSIENT_FAILURE','PROVIDER_CREDENTIALS_EXHAUSTED','PROVIDER_CANCELLED','PROVIDER_EXECUTION_FAILED']) {
              assert.ok(enrichmentOperationalFailure(report(true,[reason]),true),reason);
            }
          });

          test('non-enrichment and permanent-input degradation are not rewritten by this guard',()=>{
            assert.equal(enrichmentOperationalFailure(report(true,['PROVIDER_TIMEOUT']),false),null);
            assert.equal(enrichmentOperationalFailure(report(true,['PROVIDER_PERMANENT_INPUT']),true),null);
          });

          test('fully observed genuine ambiguity can still reach human review',()=>{
            assert.equal(enrichmentOperationalFailure(report(false),true),null);
            assert.deepEqual(resolveUncertainLifecycle(true),{scanStatus:'NEEDS_REVIEW',tradingStatus:'NEEDS_REVIEW',shouldEnqueue:false});
          });
          """)

          Path('server/db/migrations/086_recover_operational_enrichment_reviews.sql').write_text("""-- Recover only automated NEEDS_REVIEW rows whose current classification or
          -- latest enrichment outcome is operationally degraded. Historical failures are
          -- deliberately ignored when a newer enrichment outcome exists.

          CREATE TEMP TABLE recover_operational_enrichment_reviews ON COMMIT DROP AS
          WITH latest_enrichment AS (
            SELECT DISTINCT ON (j.payload->>'channelId')
              j.payload->>'channelId' AS channel_id,
              j.id,
              j.status,
              j.last_error,
              j.updated_at,
              j.created_at
            FROM jobs j
            WHERE j.type='ENRICH_CHANNEL'
              AND j.payload ? 'channelId'
            ORDER BY j.payload->>'channelId', j.updated_at DESC, j.created_at DESC, j.id DESC
          )
          SELECT c.channel_id, latest.id AS job_id
          FROM channels c
          LEFT JOIN channel_reviews r ON r.channel_id=c.channel_id
          LEFT JOIN latest_enrichment latest ON latest.channel_id=c.channel_id
          WHERE c.scan_status='NEEDS_REVIEW'
            AND c.trading_status='NEEDS_REVIEW'
            AND COALESCE(r.state::text,'PENDING')='PENDING'
            AND NOT EXISTS (SELECT 1 FROM channel_review_decisions d WHERE d.channel_id=c.channel_id)
            AND c.trading_status NOT IN ('NON_TRADING','HUMAN_REJECTED')
            AND c.country_status <> 'REJECTED'
            AND latest.id IS NOT NULL
            AND (
              EXISTS (
                SELECT 1
                FROM jsonb_array_elements_text(COALESCE(c.trading_relevance_breakdown->'reasoning','[]'::jsonb)) reason
                WHERE reason ILIKE '%Degraded Providers: true%'
                   OR reason ILIKE '%PROVIDER_COVERAGE_DEGRADED%'
                   OR reason ILIKE '%PROVIDER_TIMEOUT%'
                   OR reason ILIKE '%PROVIDER_RATE_LIMIT%'
                   OR reason ILIKE '%PROVIDER_TRANSIENT_FAILURE%'
                   OR reason ILIKE '%PROVIDER_CREDENTIALS_EXHAUSTED%'
                   OR reason ILIKE '%PROVIDER_CANCELLED%'
                   OR reason ILIKE '%PROVIDER_EXECUTION_FAILED%'
              )
              OR (
                latest.status='FAILED'
                AND (
                  latest.last_error ILIKE '%quota%'
                  OR latest.last_error ILIKE '%rate limit%'
                  OR latest.last_error ILIKE '%timeout%'
                  OR latest.last_error ILIKE '%timed out%'
                  OR latest.last_error ILIKE '%transient%'
                  OR latest.last_error ILIKE '%temporar%'
                  OR latest.last_error ILIKE '%ECONN%'
                  OR latest.last_error ILIKE '%EAI_AGAIN%'
                  OR latest.last_error ILIKE '%provider%cool%'
                )
              )
            );

          UPDATE channel_reviews r
          SET state='SUPERSEDED',updated_at=now()
          FROM recover_operational_enrichment_reviews recover
          WHERE r.channel_id=recover.channel_id AND r.state='PENDING';

          UPDATE channels c
          SET trading_status='UNCERTAIN',scan_status='ENRICHMENT_PENDING',updated_at=now()
          FROM recover_operational_enrichment_reviews recover
          WHERE c.channel_id=recover.channel_id;

          UPDATE jobs j
          SET status='PENDING',attempts=0,run_after=now(),locked_by=NULL,locked_at=NULL,
              last_error=NULL,completed_at=NULL,updated_at=now()
          FROM recover_operational_enrichment_reviews recover
          WHERE j.id=recover.job_id
            AND j.type='ENRICH_CHANNEL'
            AND j.status IN ('FAILED','COMPLETED','PENDING');
          """)

          # The one-time applicator must not remain in production history.
          Path('.github/workflows/apply-enrichment-operational-fix.yml').unlink()
      - name: Focused regression tests
        run: node --import tsx --test server/enrichmentOperationalFailure.test.ts server/retryLifecyclePolicy.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent degraded enrichment from becoming review"
          git push origin HEAD:fix/enrichment-operational-failures
