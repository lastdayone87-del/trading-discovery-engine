[variables]
NIXPACKS_NODE_VERSION = "22"
PLAYWRIGHT_BROWSERS_PATH = "0"

[phases.install]
cmds = [
  "npm ci",
  "PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium"
]

[phases.build]
cmds = [
  "PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --list",
  "npm run build"
]

[start]
cmd = "npm run migrate && npm run start"
