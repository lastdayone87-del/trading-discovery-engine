[variables]
NIXPACKS_NODE_VERSION = "22"
PLAYWRIGHT_BROWSERS_PATH = "/app/.cache/ms-playwright"

[phases.install]
cmds = [
  "npm ci",
  "npx playwright install --with-deps chromium"
]

[phases.build]
cmds = [
  "npx playwright install --list",
  "npm run build"
]

[start]
cmd = "npm run migrate && npm run start"
